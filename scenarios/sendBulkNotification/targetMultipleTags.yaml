openapi: 3.1.0
info:
  title: Netmera REST API
  version: '3.0'
servers:
- url: https://restapi.netmera.com
  description: Netmera REST API
security:
- NetmeraApiKey: []
tags:
- name: Bulk Notifications
  description: 'Send push notifications to an audience defined by tags, segments, profile attributes,

    location or all users. Covers mobile and web push, rich media, carousel, slider,

    multilanguage, custom buttons, scheduling and speed control.

    '
paths:
  /rest/3.0/sendBulkNotification:
    post:
      description: 'Users with any of the given tags receive the notification. Equivalent to `{"$or":
        [...]}`.


        Sends a push notification to a target audience.

        '
      operationId: sendBulkNotification
      requestBody:
        content:
          application/json:
            examples:
              targetMultipleTags:
                description: 'Users with any of the given tags receive the notification. Equivalent to
                  `{"$or": [...]}`.'
                summary: Target multiple tags (OR)
                value:
                  message:
                    platforms:
                    - IOS
                    - ANDROID
                    text: Check out the latest updates tailored for your interests!
                    title: Updates for You
                  target:
                    tag:
                    - Sport
                    - Casual
            schema:
              $ref: '#/components/schemas/BulkNotificationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  notificationKey:
                    description: Key of the created notification.
                    oneOf:
                    - type: integer
                    - type: string
                type: object
          description: 'The notification was accepted. The response contains the notification key of the

            created push, shown in the guide as `NotificationKey: 1000`. Save this value to

            reference the notification later, for example for an Android live push update.

            '
      summary: Send bulk notification
      tags:
      - Bulk Notifications
components:
  securitySchemes:
    NetmeraApiKey:
      type: apiKey
      in: header
      name: X-netmera-api-key
      description: 'REST API key. Available in the Netmera Panel under Developers > API.

        '
  schemas:
    AndroidOptions:
      type: object
      description: Optional parameters specific to Android.
      properties:
        title:
          type: string
          description: Notification title shown on Android, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: 'Name of a sound defined in the panel under Developers > Sounds, per platform.

            '
        vibration:
          type: boolean
          description: 'Android only. Enables or disables vibration when a device receives the push

            notification.

            '
        bigText:
          type: string
        mediaUrl:
          type: string
          description: Rich media URL. On Android an image may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of Android users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true
    BulkMessage:
      type: object
      description: Content and delivery options of a bulk notification.
      required:
      - title
      - platforms
      - text
      properties:
        title:
          type: string
          description: 'The campaign''s name, aiding in the identification of notifications on the panel.

            '
        platforms:
          type: array
          description: Specifies the platforms for push notification delivery.
          items:
            $ref: '#/components/schemas/Platform'
        text:
          type: string
          description: The message content of the push notification displayed to the user.
        message:
          type: string
          description: 'Additional message content used alongside `text` in the carousel and slider

            examples of the Netmera Developer Guide.

            '
        personalizedTitle:
          type: string
          description: 'When this field is provided and the corresponding profile attribute exists for
            the

            user, the web push notification''s title is set to the value of `personalizedTitle`.

            If the attribute is not set on the user, the notification is not sent.

            '
        personalizedMessage:
          type: string
          description: 'Personalized message with `@{attribute}` placeholders. Users who have the referenced

            profile attributes receive the personalized text; users missing any of them receive

            the default `text`.

            '
        categories:
          description: 'Message categories, as a single value or an array. Categories must be pre-defined
            in

            the panel under **Settings > Message Categories**.

            '
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - type: string
              - type: integer
        threadId:
          type: string
          description: 'ID used to group notifications in the notification center. Notifications sharing
            a

            `threadId` are grouped together. Supported on iOS and Android.

            '
        customJson:
          type: object
          description: 'Additional custom parameters, available on the device when the push notification
            is

            received. `refID` inside this object references a previously sent notification key

            for an Android live push update.

            '
          additionalProperties: true
        params:
          type: object
          description: 'Message parameters. Used for example with `_nm_badge_count` to set the iOS badge

            count.

            '
          additionalProperties: true
        click:
          $ref: '#/components/schemas/ClickAction'
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        iconUrl:
          type: string
          description: 'Icon URL of the notification. Required if the platforms include Chrome or Firefox.

            '
        wpChromeImage:
          type: string
          description: 'For Windows Chrome and Firefox users, the URL of the image displayed in the

            notification. The URL must begin with `https`.

            '
        interactionRequired:
          type: boolean
          description: 'Whether the notification persists until the user interacts with it, by clicking
            or

            dismissing it. The default value is false.

            '
        limit:
          type: integer
          description: 'The maximum number of users the notification is sent to. With 1 million users
            and a

            limit of 100,000, the notification is sent to 100,000 randomly selected users.

            Limits can also be set per platform inside the `ios` and `android` blocks.

            '
        ttl:
          type: string
          description: 'Time to live value of the notification. If a target device does not receive the

            notification within the given period, it will never be received. Example usage:

            `15d` means 15 days, `20h` means 20 hours and `30m` means 30 minutes.

            '
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        doNotNotify:
          type: boolean
          description: Whether to show the push notification in the notification center.
        labels:
          description: 'Label information added to the message. The label appears in the push report

            generated on the panel.

            '
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      additionalProperties: true
    BulkNotificationRequest:
      type: object
      description: 'Bulk notification request. `message` and `target` are the canonical top-level blocks;

        the carousel, slider and some web push examples in the Netmera Developer Guide place

        message fields directly at the root level, so additional root properties are permitted.

        '
      properties:
        message:
          description: 'Content and delivery options of the notification. In the guide''s carousel and
            slider

            examples the payload is flat — the message fields sit at the root level and `message`

            itself carries a text value — so a plain string is also accepted here.

            '
          oneOf:
          - $ref: '#/components/schemas/BulkMessage'
          - type: string
        target:
          $ref: '#/components/schemas/Target'
        languages:
          type: object
          description: 'Per-language overrides of `title`, `text` and `click`, keyed by language name.

            '
          additionalProperties:
            type: object
            properties:
              title:
                type: string
              text:
                type: string
              click:
                $ref: '#/components/schemas/ClickAction'
            additionalProperties: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        speed:
          $ref: '#/components/schemas/Speed'
        extRef:
          type: string
          description: 'External reference of the push notification — an identifier of the notification
            in

            your own system. Any ID may be assigned and queried by later.

            '
      additionalProperties: true
    ButtonSet:
      type: object
      description: 'Button set attached to the notification. Button sets must first be created in the
        panel

        under **Settings > Button Sets**; the button name itself is not mandatory. Besides the

        documented fields, each additional key is a button name mapped to its action URL

        (`$buttonSetName: $actionUrl`).

        '
      properties:
        id:
          type: integer
          description: 'Button set ID, visible in the panel under Settings > Button Sets.

            '
        buttonNames:
          type: object
          description: 'Renames buttons by mapping each old button name to a new one. If this field is

            omitted, notifications are sent with the existing button names.

            '
          additionalProperties:
            type: string
        setAttrOrTag:
          type: object
          description: 'Maps a button name to the profile attribute or tag set when that button is clicked.

            '
          additionalProperties:
            $ref: '#/components/schemas/SetAttrOrTagEntry'
      additionalProperties: true
    CarouselItem:
      type: object
      description: One item of a carousel push.
      properties:
        title:
          type: string
        content:
          type: string
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true
    CarouselItemClickAction:
      type: object
      description: Click action of a carousel or slider item.
      properties:
        action:
          type: string
          description: Action type, for example DEEP_LINK.
        url:
          type: string
        deeplinkType:
          type: string
          description: Deeplink type, for example URL.
        deepLinkUrl:
          type: string
      additionalProperties: true
    ClickAction:
      type: object
      description: 'Click behavior of the notification. `url` opens a web page in the device''s default

        browser (iOS and Android). `deeplink` launches the app via a registered deeplink URI

        (iOS and Android) and must be configured correctly in the app. `doNothing` disables the

        automatic click handling mechanism and is supported on Android only, which means a

        custom click handler must be implemented.

        '
      properties:
        url:
          type: string
          description: Web page opened in the device's default browser.
        deeplink:
          type: string
          description: Registered deeplink URI that launches the app.
        doNothing:
          type: boolean
          description: Android only. No action is triggered when the user taps the notification.
      additionalProperties: true
    IosOptions:
      type: object
      description: Optional parameters specific to iOS.
      properties:
        title:
          type: string
          description: Notification title shown on iOS, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: 'Name of a sound defined in the panel under Developers > Sounds, per platform.

            '
        badge:
          type: boolean
          description: Badge display. Badges are enabled only for iOS.
        mediaUrl:
          type: string
          description: Rich media URL. On iOS an image, sound or video may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of iOS users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true
    Location:
      type: object
      description: Geographical area used to target users based on their location.
      required:
      - latitude
      - longitude
      - radius
      properties:
        latitude:
          type: number
          description: The latitude of the center point.
        longitude:
          type: number
          description: The longitude of the center point.
        radius:
          type: number
          description: 'The radius value, in kilometers, from the center to search for users.

            '
    Platform:
      type: string
      description: 'Target platform. Values documented in the Netmera Developer Guide are `IOS`,

        `ANDROID`, `CHROME`, `FIREFOX`, `SAFARI`, `EDGE`, `OPERA`, `YANDEX`, `MACOS`,

        `EMAIL` and `SMS`. Push statistics responses additionally report `WP`.

        '
      examples:
      - IOS
      - ANDROID
      - CHROME
    Schedule:
      type: object
      description: Future delivery date and time of the message.
      properties:
        startTime:
          type: string
          description: Date and time when the message should be delivered.
          examples:
          - '2024-02-01T15:30:00'
        localTimezone:
          type: boolean
          description: Whether the start time is evaluated in the user's local timezone.
    SetAttrOrTagEntry:
      type: object
      description: 'Profile attribute or tag set when a button is clicked. The button click action must
        be

        set to "Open App"; the operation is triggered after the push open event inside the

        application module.

        '
      properties:
        setOnClick:
          type: string
          description: '`PROFILE_ATTR` for the profile attribute flow. In the tag flow the guide''s examples

            carry the attribute name in this field.

            '
        attrName:
          type: string
          description: Profile attribute name.
        attrValue:
          type: string
          description: Profile attribute value.
        tagName:
          type: string
          description: Tag name applied on click.
      additionalProperties: true
    SliderItem:
      type: object
      description: One item of a slider push.
      properties:
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true
    Speed:
      type: object
      description: Rate at which the notifications are sent, in chunks or packages.
      properties:
        intervalMins:
          type: integer
          description: Interval between packages, in minutes.
        packageSize:
          type: integer
          description: Number of notifications per package.
    Target:
      type: object
      description: 'Designated recipients of the notification. The target object cannot be empty — to
        send

        to all users of the selected platforms, set `sendToAll` to `true`.


        Profile attribute codes are listed in the Netmera Panel under

        **Developers > Profile Attributes > Code**. When multiple attributes are defined in the

        same `profile` object, the conditions are evaluated with AND logic; values inside a

        single attribute are connected with OR.

        '
      properties:
        sendToAll:
          type: boolean
          description: 'When true, the notification is dispatched to all users selected for the specified

            platforms.

            '
        tag:
          $ref: '#/components/schemas/TargetOperatorList'
        segment:
          $ref: '#/components/schemas/TargetOperatorList'
        profile:
          type: object
          description: 'Profile attribute conditions. Each key is a profile attribute code; the value
            can be

            a single value, an array of values, or an operator object such as

            `{"$exists": true}`. The operators `$or` and `$and` may also wrap a group of

            attribute conditions.

            '
          additionalProperties: true
        pa:
          type: object
          description: 'Profile attribute targeting used by `sendNotification`. Each key is a profile

            attribute code and each value a single value or an array of values (OR).

            '
          additionalProperties: true
        location:
          $ref: '#/components/schemas/Location'
        extId:
          description: 'External ID of the target user, or an array of external IDs. A maximum of 1000

            unique external IDs may be included in a single request.

            '
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        deviceToken:
          description: 'Device token of the target device, or an array of device tokens. A maximum of
            1000

            unique device tokens may be included in a single request.

            '
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        email:
          type: string
          description: Target email address.
        msisdn:
          type: string
          description: Target phone number.
      additionalProperties: true
    TargetOperatorList:
      description: 'A single value, an array of values (OR), or an operator object using `$or`, `$and`
        or

        `$not`.

        '
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        properties:
          $or:
            type: array
            items:
              type: string
          $and:
            type: array
            items:
              type: string
          $not:
            type: array
            items:
              type: string
        additionalProperties: true
