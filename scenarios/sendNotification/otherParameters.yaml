openapi: 3.1.0
info:
  title: Netmera REST API
  version: '3.0'
servers:
- url: https://restapi.netmera.com
  description: Netmera REST API
security:
- NetmeraApiKey: []
tags:
- name: Transactional Notifications
  description: 'Send pre-configured notification definitions to individual users, and create those

    definitions via the API.

    '
paths:
  /rest/3.0/sendNotification:
    post:
      description: Sends a pre-configured notification definition to individual users. The definition
        is referenced by its `notificationKey`.
      operationId: sendNotification
      requestBody:
        content:
          application/json:
            examples:
              otherParameters:
                summary: Other parameters (ttl, inbox, doNotNotify)
                value:
                  message:
                    doNotNotify: false
                    inbox: true
                    params: {}
                    ttl: 15d
                  notificationKey: '4'
                  target:
                    extId: user456
            schema:
              oneOf:
              - $ref: '#/components/schemas/SendNotificationRequest'
              - items:
                  $ref: '#/components/schemas/SendNotificationRequest'
                type: array
        required: true
      responses:
        '200':
          content:
            application/json:
              example: {}
              schema:
                description: Empty object. The API returns no fields on success.
                type: object
          description: 'The notification was accepted for delivery. Returns an empty JSON object. No

            message or delivery identifier is returned; use `getPushStats` or

            `getPushResult` with the notification key to inspect delivery.

            '
          x-netmera-verified: '2026-09-06'
        '400':
          content:
            application/json:
              example:
                code: 2004
                error: Field 'notificationKey' should be a text
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: '`notificationKey` was sent as a number instead of a string, or another field

            was sent with the wrong type.

            '
          x-netmera-verified: '2026-09-06'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Send transactional notification
      tags:
      - Transactional Notifications
components:
  securitySchemes:
    NetmeraApiKey:
      type: apiKey
      in: header
      name: X-netmera-api-key
      description: 'REST API key. Available in the Netmera Panel under Developers > API.

        '
  responses:
    Forbidden:
      description: 'Access was denied. The error table in the API description maps, for example, an invalid

        API key (`2010`), a blocked IP address (`2021`) and an unauthorized action (`2022`) to

        HTTP 403.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 'The request failed on the server. The error table in the API description maps, for

        example, an internal server error (`2001`) to HTTP 500.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AndroidOptions:
      type: object
      description: Optional parameters specific to Android.
      properties:
        title:
          type: string
          description: Notification title shown on Android, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: 'Name of a sound defined in the panel under Developers > Sounds, per platform.

            '
        vibration:
          type: boolean
          description: 'Android only. Enables or disables vibration when a device receives the push

            notification.

            '
        bigText:
          type: string
        mediaUrl:
          type: string
          description: Rich media URL. On Android an image may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of Android users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true
    ButtonSet:
      type: object
      description: 'Button set attached to the notification. Button sets must first be created in the
        panel

        under **Settings > Button Sets**; the button name itself is not mandatory. Besides the

        documented fields, each additional key is a button name mapped to its action URL

        (`$buttonSetName: $actionUrl`).

        '
      properties:
        id:
          type: integer
          description: 'Button set ID, visible in the panel under Settings > Button Sets.

            '
        buttonNames:
          type: object
          description: 'Renames buttons by mapping each old button name to a new one. If this field is

            omitted, notifications are sent with the existing button names.

            '
          additionalProperties:
            type: string
        setAttrOrTag:
          type: object
          description: 'Maps a button name to the profile attribute or tag set when that button is clicked.

            '
          additionalProperties:
            $ref: '#/components/schemas/SetAttrOrTagEntry'
      additionalProperties: true
    CarouselItem:
      type: object
      description: One item of a carousel push.
      properties:
        title:
          type: string
        content:
          type: string
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true
    CarouselItemClickAction:
      type: object
      description: Click action of a carousel or slider item.
      properties:
        action:
          type: string
          description: Action type, for example DEEP_LINK.
        url:
          type: string
        deeplinkType:
          type: string
          description: Deeplink type, for example URL.
        deepLinkUrl:
          type: string
      additionalProperties: true
    ClickAction:
      type: object
      description: 'Click behavior of the notification. `url` opens a web page in the device''s default

        browser (iOS and Android). `deeplink` launches the app via a registered deeplink URI

        (iOS and Android) and must be configured correctly in the app. `doNothing` disables the

        automatic click handling mechanism and is supported on Android only, which means a

        custom click handler must be implemented.

        '
      properties:
        url:
          type: string
          description: Web page opened in the device's default browser.
        deeplink:
          type: string
          description: Registered deeplink URI that launches the app.
        doNothing:
          type: boolean
          description: Android only. No action is triggered when the user taps the notification.
      additionalProperties: true
    ErrorResponse:
      type: object
      description: 'Application-level error envelope returned by the API.


        Framework-level failures such as an unmatched route do not use this shape; they

        return an RFC 9457 problem detail (`type`, `title`, `status`, `detail`, `instance`)

        instead.

        '
      properties:
        code:
          type: integer
          description: Netmera error code. See the error table in the API description.
        error:
          type: string
          description: Human-readable explanation of the failure.
      example:
        code: 2004
        error: Field 'notificationKey' should be a text
      x-netmera-verified: '2026-09-06'
    IosOptions:
      type: object
      description: Optional parameters specific to iOS.
      properties:
        title:
          type: string
          description: Notification title shown on iOS, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: 'Name of a sound defined in the panel under Developers > Sounds, per platform.

            '
        badge:
          type: boolean
          description: Badge display. Badges are enabled only for iOS.
        mediaUrl:
          type: string
          description: Rich media URL. On iOS an image, sound or video may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of iOS users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true
    Location:
      type: object
      description: Geographical area used to target users based on their location.
      required:
      - latitude
      - longitude
      - radius
      properties:
        latitude:
          type: number
          description: The latitude of the center point.
        longitude:
          type: number
          description: The longitude of the center point.
        radius:
          type: number
          description: 'The radius value, in kilometers, from the center to search for users.

            '
    SendNotificationRequest:
      type: object
      description: A single transactional notification send request.
      required:
      - notificationKey
      properties:
        notificationKey:
          type: string
          description: 'Key identifier of the specific notification definition intended for a user. The

            notification key is created in, and obtained from, the panel, or returned by

            `createNotificationDefinition`.


            The value must be sent as a **string**, even though

            `createNotificationDefinition` returns it as an integer. Sending it as an integer

            is rejected with Netmera error code 2004.

            '
        target:
          $ref: '#/components/schemas/Target'
        message:
          $ref: '#/components/schemas/TransactionalMessage'
        lastActiveDevice:
          type: boolean
          description: '`true` sends only to the user''s last active device; `false` sends to all devices.

            '
      additionalProperties: true
    SetAttrOrTagEntry:
      type: object
      description: 'Profile attribute or tag set when a button is clicked. The button click action must
        be

        set to "Open App"; the operation is triggered after the push open event inside the

        application module.

        '
      properties:
        setOnClick:
          type: string
          description: '`PROFILE_ATTR` for the profile attribute flow. In the tag flow the guide''s examples

            carry the attribute name in this field.

            '
        attrName:
          type: string
          description: Profile attribute name.
        attrValue:
          type: string
          description: Profile attribute value.
        tagName:
          type: string
          description: Tag name applied on click.
      additionalProperties: true
    SliderItem:
      type: object
      description: One item of a slider push.
      properties:
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true
    Target:
      type: object
      description: 'Designated recipients of the notification. The target object cannot be empty — to
        send

        to all users of the selected platforms, set `sendToAll` to `true`.


        Profile attribute codes are listed in the Netmera Panel under

        **Developers > Profile Attributes > Code**. When multiple attributes are defined in the

        same `profile` object, the conditions are evaluated with AND logic; values inside a

        single attribute are connected with OR.

        '
      properties:
        sendToAll:
          type: boolean
          description: 'When true, the notification is dispatched to all users selected for the specified

            platforms.

            '
        tag:
          $ref: '#/components/schemas/TargetOperatorList'
        segment:
          $ref: '#/components/schemas/TargetOperatorList'
        profile:
          type: object
          description: 'Profile attribute conditions. Each key is a profile attribute code; the value
            can be

            a single value, an array of values, or an operator object such as

            `{"$exists": true}`. The operators `$or` and `$and` may also wrap a group of

            attribute conditions.

            '
          additionalProperties: true
        pa:
          type: object
          description: 'Profile attribute targeting used by `sendNotification`. Each key is a profile

            attribute code and each value a single value or an array of values (OR).

            '
          additionalProperties: true
        location:
          $ref: '#/components/schemas/Location'
        extId:
          description: 'External ID of the target user, or an array of external IDs. A maximum of 1000

            unique external IDs may be included in a single request.

            '
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        deviceToken:
          description: 'Device token of the target device, or an array of device tokens. A maximum of
            1000

            unique device tokens may be included in a single request.

            '
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        email:
          type: string
          description: Target email address.
        msisdn:
          type: string
          description: Target phone number.
      additionalProperties: true
    TargetOperatorList:
      description: 'A single value, an array of values (OR), or an operator object using `$or`, `$and`
        or

        `$not`.

        '
      oneOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        properties:
          $or:
            type: array
            items:
              type: string
          $and:
            type: array
            items:
              type: string
          $not:
            type: array
            items:
              type: string
        additionalProperties: true
    TransactionalMessage:
      type: object
      description: Per-call overrides of a transactional notification definition.
      properties:
        params:
          type: object
          description: 'Custom parameters that tailor the notification to a specific user. A message

            configured as "Hello @{name}" with a `name` parameter produces "Hello John" or

            "Hello Mary". If a custom parameter differs from the parameter configured in the

            panel, the request value overwrites it.

            '
          additionalProperties: true
        click:
          $ref: '#/components/schemas/ClickAction'
        customJson:
          type: object
          description: Custom parameters available on the device when the push is received.
          additionalProperties: true
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        ttl:
          type: string
          description: 'Time to live value of the notification. Example usage: `15d` means 15 days, `20h`

            means 20 hours and `30m` means 30 minutes.

            '
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        doNotNotify:
          type: boolean
          description: Whether to show the push notification in the notification center.
      additionalProperties: true
