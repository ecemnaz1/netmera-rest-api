openapi: 3.1.0
info:
  title: Netmera REST API
  version: '3.0'
servers:
- url: https://restapi.netmera.com
  description: Netmera REST API
security:
- NetmeraApiKey: []
tags:
- name: Transactional Notifications
  description: 'Send pre-configured notification definitions to individual users, and create those

    definitions via the API.

    '
paths:
  /rest/3.0/createNotificationDefinition:
    post:
      description: Creates a transactional notification definition. The returned `notificationKey` is
        used in later `sendNotification` calls.
      operationId: createNotificationDefinition
      requestBody:
        content:
          application/json:
            examples:
              personalizedSubtext:
                summary: Personalized message and subtext
                value:
                  android:
                    bigText: Explore the latest announcement
                    mediaUrl: android_media_url_here
                    sound: android_sound
                    subtitle: Stay informed
                    thumbnailUrl: <android-thumbnail-url>
                    title: Exciting News
                    vibration: true
                  click:
                    deeplink: https://www.netmera.com
                  hook:
                    name: hook_name
                    params:
                      key1: val1
                      key2: val2
                  inbox: false
                  ios:
                    mediaUrl: ios_media_url_here
                    sound: ios_sound
                    subtitle: Stay informed
                    thumbnailUrl: <ios-thumbnail-url>
                    title: Exciting News
                  labels: Apple
                  message: Discover our latest updates!
                  personalizedMessage: 'Explore now: @{message}'
                  personalizedSubText: 'personalized subtext here : {@email} '
                  platforms:
                  - IOS
                  - ANDROID
                  title: New Announcement
            schema:
              $ref: '#/components/schemas/NotificationDefinitionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                notificationKey: 96
              schema:
                properties:
                  notificationKey:
                    description: Identifier of the created message definition.
                    type: integer
                type: object
          description: 'The definition was created. `notificationKey` is the identifier of the message

            definition, used in transactional message calls.


            The key is returned as an integer here, but `sendNotification` requires it as a

            string. Convert it before passing it on, or the call is rejected with Netmera

            error code 2004.

            '
          x-netmera-verified: '2026-09-06'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create notification definition
      tags:
      - Transactional Notifications
components:
  securitySchemes:
    NetmeraApiKey:
      type: apiKey
      in: header
      name: X-netmera-api-key
      description: 'REST API key. Available in the Netmera Panel under Developers > API.

        '
  responses:
    BadRequest:
      description: 'The request was rejected. The error table in the API description maps, for example,

        a field type mismatch (`2004`), invalid JSON (`2009`) and a missing required parameter

        (`2020`) to HTTP 400.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 2004
            error: Field 'notificationKey' should be a text
    Forbidden:
      description: 'Access was denied. The error table in the API description maps, for example, an invalid

        API key (`2010`), a blocked IP address (`2021`) and an unauthorized action (`2022`) to

        HTTP 403.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 'The request failed on the server. The error table in the API description maps, for

        example, an internal server error (`2001`) to HTTP 500.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AndroidOptions:
      type: object
      description: Optional parameters specific to Android.
      properties:
        title:
          type: string
          description: Notification title shown on Android, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: 'Name of a sound defined in the panel under Developers > Sounds, per platform.

            '
        vibration:
          type: boolean
          description: 'Android only. Enables or disables vibration when a device receives the push

            notification.

            '
        bigText:
          type: string
        mediaUrl:
          type: string
          description: Rich media URL. On Android an image may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of Android users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true
    ButtonSet:
      type: object
      description: 'Button set attached to the notification. Button sets must first be created in the
        panel

        under **Settings > Button Sets**; the button name itself is not mandatory. Besides the

        documented fields, each additional key is a button name mapped to its action URL

        (`$buttonSetName: $actionUrl`).

        '
      properties:
        id:
          type: integer
          description: 'Button set ID, visible in the panel under Settings > Button Sets.

            '
        buttonNames:
          type: object
          description: 'Renames buttons by mapping each old button name to a new one. If this field is

            omitted, notifications are sent with the existing button names.

            '
          additionalProperties:
            type: string
        setAttrOrTag:
          type: object
          description: 'Maps a button name to the profile attribute or tag set when that button is clicked.

            '
          additionalProperties:
            $ref: '#/components/schemas/SetAttrOrTagEntry'
      additionalProperties: true
    CarouselItem:
      type: object
      description: One item of a carousel push.
      properties:
        title:
          type: string
        content:
          type: string
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true
    CarouselItemClickAction:
      type: object
      description: Click action of a carousel or slider item.
      properties:
        action:
          type: string
          description: Action type, for example DEEP_LINK.
        url:
          type: string
        deeplinkType:
          type: string
          description: Deeplink type, for example URL.
        deepLinkUrl:
          type: string
      additionalProperties: true
    ClickAction:
      type: object
      description: 'Click behavior of the notification. `url` opens a web page in the device''s default

        browser (iOS and Android). `deeplink` launches the app via a registered deeplink URI

        (iOS and Android) and must be configured correctly in the app. `doNothing` disables the

        automatic click handling mechanism and is supported on Android only, which means a

        custom click handler must be implemented.

        '
      properties:
        url:
          type: string
          description: Web page opened in the device's default browser.
        deeplink:
          type: string
          description: Registered deeplink URI that launches the app.
        doNothing:
          type: boolean
          description: Android only. No action is triggered when the user taps the notification.
      additionalProperties: true
    ErrorResponse:
      type: object
      description: 'Application-level error envelope returned by the API.


        Framework-level failures such as an unmatched route do not use this shape; they

        return an RFC 9457 problem detail (`type`, `title`, `status`, `detail`, `instance`)

        instead.

        '
      properties:
        code:
          type: integer
          description: Netmera error code. See the error table in the API description.
        error:
          type: string
          description: Human-readable explanation of the failure.
      example:
        code: 2004
        error: Field 'notificationKey' should be a text
      x-netmera-verified: '2026-09-06'
    Hook:
      type: object
      description: 'Optional hook parameters. If no hook is to be attached, exclude the hook block from
        the

        request.

        '
      properties:
        name:
          type: string
        params:
          type: object
          additionalProperties: true
    IosOptions:
      type: object
      description: Optional parameters specific to iOS.
      properties:
        title:
          type: string
          description: Notification title shown on iOS, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: 'Name of a sound defined in the panel under Developers > Sounds, per platform.

            '
        badge:
          type: boolean
          description: Badge display. Badges are enabled only for iOS.
        mediaUrl:
          type: string
          description: Rich media URL. On iOS an image, sound or video may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of iOS users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true
    NotificationDefinitionRequest:
      type: object
      description: 'Transactional notification definition. The guide''s carousel and slider examples place

        the same fields either at the root level or inside a `message` block, so additional root

        properties are permitted.

        '
      properties:
        title:
          type: string
          description: 'The name of the campaign. Inside the iOS and Android blocks, `title` instead sets
            the

            notification title shown on that platform.

            '
        message:
          description: 'The default push notification message. If no personalized message is used, this

            message is sent to users.

            '
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
        text:
          type: string
          description: Notification text, used in the carousel and slider definition examples.
        personalizedMessage:
          type: string
          description: 'User-specific message using `@{xxxx}` placeholders. Placeholders can be profile

            attributes or values sent via a transactional message call.

            '
        personalizedTitle:
          type: string
          description: Personalized title using a placeholder.
        personalizedSubText:
          type: string
          description: Personalized subtext using a placeholder.
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        platforms:
          type: array
          description: Indicates the platforms capable of receiving this notification.
          items:
            $ref: '#/components/schemas/Platform'
        categories:
          description: 'Message categories. Either the category ID shown in the panel under

            **Settings > Message Categories** or the category name may be used, so values can be

            strings or integers.

            '
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - type: string
              - type: integer
        labels:
          description: 'Label information added to the message. The label appears in the push report

            generated on the panel.

            '
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        threadId:
          type: string
          description: ID used to group notifications in the notification center.
        click:
          $ref: '#/components/schemas/ClickAction'
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        hook:
          $ref: '#/components/schemas/Hook'
      additionalProperties: true
    Platform:
      type: string
      description: 'Target platform. Values documented in the Netmera Developer Guide are `IOS`,

        `ANDROID`, `CHROME`, `FIREFOX`, `SAFARI`, `EDGE`, `OPERA`, `YANDEX`, `MACOS`,

        `EMAIL` and `SMS`. Push statistics responses additionally report `WP`.

        '
      examples:
      - IOS
      - ANDROID
      - CHROME
    SetAttrOrTagEntry:
      type: object
      description: 'Profile attribute or tag set when a button is clicked. The button click action must
        be

        set to "Open App"; the operation is triggered after the push open event inside the

        application module.

        '
      properties:
        setOnClick:
          type: string
          description: '`PROFILE_ATTR` for the profile attribute flow. In the tag flow the guide''s examples

            carry the attribute name in this field.

            '
        attrName:
          type: string
          description: Profile attribute name.
        attrValue:
          type: string
          description: Profile attribute value.
        tagName:
          type: string
          description: Tag name applied on click.
      additionalProperties: true
    SliderItem:
      type: object
      description: One item of a slider push.
      properties:
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true
