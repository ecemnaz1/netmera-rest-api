  /rest/3.0/updateWhatsApp:
    post:
      operationId: updateWhatsApp
      tags: [WhatsApp]
      summary: Update WhatsApp Number
      description: |
        Updates a user's WhatsApp number. Both the external ID and the number are required.

        <details>

        <summary>Notes</summary>

        - Send the number in `wpNumber` as a single string that starts with `+` followed by the country
          code.
        - A missing field, an empty wpNumber or a number without `+` returns HTTP 400 with a plain-text
          message.
        - The former `wpNumbers` field is ignored. A request that sends only `wpNumbers` is treated as
          missing `wpNumber` and returns HTTP 400 with the plain-text body "Please provide a wpNumber.".
        - An unknown extId is ignored: nothing is created and the call still returns 200.
        - If another user already has that WhatsApp number, it is removed from that user first.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extId, wpNumber]
              properties:
                extId:
                  type: string
                  description: External user ID.
                wpNumber:
                  type: string
                  pattern: '^\+'
                  description: |
                    WhatsApp number including the country code; must start with `+`. A single
                    string, not an array (an array field `wpNumbers` is ignored and the call fails
                    with "Please provide a wpNumber.").
            example:
              extId: your_extId
              wpNumber: "+1234567890"
      responses:
        '200':
          description: |
            The WhatsApp number was updated. Returns no response body.
          x-netmera-verified: '2026-09-06'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            text/plain:
              schema:
                type: string
              examples:
                pleaseProvideAnExternalId:
                  summary: "`extId` is missing."
                  value: "Please provide an external id."
                pleaseProvideAWpnumber:
                  summary: "`wpNumber` is missing."
                  value: "Please provide a wpNumber."
                pleaseProvideAWpnumberWith:
                  summary: "`wpNumber` does not start with `+` and a country code."
                  value: "Please provide a wpNumber with country code."
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                titleBadRequestDetailFailed:
                  summary: "Malformed JSON, a field with the wrong JSON type, or an empty body."
