            takes precedence when both are sent.
          schema:
            type: string
          example: id1
        - name: deviceToken
          in: query
          required: false
          description: |
            Push token of one of the user's devices, used only when `extId` is blank. An unknown token
            returns HTTP 401, code `5007`.
          schema:
            type: string
        - name: additionalParams
          in: query
          required: false
          description: |
            Comma-separated extra fields to add to `profile`: `msisdn`, `email` (exact, case-sensitive, no
            spaces). Each is added only when the user has a non-empty value; unknown items are ignored.
          schema:
            type: string
          example: msisdn,email
