  /rest/3.0/sendNotification:
    post:
      operationId: sendNotification
      tags: [Push Notifications]
      summary: Send Transactional Notification
      description: |
        Sends a notification definition to individual users, for example an OTP or an order update. The
        definition is referenced by its `notificationKey`.

        {% hint style="danger" %}
        **Requests sent from Test it are real.** Test it opens a request panel; pressing **Send** in
        that panel calls the live API with the key you enter. With a production API key the message
        goes to every user, device or address in the request, and an array sends to each of them. Use
        a test application's key or your own test user.
        {% endhint %}

        ### Capabilities

        - **Single or batch sends** — Send one request object, or an array of them to send several messages
          in one call.
        - **Flexible recipients** — Identify users by `extId`, `deviceToken`, `msisdn`, `email`, `wpNumber`,
          `iid`, or profile attributes in `target.pa`.
        - **Per-call personalization** — Fill the definition's placeholders with `message.params` and
          override options such as `customJson`, `ttl` or the click action.

        ### How it works

        1. Create the definition in the panel or with `createNotificationDefinition`.
        2. Send its `notificationKey` with a `target` for each message.
        3. Netmera applies the per-call values in `message` and delivers the notification.

        <details>

        <summary>Notes</summary>

        - When one request contains several sends, a send that fails is skipped, for example one with an
          unknown notification key or an unknown user. The call still returns 200.
        - Only a malformed request fails as a whole.
        - If every `target.pa` key is unknown to the application, the request returns HTTP 400, code `2001`,
          "An unexpected error occurred. Retry later.", and nothing is sent.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SendNotificationRequest'
                - type: array
                  items:
                    $ref: '#/components/schemas/SendNotificationRequest'
            examples:
              single:
                summary: Single request by external ID
                value:
                  notificationKey: "106"
                  message:
                    params:
                      name: John Doe
                  target:
                    extId: user_id_in_your_system
              singleDeviceToken:
                summary: Single request by device token
                value:
                  notificationKey: "106"
                  message:
                    params:
                      name: John Doe
                  target:
                    deviceToken: APAaxpo02......12pxa
              chunksDifferent:
                summary: In chunks — different notifications or parameters
                value:
                  - notificationKey: "106"
                    message:
                      params:
                        name: John Doe
                    target:
                      extId: user_id_in_your_system_1
                  - notificationKey: "107"
                    message:
                      params:
                        price: 25
                    target:
                      extId: user_id_in_your_system_2
              chunksDifferentTokens:
                summary: In chunks with device tokens — different notifications or parameters
                value:
                  - notificationKey: "106"
                    message:
                      params:
                        name: John Doe
                    target:
                      deviceToken: APAaxpo02......12pxa
                  - notificationKey: "107"
                    message:
                      params:
                        price: 25
                    target:
                      deviceToken: APAaxpo02......21kde
              chunksSame:
                summary: In chunks — same notification and parameters
                value:
                  notificationKey: "106"
                  message:
                    params:
                      name: John Doe
                  target:
                    extId: [user_id_in_your_system_1, user_id_in_your_system_2]
              chunksSameTokens:
                summary: In chunks with device tokens — same notification and parameters
                value:
                  notificationKey: "106"
                  message:
                    params:
                      name: John Doe
                  target:
                    deviceToken: [APAaxpo02......21kde, APAaxpo02......32coa]
              badgeCount:
                summary: With badge count
                value:
                  notificationKey: "15107"
                  message:
                    params:
                      _nm_badge_count: 5
                  target:
                    extId: your_xid
              withDeeplink:
                summary: With deeplink
                value:
                  notificationKey: "3"
                  target:
                    extId: user123
                  message:
                    params: {}
                    click:
                      deeplink: https://www.google.com
              withUrl:
                summary: With URL
                value:
                  notificationKey: "3"
                  target:
                    extId: user123
                  message:
                    params: {}
                    click:
                      url: https://www.netmera.com
              withRichMedia:
                summary: With rich media
                value:
                  notificationKey: "3"
                  target:
                    extId: user123
                  message:
                    params: {}
                    ios:
                      mediaUrl: https://example.com/media-ios.mp4
                      title: iOS Title
                      subtitle: iOS Subtitle
                      thumbnailUrl: https://example.com/thumbnail-ios.png
                    android:
                      mediaUrl: https://example.com/media-android.mp4
                      title: Android Title
                      subtitle: Android Subtitle
                      bigText: Android Big Text
                      thumbnailUrl: https://example.com/thumbnail-android.png
              withSoundAndVibration:
                summary: With sound and vibration
                value:
                  notificationKey: "3"
                  target:
                    extId: user123
                  message:
                    params: {}
                    ios:
                      sound: custom_ios_sound
                    android:
                      vibration: true
                      sound: custom_android_sound
              withCustomParameters:
                summary: With custom parameters
                value:
                  notificationKey: "4"
                  target:
                    extId: user456
                  message:
                    params: {}
                    customJson:
                      key: custom_value
              otherParameters:
                summary: Other parameters (ttl, inbox, doNotNotify)
                value:
                  notificationKey: "4"
                  target:
                    extId: user456
                  message:
                    params: {}
                    ttl: 15d
                    inbox: true
                    doNotNotify: false
              lastActiveDevice:
                summary: To last active device
                value:
                  notificationKey: "2071"
                  lastActiveDevice: true
                  message:
                    params:
                      name: John
                  target:
                    extId: "123123123"
              profileAttributeTarget:
                summary: Target by profile attribute
                value:
                  notificationKey: "1000"
                  target:
                    pa:
                      pb: Smith
              profileAttributeMultiple:
                summary: Target by multiple profile attribute values
                value:
                  notificationKey: "1000"
                  target:
                    pa:
                      pb: [Smith, Johnson]
              renameButtons:
                summary: Rename button set buttons
                value:
                  notificationKey: "1000"
                  target:
                    extId: [exid, exid22]
                  message:
                    buttonSet:
                      id: 1
                      buttonNames:
                        button1: 15 GB-10 USD
                        button2: 15 GB-15 USD
                      15 GB-10 USD: https://www.google.com
                      15 GB-15 USD: https://www.youtube.com
              webTransactional:
                summary: Web transactional push
                value:
                  notificationKey: "2071"
                  target:
                    extId: YOUR USER IDENTIFIER
                  message:
                    params: {}
              webTransactionalDeeplink:
                summary: Web transactional push with deeplink
                value:
                  notificationKey: "1408"
                  target:
                    extId: exidname
                  message:
                    params: {}
                    click:
                      deeplink: https://www.netmera.com?id=5&name=@{exid}&cat=webpush
              email:
                summary: Email by notification key
                value:
                  notificationKey: "12"
                  target:
                    email: YOUR USER IDENTIFIER
                  message:
                    params: {}
              sms:
                summary: SMS by notification key
                value:
                  notificationKey: "3964"
                  target:
                    extId: YOUR USER IDENTIFIER
                  message:
                    params: {}
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The notification was accepted for delivery. The response is an empty JSON object.
          content:
            application/json:
              schema:
                type: object
