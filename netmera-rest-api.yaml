  /rest/3.0/sendEmailWithAttachment:
    post:
      operationId: sendEmailWithAttachment
      tags: [Email]
      summary: Send email with attachment
      description: |
        Sends an email with one or more attachments, referencing a notification key created in
        the panel. Submit the request as `multipart/form-data`.

        The email size and the total size of the attachments must not exceed **10 MB**.

        Supported file types: `image/png`, `video/x-msvideo`, `video/mp4`, `video/mpeg`,
        `video/mpeg2`, `video/x-mpeg`, `image/gif`, `image/jpeg`, `image/x-png`,
        `image/x-citrix-png`, `image/x-citrix-jpeg`, `text/plain`,
        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`,
        `application/vnd.ms-excel`, `text/csv`, `xlsx`, `xls`, `csv`, `txt`, `pdf`, `jpg`,
        `jpeg`, `png`, `gif`, `mpeg`, `mpeg-2`, `mp4`, `avi`.

        The guide documents this call against the host `https://netmera.com`, unlike the other
        endpoints which use `https://restapi.netmera.com`.
      servers:
        - url: https://netmera.com
          description: Host used for this endpoint in the Netmera Developer Guide.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [mailAttachment, to, notificationKey]
              properties:
                mailAttachment:
                  type: string
                  format: binary
                  description: The file to attach. More than one attachment may be added.
                to:
                  type: string
                  description: Recipient email address.
                  example: example@netmera.com
                notificationKey:
                  type: string
                  description: Notification key of the email definition created in the panel.
                  example: "1000"
      responses:
        '200':
          description: The email was accepted for delivery.

  /rest/3.0/sendBulkEmail:
    post:
      operationId: sendBulkEmail
      tags: [Email]
      summary: Send bulk email
      description: |
        Triggers an email template created in the Netmera panel by referencing its template ID.
        This is useful when email content is managed by an external system — such as a CRM —
        that passes send-time values directly to Netmera instead of the template being updated
        in the panel for each campaign.

        ### Capabilities

        | Capability | Description |
        | --- | --- |
        | Bulk email delivery | Send emails to a target audience group instead of a single user |
        | Template ID-based sending | Trigger a template created in the Netmera panel by referencing its ID |
        | Campaign-level custom parameters | Pass dynamic values as key-value pairs that map to placeholders defined in the template |
        | Attachment support | Include file attachments in the email delivery when required |

        ### How it works

        Each email template can contain placeholders such as `{DATE}`, `{TITLE}`, `{CONTENT}`
        or `{PDF_URL}`. Provide matching keys in `customParams`, and Netmera replaces each
        placeholder with the corresponding value at send time.

        ### Notes

        - If a placeholder exists in the template but no matching key is provided in
          `customParams`, that placeholder renders as empty in the delivered email.
        - The email template must be created in the Netmera panel before it is triggered
          via API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailTemplateId, subject, sendToAll]
              properties:
                emailTemplateId:
                  type: integer
                  description: The ID of the email template to trigger.
                subject:
                  type: string
                  description: The email subject line for this send request.
                customParams:
                  type: object
                  description: |
                    Key-value pairs that map to placeholders defined in the template.
                  additionalProperties: true
                sendToAll:
                  type: boolean
                  description: Set to true to send to all users.
            example:
              emailTemplateId: 5
              subject: Daily Bulletin - May 15
              customParams:
                DATE: 16.05.2026
                TITLE: Market Summary
                CONTENT: BIST 100 increased today.
                PDF_URL: https://cdn.example.com/report.pdf
              sendToAll: true
      responses:
        '200':
          description: The bulk email was accepted for delivery.

  /rest/3.0/addEmail:
    post:
      operationId: addEmail
      tags: [Email]
      summary: Add emails
      description: |
        Uploads or updates a list of email addresses in Netmera.

        ### Reminders

        - If the email already exists (for example on a user with an ExtID, or a user previously
          added with this service), a new user is not created.
        - A new user is created in the dashboard only if no user with that email already exists.
          Such users have no installation ID, so the installation ID is not visible when
          searching by email or user ID in the People section.
        - Users created with `addEmail` can be viewed in the dashboard. However, if a new user is
          created from the SDK with the same email, the user initially created with `addEmail`
          is deleted. SDK information is considered master, and targeting is done on the SDK user.
        - This service can be used only to upload email lists. Upload can be done within the KB
          limit, without a maximum record limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailList]
              properties:
                emailList:
                  type: array
                  description: Email addresses to add or update.
                  items:
                    type: string
            example:
              emailList: [example1@netmera.com, example2@gmail.com, example3@gmail.com]
      responses:
        '200':
          description: |
            The email list was accepted. Returns no response body.
          x-netmera-verified: '2026-09-06'

  /rest/3.0/addMsisdn:
    post:
      operationId: addMsisdn
      tags: [SMS]
      summary: Add phone numbers
      description: |
        Adds users with the specified MSISDNs (phone numbers) to the Netmera platform.

        Including the country code is mandatory — phone numbers must be in the format
        `+90xxxxxxxx`.

        ### Reminders

        - If the MSISDN already exists (for example on a user with an ExtID, or a user previously
          added with this service), a new user is not created.
        - A new user is created in the dashboard only if no user with that information already
          exists. Such users have no installation ID, so the installation ID is not visible when
          searching by user ID in the People section.
        - Users created with this service can be viewed in the dashboard. However, if a new user
          is created from the SDK with the same MSISDN, the initially created user is deleted.
          SDK information is considered primary, and targeting is done on the SDK user.
        - This service can be used only to upload MSISDN lists. Upload can be done within the KB
          limit, without a maximum record limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [msisdnList]
              properties:
                msisdnList:
                  type: array
                  description: Phone numbers to add, each including the country code.
                  items:
                    type: string
            example:
              msisdnList: ["+90xxxxxxxx"]
      responses:
        '200':
          description: |
            The MSISDN list was accepted. Returns no response body.
          x-netmera-verified: '2026-09-06'

