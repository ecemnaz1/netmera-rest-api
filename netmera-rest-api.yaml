  /rest/3.0/getSegments:
    get:
      operationId: getSegments
      tags: [Segments and Targeting]
      summary: List Segments
      description: |
        Lists the segments defined in the panel. Each segment in the response carries an `id`, `name`,
        `userCount` and `type`.

        <details>

        <summary>Notes</summary>

        - Only segments that are active and fully calculated are listed.
        - The list holds at most 1000 segments, newest first, and is not paginated.
        - `userCount` is the number of users stored at the segment's last calculation, not a live count.
        - `userCount` is `null` for `CONNECTORS_SEGMENT` segments (created by connector integrations) and
          filled in for standard segments.
        - Segment types include `STANDARD` and `CONNECTORS_SEGMENT`.
        - The `X-netmera-os` header (IOS or ANDROID) is not enforced: the call returns 200 without it.
        - The header is only logged and does not filter the list.

        </details>
      parameters:
        - name: X-netmera-os
          in: header
          required: false
          description: Platform header. IOS or ANDROID.
          schema:
            type: string
          example: IOS
      responses:
        '200':
          x-netmera-verified: '2026-11-01'
          description: The list of segments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
