                    status: 415


  /rest/3.0/removeWhatsApp:
    post:
      operationId: removeWhatsApp
      tags: [WhatsApp]
      summary: Remove WhatsApp Number
      description: |
        Removes a user's WhatsApp number. Only the WhatsApp number field is cleared: the user, its external
        ID, devices, profile attributes and WhatsApp permission state are kept.

        ### How it works

        The request is processed asynchronously. `200` means the request has been queued, and the change is
        applied to the user within seconds.

        <details>

        <summary>Notes</summary>

        - You can set a new number later with `updateWhatsApp`.
        - Sending an empty value to `updateWhatsApp` does not remove the number; the empty value is stored
          instead. Use `removeWhatsApp` to clear the field.
        - An `extId` that matches no user in the application, or a user whose WhatsApp number is already
          empty, also returns `200` and changes nothing.
        - A request without `extId` returns HTTP 400 with a plain-text body, not the JSON error body.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extId]
              properties:
                extId:
                  type: string
                  description: External user ID of the user.
            example:
              extId: your_extId
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: |
            The request was queued. Returns no response body.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Missing `extId`. The body is plain text, not the JSON error body."
          content:
            text/plain:
              schema:
                type: string
              example: "Please provide an external id."
          x-netmera-verified: '2026-10-27'
        '415':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                titleUnsupportedMediaType:
                  summary: "The request `Content-Type` is not `application/json`."
                  value:
                    type: "about:blank"
                    title: "Unsupported Media Type"
                    status: 415


