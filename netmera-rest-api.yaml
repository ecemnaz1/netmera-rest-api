  /rest/3.0/fireEvents:
    post:
      operationId: fireEvents
      tags: [Events]
      summary: Fire events
      description: |
        Sends custom events associated with a specific user. Each event must include `extId` to
        identify the user and `name` to specify the event type. Additional attributes can be
        included as key-value pairs, based on the event schema defined in the Netmera panel.

        The body must be a JSON array of event objects.

        ### Implementation notes

        - Always send events server-side. Never expose the API key in client-side code.
        - Use ISO 8601 format for all timestamps.
        - Keep event names consistent with the defined taxonomy — inconsistent naming breaks
          segmentation.
        - Include a source event reference on conversion events to enable attribution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            examples:
              customEvent:
                summary: Custom event
                value:
                  - extId: id_in_my_system_1
                    name: ShareEvent
                    itemId: "4234"
                    channel: Facebook
              cancelOrderEvent:
                summary: Cancel order event
                description: |
                  The fields used here must be configured in the event schema through the
                  Netmera panel.
                value:
                  - extId: id_in_my_system_1
                    name: OrderCancelEvent
                    paymentMethod: Credit Card
                    subTotal: 20.0
                    itemCount: 4
                    grandTotal: 35.0
              aiQuerySubmitted:
                summary: Conversational AI — query submitted
                description: |
                  Each time a tracked user action occurs inside the tool handler of a conversational
                  AI app, the app backend sends a structured event to Netmera. Events originate from
                  the app server, not from the AI platform directly.
                value:
                  - extId: user_98765
                    name: AIQuerySubmitted
                    platform: chatgpt
                    queryText: 5-day trip to Barcelona under $2000
                    category: travel_planning
              aiConversionCompleted:
                summary: Conversational AI — conversion completed
                description: |
                  Sent from the app server when the user completes a conversion. `sourceEvent`
                  references the originating event so the conversion can be attributed to it.
                value:
                  - extId: user_98765
                    name: AIConversionCompleted
                    itemId: FLIGHT-BCN-001
                    revenue: 540.00
                    currency: USD
                    sourceEvent: AIQuerySubmitted
      responses:
        '200':
          description: |
            The events were accepted. Returns no response body.
          x-netmera-verified: '2026-09-06'

