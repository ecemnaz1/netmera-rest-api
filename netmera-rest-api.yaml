      tags: [Email]
      summary: Add Email Addresses
      description: |
        Adds or updates a list of email addresses in Netmera. Use it only to upload email lists.

        <details>

        <summary>Notes</summary>

        - If a user already has the address, for example a user with an external ID or one added earlier
          with this endpoint, no new user is created.
        - Otherwise a new user is created in the dashboard. It has no installation ID, so none appears when
          you search by email or user ID in the People section.
        - Users created with `addEmail` are visible in the dashboard.
        - If the SDK later creates a user with the same email, the user created with `addEmail` is deleted.
          SDK data is the master record, and targeting uses the SDK user.
        - Uploads are limited by request size in KB, with no maximum number of records.
        - The format of the addresses is not validated.
        - Unknown JSON fields are ignored; the request is processed and returns 200.
        - If the request cannot be put into the processing queue, the error is only logged and the call
          still returns 200.

