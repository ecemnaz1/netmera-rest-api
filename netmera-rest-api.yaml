  /rest/3.0/sendBulkEmail:
    post:
      operationId: sendBulkEmail
      tags: [Email and SMS]
      summary: Send Bulk Email
      description: |
        Sends an email template created in the Netmera panel to an audience, referenced by its template ID.
        Use it when an external system, such as a CRM, manages the content and passes send-time values to
        Netmera, so the template does not need to be updated in the panel for each campaign.

        {% hint style="danger" %}
        **Requests sent from Test it are real.** Test it opens a request panel; pressing **Send** in
        that panel calls the live API with the key you enter. With a production API key the template
        goes to every user the target matches, and `sendToAll: true` reaches all users of the app. Use
        a test application's key, or target a tag that only your test users carry. The default
        example targets the `test-users` tag and returns HTTP 400, code `2009`, if the tag does not
        exist.
        {% endhint %}

        ### Capabilities

        - **Bulk email delivery** — Send emails to a target audience instead of a single user.
        - **Template ID-based sending** — Trigger a template created in the Netmera panel by its ID.
        - **Campaign-level custom parameters** — Pass key-value pairs that fill placeholders defined in the
          template.
        - **Attachment support** — Attach files to the email when needed.

        ### How it works

        1. Create the email template in the Netmera panel. It can contain placeholders such as `{DATE}`,
           `{TITLE}`, `{CONTENT}` or `{PDF_URL}`.
        2. Call this endpoint with the template ID and matching keys in `customParams`.
        3. Netmera replaces each placeholder with the matching value at send time.

        <details>

        <summary>Notes</summary>

        - The email template must exist in the Netmera panel before you trigger it through the API.
        - A placeholder with no matching key in `customParams` renders as empty in the delivered email.
        - `emailIysMessageType` is checked only after the template is found. With an unknown
          `emailTemplateId`, the template error is returned first, whatever the `emailIysMessageType` value.
        - `emailIysMessageType` is case-insensitive and is used only when the template has no email type of
          its own.
        - In that case, an invalid value returns HTTP 400, code `2004`, "emailIysMessageType must be one of:
          N, NOTIFICATION, C, CAMPAIGN, CAMPAIGN_ADVERTISEMENT".
        - When neither the template nor the request sets a type, the email is sent as
          `CAMPAIGN_ADVERTISEMENT`.

        </details>
      parameters:
        - name: X-netmera-api-caller
          in: header
          required: false
          description: |
            Optional free-text name recorded as the creator of the message. When omitted, the
            message is recorded as created through the REST API.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailTemplateId]
              properties:
                emailTemplateId:
                  type: integer
                  description: The ID of the email template to trigger.
                subject:
                  type: string
                  description: |
                    Email subject for this send; the template subject is used when omitted. Must not contain
                    HTML tags or line breaks (HTTP 400, code `2004`).
                customParams:
                  type: object
                  description: |
                    Key-value pairs that map to placeholders defined in the template.
                  additionalProperties: true
                sendToAll:
                  type: boolean
                  description: |
                    Set to true to send to all users. A target is required: `sendToAll: true`,
                    or `target.tag` / `target.segment`; otherwise the call fails with HTTP 400 and
                    code `2020`.
                target:
                  type: object
                  description: |
                    Audience of the email. Precedence is `target.tag`, then `target.segment`, then
                    `sendToAll`; the top-level `sendToAll` overrides `target.sendToAll`.
                  properties:
                    sendToAll:
                      type: boolean
                      description: |
                        Set to `true` to send to all users.
                    tag:
                      $ref: '#/components/schemas/TargetOperatorList'
                      description: |
                        Tag name, an array of tag names (OR), or an object with `$and`, `$or` or
                        `$not`. An unknown tag returns HTTP 400 with code `2009`.
                    segment:
                      $ref: '#/components/schemas/TargetOperatorList'
                      description: |
                        Segment name, an array of segment names (OR), or an object with `$and`,
                        `$or` or `$not`. Ignored when `target.tag` is sent.
                msgSchedule:
                  type: object
                  description: |
                    Delivery schedule of the email.
                  properties:
                    scheduleType:
                      type: string
                      enum: [NOW, SPECIFIC_TIME, BEST_TIME]
                      description: |
                        Scheduling mode. Case-sensitive.
                    startDate:
                      description: |
                        Send date, as epoch milliseconds or an ISO-8601 date-time string. A date in
                        the past is not rejected.
                      oneOf:
                        - type: integer
                          format: int64
                          description: |
                            epoch milliseconds
                        - type: string
                          format: date-time
                    basedOnUserTimezone:
                      type: boolean
                      description: |
                        Whether the schedule is based on the user's time zone.
                    timeZoneHourOffset:
                      type: number
                      description: |
                        Time zone offset, in hours.
                    sendImmediatelyIfBestTimePassed:
                      type: boolean
                      default: false
                      description: |
                        With `BEST_TIME`, whether the email is sent immediately when the user's best
                        time has already passed. Defaults to `false`.
                attachmentUrls:
                  type: array
                  description: |
                    URLs of files to attach. Netmera downloads the files at send time; their total
                    size must not exceed 25 MB, and executable or script files are rejected.
                  items:
                    type: string
                    format: uri
                extRef:
                  type: string
                  description: |
                    External reference of the email in your own system. Returned in the response; it
                    is not stored on the message.
                categories:
                  type: array
                  description: |
                    Message category IDs, sent as strings (for example `"12"`). A non-numeric value
                    returns HTTP 400 with code `2001`; whether the category exists is not checked.
                  items:
                    type: string
                labels:
                  type: array
                  description: |
                    Accepted but currently ignored.
                  items:
                    type: string
                emailIysMessageType:
                  type: string
                  enum: ["N", NOTIFICATION, "C", CAMPAIGN, CAMPAIGN_ADVERTISEMENT]
                  default: CAMPAIGN_ADVERTISEMENT
                  description: |
                    IYS message type, case-insensitive: `N` or `NOTIFICATION` for Notification, `C` or
                    `CAMPAIGN` for Campaign, or `CAMPAIGN_ADVERTISEMENT`. Used only when the template has no
                    email type of its own.
            example:
              emailTemplateId: 5
              subject: Daily Bulletin - May 15
              customParams:
                DATE: 16.05.2026
                TITLE: Market Summary
                CONTENT: BIST 100 increased today.
                PDF_URL: https://cdn.example.com/report.pdf
              target:
                tag: test-users
      responses:
        '200':
          description: The bulk email was accepted for delivery.
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationKey:
                    type: integer
                    description: Identifier of the created email message.
                  extRef:
                    type: string
                    description: Echo of the request `extRef`, present when one was sent.
              example:
                notificationKey: 1000
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Missing or unknown template."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                missingTemplate:
                  summary: "`emailTemplateId` is not sent."
                  value:
                    code: 2020
                    error: "emailTemplateId is required"
                unknownTemplate:
                  summary: "No email template exists with the given ID."
                  value:
                    code: 2004
                    error: "Mail template not found with id: 99999999"
                c5022_serviceUsageQuotaIsExceeded_code:
                  summary: "The request quota configured for this endpoint is exceeded."
                  value:
                    code: 5022
                    error: "Service usage quota is exceeded!"
                c2001_anUnexpectedErrorOccurredRetry_code:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
                c2020_targetTagTargetSegmentOr_code:
                  summary: "No target is given."
                  value:
                    code: 2020
                    error: "target.tag, target.segment or target.sendToAll is required"
                c5041_mailContentIsEmpty_code:
                  summary: "The email template has no content."
                  value:
                    code: 5041
                    error: "Mail content is empty"
                c2004_subjectMustNotContainHtml_code:
                  summary: "`subject` contains HTML tags or line breaks."
                  value:
                    code: 2004
                    error: "subject must not contain HTML tags or newline characters"
                c2106_dueToTimeRestrictionSettings_code:
                  summary: "The send time is outside the application's email time restriction."
                  value:
                    code: 2106
                    error: "Due to time restriction settings message can not be sent"
                c2004_totalAttachmentSizeExceeds25_code:
                  summary: "The attachments are larger than 25 MB in total."
                  value:
                    code: 2004
                    error: "Total attachment size exceeds 25 MB limit"
                c2004_failedToDownloadAttachmentUrl_code:
                  summary: "An attachment could not be downloaded."
                  value:
                    code: 2004
                    error: "Failed to download attachment: <url>"
                c2004_attachmentFileIsEmptyAttachment_code:
                  summary: "An attachment is empty or its file type is not allowed."
                  value:
                    code: 2004
                    error: "Attachment file is empty | Attachment file type not allowed: .<ext> | Attachment file type not allowed: <mime> | Attachment file could not be inspected"
                c2004_emailiysmessagetypeMustBeOneOf_code:
                  summary: "`emailIysMessageType` is not an allowed value."
                  value:
                    code: 2004
                    error: "emailIysMessageType must be one of: N, NOTIFICATION, C, CAMPAIGN, CAMPAIGN_ADVERTISEMENT"
                c2009_pleaseSetAnExistingTag_code:
                  summary: "The tag or segment target is not valid (same errors as `sendBulkNotification`)."
                  value:
                    code: 2009
                    error: "Please set an existing tag | Please set an existing segment | Segment '<name>' is not active | ..."
                c2004_notificationContentContainsForbiddenWord_code:
                  summary: "The subject, HTML or `customParams` contain a forbidden word."
                  value:
                    code: 2004
                    error: "Notification content contains forbidden word: <word>"
          x-netmera-verified: '2026-10-27'
        '415':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                springProblemdetail:
                  summary: "The request `Content-Type` is not `application/json`."
                  value:
                    type: "about:blank"
                    title: "Unsupported Media Type"
                    status: 415


  /rest/3.0/getPushStats:
    get:
      operationId: getPushStats
      tags: [Reports]
      summary: Get Push Statistics
      description: |
        Returns delivery statistics for one notification, or for every notification in a date range.

        <details>

        <summary>Notes</summary>

        - Send `notificationKey` to get the statistics of one notification.
        - Send `start` and `end` to get the statistics of all notifications in that time range.

        </details>
      parameters:
        - name: notificationKey
          in: query
          required: false
          description: |
            Notification key of the message whose statistics are requested. Required when
            querying by notification key.
          schema:
            type: integer
          example: 234
        - name: start
          in: query
          required: false
          description: |
            Start of the date range, in epoch milliseconds. Required for date-range queries.
          schema:
            type: integer
            format: int64
          example: 1501132423424
        - name: end
          in: query
          required: false
          description: |
            End of the date range, in epoch milliseconds. Required for date-range queries.
          schema:
            type: integer
            format: int64
          example: 150122342432
        - name: extRef
          in: query
          required: false
          description: |
            External reference of the notification, as sent in `extRef` when it was created; takes
            precedence over `notificationKey`. One of `extRef`, `notificationKey`, or `start` and `end` is
            required.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: |
            Date-range queries only, case-sensitive. `silent` returns silent push notifications; any other
            value, or none, returns push and interactive push notifications.
          schema:
            type: string
            enum: [silent]
      responses:
        '200':
          x-netmera-verified: '2026-11-01'
          description: Notification statistics.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PushStatsByKeyResponse'
                  - $ref: '#/components/schemas/PushStatsByDateRangeResponse'
              examples:
                byNotificationKey:
                  summary: Response for a single notification key
                  value:
                    notificationKey: 234
                    status: FINISHED
                    startDate: 1504790916883
                    endDate: 1504790916917
                    stats:
                      - platform: IOS
                        sent: 100
                        failed: 5
                        clicked: 35
                      - platform: ANDROID
                        sent: 300
                        failed: 25
                        clicked: 98
                      - platform: WP
                        sent: 30
                        failed: 1
                        clicked: 23
                byDateRange:
                  summary: Response for a date range
                  value:
                    messages:
                      - status: FINISHED
                        stats:
                          - platform: IOS
                            sent: 6
                            failed: 0
                            clicked: 0
                          - platform: ANDROID
                            sent: 0
                            failed: 0
                            clicked: 0
                        startDate: 1504790916883
                        endDate: 1504790916917
                        notificationKey: 749
                      - status: SENDING
                        stats:
                          - platform: IOS
                            sent: 1
                            failed: 0
                            clicked: 1
                          - platform: ANDROID
                            sent: 0
                            failed: 0
                            clicked: 0
                        startDate: 1504790402907
                        endDate: 1504790402909
                        notificationKey: 748
        '400':
          x-netmera-verified: '2026-11-01'
          description: "No identifier or date range, or an unknown notification key."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                noFilter:
                  summary: "Neither `notificationKey` nor a date range is sent."
                  value:
                    code: 2020
                    error: "Please choose an identifier or date query for your notification"
                unknownKey:
                  summary: "No notification exists with the given key."
                  value:
                    code: 2004
                    error: "Please choose an existing notification key"
                c5022_serviceUsageQuotaIsExceeded_code:
                  summary: "The request quota configured for this endpoint is exceeded."
                  value:
                    code: 5022
                    error: "Service usage quota is exceeded!"
                c2001_anUnexpectedErrorOccurredRetry_code:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
                c2004_pleaseChooseAnExistingExternal_code:
                  summary: "No notification exists with the given `extRef`."
                  value:
                    code: 2004
                    error: "Please choose an existing external reference"
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/getPushResult:
    get:
      operationId: getPushResult
      tags: [Reports]
      summary: Get Push Results
      description: |
        Returns the delivery result of each user or device for push, email and SMS notifications. Use it to
        see who received, opened or clicked a message, or why a delivery failed.

        ### How it works

        1. Filter by `notificationKey`, `extId` or `token`. At least one is required.
        2. Each delivery event is returned as a separate row with its `status`.
        3. When more results exist, the response contains a `nextPage` URL. Send a request to that URL to
           fetch the next page, for example
           `https://restapi.netmera.com/rest/3.0/getPushResult?offset=hJbolUuHucJ9dd&max=10`.

        `status` is one of:
        - **SUCCESS** — Accepted by the push provider.
        - **FAILED** — Not delivered. `errorCode` and `errorMessage` explain why.
        - **DELIVERED** — A receipt was reported by the device or the provider.
        - **SHOWN** — The email was opened.
        - **CLICKED** — The user clicked.

        <details>

        <summary>Notes</summary>

        - Without `notificationKey`, `extId` or `token`, the call fails with HTTP 400, code `2009`.
        - `start` and `end` are used only when both are sent. Otherwise the results of the last 7 days up to
          now are returned.
        - This 7-day window applies to lookups by `token` or `extId`, and to lookups of transactional
          (continuous) messages by `notificationKey`.
        - For a campaign message queried by `notificationKey` alone, no date window applies and `start` and
          `end` are ignored.
        - For an email or SMS notification key, the response lists the success and failure details of each
          email or SMS.
        - One notification can return several rows for the same user or device, one per status.
        - For example, an Android device with an invalid token can return one `SUCCESS` row and one `FAILED`
          row with `errorCode` `GENERIC_ERR`.
        - An invalid or tampered `offset` returns 200 with an empty `list` for bulk notifications.
        - For transactional notifications, an invalid `offset` returns HTTP 401, code `2010`, "An error
          occurred while decrypting token!".

        </details>
      parameters:
        - name: notificationKey
          in: query
          required: false
          description: |
            Notification ID in the panel; filters results to that notification. Must be an integer: a
            non-numeric value returns a `problem+json` 400.
          schema:
            type: integer
          example: 106
        - name: max
          in: query
          required: false
          description: |
            Page size for `notificationKey` queries: default and minimum 100 (for example `max=1` returns
            100 entries), at most 1000. A larger value returns HTTP 400, code `2009`; results for `extId` or
            `token` come in one response.
          schema:
            type: integer
            default: 100
            maximum: 1000
          example: 10
        - name: extId
          in: query
          required: false
          description: External ID, to get the message results of one user.
          schema:
            type: string
          example: B4A92950-B0FD-43E6-B312-C3EE088890BD
        - name: token
          in: query
          required: false
          description: Device token, to get the message results of one device.
          schema:
            type: string
        - name: start
          in: query
          required: false
          description: Start of the time range, in epoch milliseconds.
          schema:
            type: integer
            format: int64
          example: 1557892331000
        - name: end
          in: query
          required: false
          description: End of the time range, in epoch milliseconds.
          schema:
            type: integer
            format: int64
          example: 1557892431000
        - name: offset
          in: query
          required: false
          description: |
            Pagination cursor, taken from the `nextPage` URL of the previous response. It is opaque;
            do not build it yourself.
          schema:
            type: string
        - name: piid
          in: query
          required: false
          description: |
            Push instance ID, to narrow the results to a single delivery. Requires both `extId` and
            `token`; otherwise HTTP 400 with code `2009`.
          schema:
            type: integer
      responses:
        '200':
          x-netmera-verified: '2026-11-01'
          description: A page of push results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResultResponse'
              example:
                nextPage: https://restapi.netmera.com/rest/3.0/getPushResult?offset=hJbolUuHucJ9dd&max=10
                list:
                  - platform: IOS
                    status: FAILED
                    errorCode: "8"
                    installationId: C2Ii2ztdEaok0
                    errorMsg: INVALID_TOKEN
                    timeStamp: 1557819194426
                    msgTitle: Awesome Title
                    msgText: How is it going, Jon?
                  - platform: ANDROID
                    status: SUCCESS
                    installationId: U7IwgcM8phSmv
                    extId: B4A92950-B0FD-43E6-B312-C3EE088890BD
                    timeStamp: 1557819194426
                    msgTitle: Awesome Title
                    msgText: How is it going, Jon?
        '400':
          x-netmera-verified: '2026-11-01'
          description: "No filter, or an unknown notification key."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                noFilter:
                  summary: "None of `notificationKey`, `extId` or `token` is sent."
                  value:
                    code: 2009
                    error: "Token, extId or notificationKey must be specified"
                unknownKey:
                  summary: "No notification exists with the given key."
                  value:
                    code: 2004
                    error: "Please choose an existing notification key"
                c5022_serviceUsageQuotaIsExceeded_code:
                  summary: "The request quota configured for this endpoint is exceeded."
                  value:
                    code: 5022
                    error: "Service usage quota is exceeded!"
                c2001_anUnexpectedErrorOccurredRetry_code:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
                c2009_tokenExtidMustBeSpecified_code:
                  summary: "`piid` is sent without `extId` or `token`."
                  value:
                    code: 2009
                    error: "Token, extId must be specified when using piid"
                c2009_maxItemPerPageCannot_code:
                  summary: "`max` is greater than 1000."
                  value:
                    code: 2009
                    error: "Max item per page cannot be greater than 1000"
        '401':
