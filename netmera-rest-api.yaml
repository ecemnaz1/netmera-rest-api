  /rest/3.0/getDevices:
    get:
      operationId: getDevices
      tags: [Devices]
      summary: Get User Devices
      description: |
        Returns all devices of a user, optionally only those with push permission.

        <details>

        <summary>Notes</summary>

        - A user that does not exist returns 200 with an empty `devices` list.
        - Uninstalled devices are never returned.
        - `platform` is returned as the value name, for example `ANDROID`.

        </details>
      parameters:
        - name: extId
          in: query
          required: false
          description: |
            External user ID whose devices are fetched. Required unless the advanced profile search
            (request body `profile`) is used.
          schema:
            type: string
          example: id1
        - name: pushPermitted
          in: query
          required: false
          description: |
            When `true`, only installed devices registered for push (push-permitted) are returned. When
            absent or `false`, every installed device of the user is returned.
          schema:
            type: boolean
          example: true
        - name: page
          in: query
          required: false
          description: |
            Page number, starting at 1. Advanced profile search only, where it is required
            (otherwise HTTP 400, code `2020`); ignored in the default mode.
          schema:
            type: integer
            minimum: 1
        - name: max
          in: query
          required: false
          description: |
            Page size, advanced profile search only. Absent values and values above 100 are treated as 100.
          schema:
            type: integer
            default: 100
            maximum: 100
      requestBody:
        required: false
        description: |
          Advanced profile search, sent as the body of the GET request. Available only when the advanced
          device search service is enabled for the application and `extId` is not sent.
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: object
                  description: |
                    Profile attribute conditions: each key is a defined, indexed profile attribute name and
                    each value the value to match. An absent or empty object falls back to the default mode,
                    which then requires `extId`.
                  additionalProperties: true
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The user's devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  extId:
                    type: string
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
              example:
                extId: id1
                devices:
                  - platform: ANDROID
                    token: a1b2c3d4e5f6g7
                    deviceModel: Pixel 5
                    pushPermitted: true
        '400':
          description: "Missing parameter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                missingExtId:
                  summary: "`extId` is not sent."
                  value:
                    code: 2020
                    error: "extId is required"
                c2020_pageIsRequired_code:
                  summary: "Search by profile: `page` is missing."
                  value:
                    code: 2020
                    error: "page is required"
                c2009_invalidJson_code:
                  summary: "Search by profile: the body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2009_unrecognizedProfileKeyKey_code:
                  summary: "Search by profile: a `profile` key is unknown or not an indexed attribute."
                  value:
                    code: 2009
                    error: "Unrecognized profile key '<key>'"
          x-netmera-verified: '2026-10-27'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/getDeviceTokens:
    get:
      operationId: getDeviceTokens
      tags: [Devices]
      summary: List Device Tokens
      description: |
        Returns the push tokens of the application's installations, one page at a time.

        ### How it works

        1. Set the page size with `max`. The default page size is 10.
        2. To fetch the next page, call the `nextPage` URL from the response, for example
           `https://restapi.netmera.com/rest/3.0/getDeviceTokens?offset=10&max=10`.
        3. `nextPage` points to the host that served the request.

        <details>

        <summary>Notes</summary>

        - Each entry carries `installationId`, `platform`, `extId` and `deviceToken`.
        - `extId` is omitted when the installation is not linked to a user with an external ID.
        - `deviceToken` is included only when the installation has a non-blank push token.
        - The list covers every installation of the app, including uninstalled and push-disabled ones and
          those created by registerUsers without a deviceToken.
        - `getDevices`, by contrast, returns only devices on which the application is still installed.
        - Entries come in no guaranteed order, and `total` is an estimate.
        - `platform` is returned as the value name, for example `ANDROID`, `IOS` or `CHROME`.

        </details>
      parameters:
        - name: max
          in: query
          required: false
          description: Page size. Default is 10.
          schema:
            type: integer
            default: 10
          example: 10
        - name: offset
          in: query
          required: false
          description: Pagination offset. Default is 0.
          schema:
            type: integer
            default: 0
          example: 0
      responses:
        '200':
          x-netmera-verified: '2026-11-01'
          description: A page of device tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextPage:
                    type: string
                    description: URL of the next page of results.
                  total:
                    type: integer
                    description: Approximate total number of installations.
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceTokenEntry'
              example:
                nextPage: https://restapi.netmera.com/rest/3.0/getDeviceTokens?offset=10&max=10
                total: 158329
                devices:
                  - extId: user_123
                    installationId: U7IwgcM8phSmv
                    platform: ANDROID
                    deviceToken: abc123pushToken
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                offsetMaxNotIntegers:
                  summary: "`offset` or `max` is not an integer."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400


