  /rest/3.0/createNotificationDefinition:
    post:
      operationId: createNotificationDefinition
      tags: [Push Notifications]
      summary: Create Notification Definition
      description: |
        Creates a transactional notification definition. Send it later with `sendNotification`, using the
        returned `notificationKey`.

        ### Capabilities

        - **Interactive push** — Send `buttonSet`.
        - **Email** — Send `from`.
        - **SMS** — Send `smsHeader`.
        - **Web push** — Include a web platform in `platforms`.
        - **Live activity** — Send `contentState`.
        - **Mobile push** — The default when none of the fields above is sent.

        ### How it works

        1. Create the definition once. Its type is chosen by the fields present, in the order listed above:
           the first match wins.
        2. Store the returned `notificationKey`.
        3. Call `sendNotification` with that key for each message.

        <details>

        <summary>Notes</summary>

        - The push text is `message`; `text` is not read.
        - Web platforms are Chrome, Firefox, Safari (macOS), Opera, Edge, Yandex and other web browsers.
          Mobile platforms are iOS and Android.
        - A definition that mixes a web platform with iOS or Android returns HTTP 400 with the body
          `{"error": "You cannot select platforms which belong to different push types"}`.
        - The Windows desktop platform belongs to neither group for this check.
        - Live activity messages created through this endpoint are exempt from the application's user
          message limits. They are not filtered out when a user reaches the limit, and they do not increase
          the user's message count.
        - Live activity definitions saved by an earlier API version still count towards the limits. Create a
          new definition instead of reusing such a key.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationDefinitionRequest'
            examples:
              full:
                summary: Definition with platform blocks and hook
                value:
                  title: New Campaign
                  message: Exciting updates await you!
