  /rest/3.0/promotion/add:
    post:
      operationId: addPromotionCodes
      tags: [Promotion Codes]
      summary: Assign Promotion Codes
      description: |
        Assigns promotion codes to users. You can then place each user's code in messages sent to them.

        ### How it works

        All codes in one request belong to one promotion, identified by `name`. The promotion is created
        automatically the first time the name is used. The body is read in field order, so send the fields
        in the order `name`, `expiryDate`, `codes`.

        <details>

        <summary>Notes</summary>

        - `name` is required. A missing `name` returns HTTP 400, code `2009`, "name is required".
        - When `name` comes after the other fields, the request is rejected with "name is required" even
          though `name` is present.
        - If `expiryDate` is missing or is sent after `codes`, the codes are not assigned to the users,
          although the request returns 200.
        - `expiryDate` is used only when the promotion is created. For an existing promotion with the same
          name it is ignored and the original expiry stays.
        - If `expiryDate` is omitted on creation, the promotion expires 30 days after creation.
        - A request without `codes`, or with an empty `codes` array, returns 200. The promotion is still
          created if it did not exist, but no user receives a code.
        - Entries whose `extId` matches no user are accepted without an error.
        - Malformed JSON returns HTTP 400, code `2009`, "Invalid JSON".

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    Name of the promotion. Codes sent with the same name are grouped under the
                    same promotion.
                expiryDate:
                  type: integer
                  format: int64
                  description: |
                    Expiry date of the promotion as an epoch timestamp in milliseconds. Used when
                    the promotion is first created.
                codes:
                  type: array
                  description: One entry per user.
                  items:
                    type: object
                    required: [extId, code]
                    properties:
                      extId:
                        type: string
                        description: External user ID.
                      code:
                        type: string
                        description: Promotion code assigned to this user.
            example:
              name: SummerSale
              expiryDate: 1767225600000
              codes:
                - extId: id1
                  code: SUMMER-1A2B
                - extId: id2
                  code: SUMMER-3C4D
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The codes were accepted.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Missing promotion name."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                missingName:
                  summary: "`name` is not sent."
                  value:
                    code: 2009
                    error: "name is required"
                c2009_invalidJson_code:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2001_anUnexpectedErrorOccurredRetry_code:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
          x-netmera-verified: '2026-10-27'


  /rest/3.0/geofence/add:
    post:
      operationId: addGeofence
      tags: [Geofence]
      summary: Create Geofence
      description: |
        Creates a geofence from a center point (`latitude`, `longitude`) and a `radius`.

        <details>

        <summary>Notes</summary>

        - Set the radius unit with `unit`: KM, Miles or Meters. The default is KM.
        - The response returns the identifier of the new geofence. Pass it to `removeGeofence` to delete the
          geofence.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, latitude, longitude, radius]
              properties:
                title:
                  type: string
                  description: Geofence name shown on the dashboard.
                latitude:
                  type: number
                  description: Latitude of the center point.
                longitude:
                  type: number
                  description: Longitude of the center point.
                radius:
                  type: number
                  description: |
                    Radius value from the center point, used to search for users. The unit is
                    given by `unit` and defaults to KM.
                unit:
                  type: string
                  enum: [KM, Miles, Meters]
                  default: KM
                  description: |
                    Unit of the radius: KM, Miles or Meters. Defaults to KM.
                groups:
                  type: array
                  description: Geofence groups.
                  items:
                    type: string
            example:
              title: Sample Geofence
              latitude: 38.43225
              longitude: 40.212421
              radius: 5
              unit: KM
              groups: [Sample Group]
      responses:
        '200':
          description: |
            The geofence was created. The response returns the identifier assigned to the
            new geofence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Identifier assigned to the created geofence.
              example:
                id: 1000
          x-netmera-verified: '2026-09-06'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2009_invalidJson:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2020_titleCannotBeEmptyOr:
                  summary: "`title` is missing or empty."
                  value:
                    code: 2020
                    error: "Title cannot be empty or null"
                c2020_invalidLatitude:
                  summary: "`latitude` is missing."
                  value:
                    code: 2020
                    error: "Invalid latitude"
                c2020_invalidLongitude:
                  summary: "`longitude` is missing."
                  value:
                    code: 2020
                    error: "Invalid longitude"
                c2020_invalidRadius:
                  summary: "`radius` is missing."
                  value:
                    code: 2020
                    error: "Invalid radius"
                c2004_distanceunitMustBeOneOf:
                  summary: "`unit` is not one of `METERS`, `KM` or `MILES`."
                  value:
                    code: 2004
                    error: "DistanceUnit must be one of METERS,KM,MILES"
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                emptyBody:
                  summary: "The body is empty."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400


  /rest/3.0/geofence/remove:
    post:
      operationId: removeGeofence
      tags: [Geofence]
      summary: Remove Geofence
      description: |
        Deletes a geofence created earlier. Pass the `id` returned by `geofence/add` as a query parameter.

        <details>

        <summary>Notes</summary>

        - The request succeeds even if no geofence with the given `id` exists; nothing is removed in that
