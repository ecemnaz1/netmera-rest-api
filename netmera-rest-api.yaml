  /rest/3.0/update-live-activity:
    post:
      operationId: updateLiveActivity
      tags: [Push Notifications]
      summary: Start, Update or End Live Activity
      description: |
        Starts, updates or ends an iOS Live Activity for a group. Netmera creates a live activity campaign
        message for `groupId` and queues it for sending.

        {% hint style="danger" %}
        **Requests sent from Test it are real.** Test it opens a request panel; pressing **Send** in
        that panel calls the live API with the key you enter. With a production API key it starts,
        updates or ends the Live Activity on every iOS device that holds an activity for the
        `groupId`. Use a test application's key or a `groupId` used only by your test devices.
        {% endhint %}

        ### Capabilities

        - **Start** — Set `action` to `START` to start the activity.
        - **Update** — Set `action` to `UPDATE` to update the activity's content.
        - **End** — Set `action` to `END` to end the activity.

        ### How it works

        1. Send the activity's `groupId` and an `action`, with the new content in `contentState`.
        2. Netmera accepts a valid request with HTTP 200 and an empty body.
        3. The message is sent asynchronously, only to iOS devices that hold a token for a started activity
           with this `groupId`.

        <details>

        <summary>Notes</summary>

        - Live activities are available on iOS only.
        - Always send `action`. A request without it returns HTTP 400, code `2001`, "An unexpected error
          occurred. Retry later.".
        - If no device has started an activity for the group, nothing is sent and no error is returned.
        - An empty `groupId` returns HTTP 406 with an RFC 7807 body (`"title": "Not Acceptable"`).
        - Messages created through this endpoint are exempt from the application's user message limits. They
          are not filtered out when a user reaches the limit, and they do not increase the user's message
          count.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                groupId:
                  type: "string"
                  description: |
                    Group identifier of the live activity; it is not checked against existing live
                    activities. An empty or missing value returns 400 with
                    `{"error": "Please provide a valid group id!"}`.
                action:
                  type: "string"
                  enum:
                    - "START"
                    - "UPDATE"
                    - "END"
                  description: |
                    Live activity action, case-sensitive: `START`, `UPDATE` or `END`. Required; a missing
                    value returns 400, code `2001`, and an invalid value 400 with an RFC 7807 body.
                contentState:
                  type: "object"
                priority:
                  type: "integer"
                  description: "Delivery priority of the update."
                staleDate:
                  type: "string"
                  format: "date-time"
                  description: |
                    ISO-8601 UTC timestamp, for example `2030-01-01T10:00:00Z`. An unparseable value returns
                    400 with code 2001.
                dismissalDate:
                  type: "string"
                  format: "date-time"
                  description: |
                    ISO-8601 UTC timestamp, for example `2030-01-01T10:00:00Z`. An unparseable value returns
                    400 with code 2001.
              required:
                - "groupId"
                - "action"
      responses:
        '200':
          description: "The update was accepted. Returns no response body."
          x-netmera-verified: '2026-11-06'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/NetmeraError'
                  - type: "object"
                    description: "Error body without a Netmera code."
                    required:
                      - "error"
                    properties:
                      error:
                        type: "string"
              examples:
                c5022_serviceUsageQuotaIsExceeded:
                  summary: "The request quota configured for this endpoint is exceeded."
                  value:
                    code: 5022
                    error: "Service usage quota is exceeded!"
                c2001_anUnexpectedErrorOccurredRetry:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                springProblemdetailEGDetail:
                  summary: "Missing or unreadable request body."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400
                    detail: "Failed to read request"
        '406':
          description: "`groupId` is empty."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                emptyGroupId:
                  summary: "`groupId` is empty."
                  value:
                    type: about:blank
                    title: Not Acceptable
                    status: 406
                    detail: "Acceptable representations: [application/json, application/cbor, application/*+json]."
                    instance: /rest/3.0/update-live-activity
        '415':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                springProblemdetail:
                  summary: "The request `Content-Type` is not `application/json`."
                  value:
                    type: "about:blank"
                    title: "Unsupported Media Type"
                    status: 415


  /rest/3.0/sendEmailAndSms:
    post:
      operationId: sendEmailAndSms
      tags: [Email and SMS]
      summary: Send Email or SMS
      description: |
        Sends an email or an SMS to a user, with the message content in the request instead of a template
        created in the panel. The same endpoint creates a template for sending email or SMS to a user.

        {% hint style="danger" %}
        **Requests sent from Test it are real.** Test it opens a request panel; pressing **Send** in
        that panel calls the live API with the key you enter. With a production API key the email or
        SMS goes to the recipients in `target`, and `sendToAll: true` reaches all users of the app.
        Use a test application's key or your own address or phone number.
        {% endhint %}

        ### Capabilities

        - **Email** — Set `platforms` to `["EMAIL"]` and send the address in `target.email`.
        - **SMS** — Set `platforms` to `["SMS"]` and send the number in `target.msisdn`.
        - **Templates** — Create an email or SMS template for later sends to a user.

        ### How it works

        The channel is chosen by the fields that are present, not by `platforms`: `from` creates an email
        and `smsHeader` an SMS.

        For email, `emailIysMessageType` decides how the user's email permission applies:
        - **`C` or omitted** — Commercial content, such as a campaign or newsletter. The user receives the
          email only if their email permission is on.
        - **`N`** — Informational content, such as an account or order notice. The user receives the email
          even if their email permission is off.

        <details>

        <summary>Notes</summary>

        - Use `N` only for informational content. Commercial content must be sent with `C`.
        - `emailIysMessageType` is optional. When it is omitted, the request is accepted and the email has
          no IYS message type, so it reaches only users with email permission, like a commercial email.
        - For SMS, the IYS fields are `smsIysMessageType` and `smsIysRecipientType`. They are needed when
          the SMS provider requires IYS fields.
        - The address format is not validated when the request is received. A request with an invalid
          `target.email` returns 200 with a `notificationKey`.
        - `senderName` is ignored. The sender name is the `from` value.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSmsRequest'
            examples:
              email:
                summary: Email
                value:
                  target:
                    email: target_email@example.com
                  platforms: [EMAIL]
                  title: Your Account is Created
                  message: '<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html><head></head><body esd-custom-display-conditions="[]"><p class="esd-text">HELLO<br>SPACE<br></p></body></html>'
                  from: info@netmera.com
                  senderName: Netmera
                  subject: Your Account is Created
              emailTemplate:
                summary: Email template with IYS fields
                value:
                  target:
                    email: target_email
                  platforms: [EMAIL]
                  title: AccountCreationNotification
                  message: '<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html><head></head><body esd-custom-display-conditions="[]"><p class="esd-text">Hello,<br>This is a test email.</p></body></html>'
                  from: info@netmera.com
                  senderName: Netmera
                  subject: Account Creation Notification
                  emailIysMessageType: N
              sms:
                summary: SMS
                value:
                  target:
                    msisdn: target_msisdn
                  platforms: [SMS]
                  title: Account Notification
                  message: "Your recent account activity: message"
                  smsHeader: NETMERA
              smsTemplate:
                summary: SMS template with IYS fields
                description: |
                  `smsIysMessageType` accepts "N" for Notification and "C" for Campaign; it is
                  required only when the SMS is sent through an SMS provider that requires IYS fields
                  (otherwise it defaults to Campaign). `smsIysRecipientType` accepts "B" for
                  Personal and "T" for Trader and is required with an SMS provider that requires IYS fields.
                value:
                  target:
                    msisdn: target_msisdn
                  platforms: [SMS]
                  title: SMS Title
                  message: Hello, this is your SMS message.
                  smsHeader: NETMERA
                  smsIysMessageType: "N"
                  smsIysRecipientType: "B"
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The message was accepted. `notificationKey` identifies the created message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationKey:
                    type: integer
              example:
                notificationKey: 1000
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "No platform or no target."
