                  profile:
                    type: array
                    description: Attribute keys to remove.
                    items:
                      type: string
            example:
              - extId: id1
                profile: [age]
              - extId: id2
                profile: [age, name]
      responses:
        '200':
          description: |
            The attributes were removed. Returns no response body.
          x-netmera-verified: '2026-09-06'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2009_invalidJson:
                  summary: "Malformed JSON, an empty array, a `profile` that is not an array, or no valid entry."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2001_anUnexpectedErrorOccurredRetry:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                postWithEmptyMissingBody:
                  summary: "Missing request body."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400


  /rest/3.0/pushProfileAttributes:
    post:
      operationId: pushProfileAttributes
      tags: [Profile Attributes]
      summary: Add Values to Array Attributes
      description: |
        Adds values to array-type profile attributes of the given users. The target attribute must be an
        array attribute.

        <details>

        <summary>Notes</summary>

        - Values are added as a set. A value the user already has is not added again, and duplicates in the
          request collapse to one.
        - If the user does not have the attribute yet, it is created with the sent values.
        - Send the values as an array of the attribute's type. Otherwise that entry is rejected.
        - Keys of `profile` must match the attribute names defined in the panel exactly (case-sensitive).
        - Undefined keys and values of the wrong type are dropped silently, and an invalid entry is skipped.
        - The request fails with HTTP 400, code `2009` ("Invalid JSON"), only when every entry is invalid.
        - `deviceToken` can be sent instead of `extId`.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                anyOf:
