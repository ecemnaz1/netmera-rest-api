openapi: 3.1.0
info:
  title: Netmera REST API
  version: "3.0"
  summary: Server-side API for push, email, SMS, WhatsApp, events, users, devices and inbox.
  description: |
    The Netmera REST API lets your backend send notifications across channels, fire events,
    manage users, devices, tags, categories, segments and profile attributes, and read
    delivery statistics.

    Every request carries your REST API key in the `X-netmera-api-key` header. Authentication,
    external IDs, limits, pagination, retries and the error code table are described in the
    Getting Started section of the Netmera REST API documentation.

servers:
  - url: https://restapi.netmera.com
    description: Netmera REST API

security:
  - REST-API-key: []

tags:
  - name: Push Notifications
    x-page-title: Push Notifications
    x-page-icon: bell
    description: |
      Send push notifications to an audience or to individual users.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Send Bulk Notification</strong></td><td><code>POST</code> Send one message to an audience: tags, segments, profile attributes, a location or everyone.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/push-notifications/send-bulk-notification">Send Bulk Notification</a></td></tr><tr><td><strong>Create Notification Definition</strong></td><td><code>POST</code> Create a reusable transactional message once; use its key for every personal send.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/push-notifications/create-notification-definition">Create Notification Definition</a></td></tr><tr><td><strong>Send Transactional Notification</strong></td><td><code>POST</code> Send a personal message, such as an OTP or an order update, to one or more users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/push-notifications/send-transactional-notification">Send Transactional Notification</a></td></tr><tr><td><strong>Start, Update or End Live Activity</strong></td><td><code>POST</code> Start, update or end an iOS Live Activity for a group.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/push-notifications/start-update-or-end-live-activity">Start, Update or End Live Activity</a></td></tr></tbody></table>
  - name: Email and SMS
    x-page-title: Email and SMS
    x-page-icon: envelope
    description: |
      Send email and SMS messages.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Send Email or SMS</strong></td><td><code>POST</code> Send an email or an SMS to one user, with the content in the request or from a template.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/email-and-sms/send-email-or-sms">Send Email or SMS</a></td></tr><tr><td><strong>Send Email with Attachment</strong></td><td><code>POST</code> Send a panel email to one user with files attached.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/email-and-sms/send-email-with-attachment">Send Email with Attachment</a></td></tr><tr><td><strong>Send Bulk Email</strong></td><td><code>POST</code> Send a panel email template to an audience, filling its placeholders at send time.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/email-and-sms/send-bulk-email">Send Bulk Email</a></td></tr></tbody></table>
  - name: Reports
    x-page-title: Delivery Reports
    x-page-icon: chart-simple
    description: |
      Check how a notification performed: totals for a notification or a date range, delivery results
      per user or device, and the application's daily device counts.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Get Push Statistics</strong></td><td><code>GET</code> Returns delivery statistics for one notification, or for every notification in a date range.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/delivery-reports/get-push-statistics">Get Push Statistics</a></td></tr><tr><td><strong>Get Push Results</strong></td><td><code>GET</code> Returns the delivery result of each user or device for push, email and SMS notifications.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/delivery-reports/get-push-results">Get Push Results</a></td></tr><tr><td><strong>Get Daily App Statistics</strong></td><td><code>GET</code> Returns the application's device statistics for one day: total devices, opted-in devices and monthly active devices, each broken down by platform.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/delivery-reports/get-daily-app-statistics">Get Daily App Statistics</a></td></tr></tbody></table>
  - name: Users
    x-page-title: Users
    x-page-icon: user
    description: |
      Create or update users in Netmera from your own system, and remove them. A user is identified by
      your external ID (`extId`).

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Register Users</strong></td><td><code>POST</code> Registers users and their devices from your backend, or updates existing ones.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/users/register-users">Register Users</a></td></tr><tr><td><strong>Delete Users</strong></td><td><code>POST</code> Marks users as untracked, so they are no longer targeted by campaigns.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/users/delete-users">Delete Users</a></td></tr><tr><td><strong>Delete Users Permanently</strong></td><td><code>POST</code> Permanently deletes all data of the given users from Netmera, including their devices, profile attributes, events and records.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/users/delete-users-permanently">Delete Users Permanently</a></td></tr></tbody></table>
  - name: Profile Attributes
    x-page-title: Profile Attributes
    x-page-icon: id-card
    description: |
      Store information about a user, such as name, city or preferences, and use it for targeting and
      personalization.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Get Profile Attributes</strong></td><td><code>GET</code> Returns the current profile attributes of a user, identified by <code>extId</code> or, when <code>extId</code> is not sent, by <code>deviceToken</code>.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/profile-attributes/get-profile-attributes">Get Profile Attributes</a></td></tr><tr><td><strong>Set Profile Attributes</strong></td><td><code>POST</code> Sets or updates profile attributes for the given users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/profile-attributes/set-profile-attributes">Set Profile Attributes</a></td></tr><tr><td><strong>Unset Profile Attributes</strong></td><td><code>POST</code> Removes attribute keys from a user's profile.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/profile-attributes/unset-profile-attributes">Unset Profile Attributes</a></td></tr><tr><td><strong>Add Values to Array Attributes</strong></td><td><code>POST</code> Adds values to array-type profile attributes of the given users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/profile-attributes/add-values-to-array-attributes">Add Values to Array Attributes</a></td></tr><tr><td><strong>Remove Values from Array Attributes</strong></td><td><code>POST</code> Removes values from array-type profile attributes of the given users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/profile-attributes/remove-values-from-array-attributes">Remove Values from Array Attributes</a></td></tr><tr><td><strong>Delete Profile Attribute from All Users</strong></td><td><code>POST</code> Deletes profile attribute keys from all users at once.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/profile-attributes/delete-profile-attribute-from-all-users">Delete Profile Attribute from All Users</a></td></tr></tbody></table>
  - name: Tags
    x-page-title: Tags
    x-page-icon: tag
    description: |
      Label users with tags, then target the tagged users in campaigns.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Add Tags to Users</strong></td><td><code>POST</code> Adds one or more tags to the given users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/tags/add-tags-to-users">Add Tags to Users</a></td></tr><tr><td><strong>Remove Tags from Users</strong></td><td><code>POST</code> Removes a tag from the given users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/tags/remove-tags-from-users">Remove Tags from Users</a></td></tr></tbody></table>
  - name: Devices
    x-page-title: Devices
    x-page-icon: mobile
    description: |
      Look up a user's devices and push tokens, and register devices as test devices for test sends
      from the panel.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Get User Devices</strong></td><td><code>GET</code> Returns all devices of a user, optionally only those with push permission.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/devices/get-user-devices">Get User Devices</a></td></tr><tr><td><strong>List Device Tokens</strong></td><td><code>GET</code> Returns the push tokens of the application's installations, one page at a time.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/devices/list-device-tokens">List Device Tokens</a></td></tr><tr><td><strong>Add Test Devices</strong></td><td><code>POST</code> Registers a user's devices as test devices, so they receive test messages sent from the panel.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/devices/add-test-devices">Add Test Devices</a></td></tr></tbody></table>
  - name: Channel Permissions
    x-page-title: Channels and Permissions
    x-page-icon: toggle-on
    description: |
      Opt users in to or out of each channel, and add, update or remove the email addresses, phone
      numbers and WhatsApp numbers messages are sent to.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Push</strong></td><td>Opt a user or a device in to or out of push notifications.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/push">Push</a></td></tr><tr><td><strong>Email</strong></td><td>Add, update or remove a user's email address and manage email permission.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/email">Email</a></td></tr><tr><td><strong>SMS</strong></td><td>Add, update or remove a user's phone number and manage SMS permission.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/sms">SMS</a></td></tr><tr><td><strong>WhatsApp</strong></td><td>Update or remove a user's WhatsApp number and manage WhatsApp permission.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/whatsapp">WhatsApp</a></td></tr></tbody></table>
  - name: Push Permission
    x-parent: Channel Permissions
    x-page-title: Push
    x-page-icon: bell-slash
    description: |
      Opt a user or a device in to or out of push notifications.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Enable Push Permission</strong></td><td><code>POST</code> Opts all devices of a user, or one specific device, in to push notifications.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/push/enable-push-permission">Enable Push Permission</a></td></tr><tr><td><strong>Disable Push Permission</strong></td><td><code>POST</code> Opts all devices of a user, or one specific device, out of push notifications.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/push/disable-push-permission">Disable Push Permission</a></td></tr></tbody></table>
  - name: Email
    x-parent: Channel Permissions
    x-page-title: Email
    x-page-icon: at
    description: |
      Add, update or remove a user's email address and manage email permission.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Add Email Addresses</strong></td><td><code>POST</code> Adds or updates a list of email addresses in Netmera.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/email/add-email-addresses">Add Email Addresses</a></td></tr><tr><td><strong>Update Email Address</strong></td><td><code>POST</code> Updates the email address of a user.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/email/update-email-address">Update Email Address</a></td></tr><tr><td><strong>Remove Email Address</strong></td><td><code>POST</code> Removes a user's email address.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/email/remove-email-address">Remove Email Address</a></td></tr><tr><td><strong>Enable Email Permission</strong></td><td><code>POST</code> Grants email permission to users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/email/enable-email-permission">Enable Email Permission</a></td></tr><tr><td><strong>Disable Email Permission</strong></td><td><code>POST</code> Revokes email permission from users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/email/disable-email-permission">Disable Email Permission</a></td></tr></tbody></table>
  - name: SMS
    x-parent: Channel Permissions
    x-page-title: SMS
    x-page-icon: comment-sms
    description: |
      Add, update or remove a user's phone number and manage SMS permission.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Add Phone Numbers</strong></td><td><code>POST</code> Adds users with the given MSISDNs (phone numbers) to Netmera.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/sms/add-phone-numbers">Add Phone Numbers</a></td></tr><tr><td><strong>Update Phone Number</strong></td><td><code>POST</code> Updates the MSISDN (phone number) of a user.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/sms/update-phone-number">Update Phone Number</a></td></tr><tr><td><strong>Remove Phone Number</strong></td><td><code>POST</code> Removes a user's MSISDN (phone number).</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/sms/remove-phone-number">Remove Phone Number</a></td></tr><tr><td><strong>Enable SMS Permission</strong></td><td><code>POST</code> Grants SMS permission to users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/sms/enable-sms-permission">Enable SMS Permission</a></td></tr><tr><td><strong>Disable SMS Permission</strong></td><td><code>POST</code> Revokes SMS permission from users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/sms/disable-sms-permission">Disable SMS Permission</a></td></tr></tbody></table>
  - name: WhatsApp
    x-parent: Channel Permissions
    x-page-title: WhatsApp
    x-page-icon: comment
    description: |
      Update or remove a user's WhatsApp number and manage WhatsApp permission.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Update WhatsApp Number</strong></td><td><code>POST</code> Updates a user's WhatsApp number.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/whatsapp/update-whatsapp-number">Update WhatsApp Number</a></td></tr><tr><td><strong>Remove WhatsApp Number</strong></td><td><code>POST</code> Removes a user's WhatsApp number.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/whatsapp/remove-whatsapp-number">Remove WhatsApp Number</a></td></tr><tr><td><strong>Enable WhatsApp Permission</strong></td><td><code>POST</code> Grants WhatsApp permission to one or more users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/whatsapp/enable-whatsapp-permission">Enable WhatsApp Permission</a></td></tr><tr><td><strong>Disable WhatsApp Permission</strong></td><td><code>POST</code> Revokes WhatsApp permission from one or more users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/channels-and-permissions/whatsapp/disable-whatsapp-permission">Disable WhatsApp Permission</a></td></tr></tbody></table>
  - name: Category Preferences
    x-page-title: Category Preferences
    x-page-icon: sliders
    description: |
      Read and change which message categories a user wants to receive, per channel.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Get Category Preferences</strong></td><td><code>GET</code> Returns a user's opt-in preference for each message category, with a per-channel breakdown.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/category-preferences/get-category-preferences">Get Category Preferences</a></td></tr><tr><td><strong>Set Category Preferences</strong></td><td><code>POST</code> Opts a user in to or out of message categories.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/category-preferences/set-category-preferences">Set Category Preferences</a></td></tr></tbody></table>
  - name: Events
    x-page-title: Events
    x-page-icon: bolt
    description: |
      Send events from your backend for analytics, segmentation and journeys.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Fire Events</strong></td><td><code>POST</code> Sends custom events for users from your backend.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/events/fire-events">Fire Events</a></td></tr></tbody></table>
  - name: Segments and Targeting
    x-page-title: Segments and Targeting
    x-page-icon: bullseye
    description: |
      List and manage segments, read their users, and count how many users a target reaches before you
      send.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>List Segments</strong></td><td><code>GET</code> Lists the segments defined in the panel.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/list-segments">List Segments</a></td></tr><tr><td><strong>Get Segment</strong></td><td><code>GET</code> Returns the status and the user count of a segment.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/get-segment">Get Segment</a></td></tr><tr><td><strong>List Segment Users</strong></td><td><code>GET</code> Returns the users in a segment, one page at a time.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/list-segment-users">List Segment Users</a></td></tr><tr><td><strong>Create Segment</strong></td><td><code>POST</code> Creates a standard (condition-based) segment.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/create-segment">Create Segment</a></td></tr><tr><td><strong>Update Segment</strong></td><td><code>POST</code> Replaces the conditions of a segment and calculates it again.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/update-segment">Update Segment</a></td></tr><tr><td><strong>Change Segment Status</strong></td><td><code>POST</code> Deletes a segment, or reopens a deleted one.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/change-segment-status">Change Segment Status</a></td></tr><tr><td><strong>Count Targeted Users</strong></td><td><code>POST</code> Returns the number of unique users who match a targeting query.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/count-targeted-users">Count Targeted Users</a></td></tr><tr><td><strong>Count Users per Attribute Value</strong></td><td><code>POST</code> Returns the distinct user count for every value of one profile or installation attribute in a single request.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/count-users-per-attribute-value">Count Users per Attribute Value</a></td></tr><tr><td><strong>Count Users with Push Permission</strong></td><td><code>GET</code> Returns the number of users in your application who currently have push permission.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/segments-and-targeting/count-users-with-push-permission">Count Users with Push Permission</a></td></tr></tbody></table>
  - name: Inbox
    x-page-title: Inbox
    x-page-icon: inbox
    description: |
      Build an in-app inbox: list a user's messages, read one, and mark messages as read, unread or
      deleted.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>List Inbox Messages</strong></td><td><code>POST</code> Returns the push notifications stored on the server for a user's inbox.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/inbox/list-inbox-messages">List Inbox Messages</a></td></tr><tr><td><strong>Get Inbox Message</strong></td><td><code>GET</code> Returns a single inbox message by its push instance ID.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/inbox/get-inbox-message">Get Inbox Message</a></td></tr><tr><td><strong>Check Inbox Message</strong></td><td><code>GET</code> Checks whether a push instance is in a user's inbox and returns the date it was added.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/inbox/check-inbox-message">Check Inbox Message</a></td></tr><tr><td><strong>Change Inbox Message Status</strong></td><td><code>POST</code> Changes the status of one or more inbox messages, for example to read, unread or deleted.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/inbox/change-inbox-message-status">Change Inbox Message Status</a></td></tr></tbody></table>
  - name: Promotion Codes
    x-page-title: Promotion Codes
    x-page-icon: ticket
    description: |
      Assign promotion codes to users.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Assign Promotion Codes</strong></td><td><code>POST</code> Assigns promotion codes to users.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/promotion-codes/assign-promotion-codes">Assign Promotion Codes</a></td></tr></tbody></table>
  - name: Geofence
    x-page-title: Geofence
    x-page-icon: location-dot
    description: |
      Create and remove geofence regions used for location-based notifications.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>Create Geofence</strong></td><td><code>POST</code> Creates a geofence from a center point (<code>latitude</code>, <code>longitude</code>) and a <code>radius</code>.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/geofence/create-geofence">Create Geofence</a></td></tr><tr><td><strong>Remove Geofence</strong></td><td><code>POST</code> Deletes a geofence created earlier.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/geofence/remove-geofence">Remove Geofence</a></td></tr></tbody></table>
  - name: Application Data
    x-page-title: Application Data
    x-page-icon: database
    description: |
      Read what is configured in the Netmera panel: profile attribute definitions, event definitions and
      push categories.

      <table data-view="cards"><thead><tr><th></th><th></th><th data-hidden data-card-target data-type="content-ref"></th></tr></thead><tbody><tr><td><strong>List Profile Attribute Definitions</strong></td><td><code>GET</code> Lists the profile attributes defined for your application.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/application-data/list-profile-attribute-definitions">List Profile Attribute Definitions</a></td></tr><tr><td><strong>List Event Definitions</strong></td><td><code>GET</code> Lists the event definitions of your application.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/application-data/list-event-definitions">List Event Definitions</a></td></tr><tr><td><strong>List Push Categories</strong></td><td><code>GET</code> Lists the message categories defined for your application under Settings &gt; Message Categories in the panel.</td><td><a href="https://user.netmera.com/netmera-developer-guide/api-documentation/api-reference/application-data/list-push-categories">List Push Categories</a></td></tr></tbody></table>

paths:
  /rest/3.0/sendBulkNotification:
    post:
      operationId: sendBulkNotification
      tags: [Push Notifications]
      summary: Send Bulk Notification
      description: |
        Sends one push notification to an audience: tags, segments, profile attributes, a location or all
        users. Use it for campaigns that go to many users at once.

        {% hint style="danger" %}
        **Requests sent from Test it are real.** Test it opens a request panel; pressing **Send** in
        that panel calls the live API with the key you enter. With a production API key the
        notification goes to every user the target matches, and `sendToAll: true` reaches all users
        of the app. Use a test application's key, or target a tag that only your test devices carry.
        The default example targets the `test-users` tag and returns HTTP 400, code `2009`, if the tag
        does not exist.
        {% endhint %}

        ### Capabilities

        - **Audience targeting** — Target tags, segments, profile attributes or a location, or everyone with
          `sendToAll`.
        - **Multi-language content** — Send a title and text per language in `languages`.
        - **Rich formats** — Add platform-specific titles, carousel and slider items, and button sets.
        - **Web push** — Send to web platforms such as Chrome and Firefox.
        - **Live push updates (Android)** — Update a sent notification by passing its key in
          `customJson.refID`.

        ### How it works

        Netmera can enable asynchronous mode for your application. In this mode, the request body, targeting
        (tags, segments, profile attributes), languages and forbidden words are still checked before the
        response, so those errors are returned exactly as in normal mode.

        Checks that run after saving, such as the payload size limit and message approval, run in the
        background. Their failures are not reported to you, and the response contains only the reserved
        `notificationKey`, with no `extRef` and no approval result.

        <details>

        <summary>Notes</summary>

        - To target users in any of several segments, send `target.segment` as an array:
          `"segment": ["seg1", "seg2"]`.
        - The segment object form `{"$or": [...]}` is currently rejected with HTTP 400, code `2009`, "Please
          set an existing segment".
        - Each key of `languages` must be a language code, for example `en` or `en-US`, selected in the
          application's multi-language settings. Matching is exact and case-sensitive.
        - If multi-language is not enabled for the application, the request fails with HTTP 400, code 2021.
        - If any key does not match a selected language, the whole request fails with HTTP 400, code 2004,
          "Undefined language selection".
        - If two keys resolve to the same language, only one of them is kept.

        </details>
      parameters:
        - name: X-netmera-api-caller
          in: header
          required: false
          description: |
            Optional free-text name recorded as the creator of the message. When omitted, the
            message is recorded as created through the REST API.
          schema:
            type: string
      requestBody:
        required: true
        content:
