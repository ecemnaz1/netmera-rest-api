        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/inbox/getAllInbox:
    post:
      operationId: getAllInbox
      tags: [Inbox]
      summary: List Inbox Messages
      description: |
        Returns the push notifications stored on the server for a user's inbox. Filter by status, category
        or time range.

        ### How it works

        Set the page size with `numberOfNotification`. To fetch the next page, send `prms.index` with the
        `pushInstanceId` of the last message in the previous response.

        <details>

        <summary>Notes</summary>

        - Category names are matched exactly, including letter case. A name with different case is treated
          as unknown.
        - Unknown category names are skipped without an error.
        - If none of the requested names is recognised, the category filter is dropped and messages from all
          categories are returned, the same as sending no `category` at all.
        - When the application uses brands (business units), the names are matched against active brand
          names, also case-sensitively.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxRequest'
            examples:
              unreadMessages:
                summary: Unread messages in a date range
                value:
                  extId: your_extId
                  status: 2
                  startDate: 1681635178000
                  endDate: 1684227178000
                  numberOfNotification: 3
              paginationPage1:
                summary: Pagination — page 1
                value:
                  extId: externalid
                  status: 7
                  startDate: 1738405578000
                  endDate: 1740997578000
                  numberOfNotification: 3
              paginationPage2:
                summary: Pagination — page 2
                description: "`prms.index` carries the pushInstanceId of the last message from the previous response."
                value:
                  extId: externalid
                  status: 7
                  startDate: 1738405578000
                  endDate: 1740997578000
                  numberOfNotification: 3
                  prms:
                    index: 10742004
      responses:
        '200':
          x-netmera-verified: '2026-11-01'
          description: The user's inbox messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxListResponse'
              examples:
                page1:
                  summary: Single message
                  value:
                    msgs:
                      - msgId: 25965
                        pushInstanceId: 3101819
                        title: test
                        message: Test
                        status: UNREAD
                        sts: 1681635178000
