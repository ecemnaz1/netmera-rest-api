                  profile:
                    type: object
                    description: Key-value map of the user's profile attributes.
                    additionalProperties: true
              example:
                extId: id1
                profile:
                  name: John
                  surname: Brown
                  dateOfBirth: 624315600000
                  email: john.brown@example.com
                  age: 34
                  isSubscribed: true
