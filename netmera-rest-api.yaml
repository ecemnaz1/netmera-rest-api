  /rest/3.0/removeEmail:
    post:
      operationId: removeEmail
      tags: [Email]
      summary: Remove Email Address
      description: |
        Removes a user's email address. Only the email field is cleared: the user, its external ID, devices,
        profile attributes and email permission state are kept.

        ### How it works

        The request is processed asynchronously. `200` means the request has been queued, and the change is
        applied to the user within seconds.

        <details>

        <summary>Notes</summary>

        - You can set a new address later with `updateEmail`.
        - Sending an empty value to `updateEmail` does not remove the address: the request returns `200` but
          the stored address is kept.
        - `unsetProfileAttributes` does not remove it either, because email is a system field, not a profile
          attribute. Use `removeEmail` to clear the address.
        - An `extId` that matches no user in the application, or a user whose email is already empty, also
          returns `200` and changes nothing.
        - A request without `extId` returns HTTP 400 with a plain-text body, not the JSON error body.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extId]
              properties:
                extId:
                  type: string
                  description: External user ID of the user.
            example:
              extId: your_extId
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: |
            The request was queued. Returns no response body.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Missing `extId`. The body is plain text, not the JSON error body."
          content:
            text/plain:
              schema:
                type: string
              example: "Please provide an external id."
          x-netmera-verified: '2026-10-27'
        '415':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                titleUnsupportedMediaType:
                  summary: "The request `Content-Type` is not `application/json`."
                  value:
                    type: "about:blank"
                    title: "Unsupported Media Type"
                    status: 415


