    post:
      operationId: pullProfileAttributes
      tags: [Profile Attributes]
      summary: Remove Values from Array Attributes
      description: |
        Removes values from array-type profile attributes of the given users. The keys must be array
        attributes.

        <details>

        <summary>Notes</summary>

        - Each sent value is removed if present. Values the user does not have are ignored.
        - An attribute the user does not have is left untouched.
        - Removing the last value leaves an empty list; the attribute is not deleted.
        - Send the values as an array of the attribute's type. Otherwise that entry is rejected.
        - Keys of `profile` must match the attribute names defined in the panel exactly (case-sensitive).
        - Undefined keys and values of the wrong type are dropped silently, and an invalid entry is skipped.
        - The request fails with HTTP 400, code `2009` ("Invalid JSON"), only when every entry is invalid.
        - `deviceToken` can be sent instead of `extId`.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                anyOf:
                  - required: [extId]
                  - required: [deviceToken]
                properties:
                  extId:
                    type: string
                    description: External user ID. Required unless `deviceToken` is sent.
                  deviceToken:
                    type: string
                    description: |
                      Push token of one of the user's devices, as an alternative to `extId`.
                      Used only when `extId` is blank.
                  profile:
                    type: object
                    description: |
                      Map of array-type attribute keys to the values removed from them.
                    additionalProperties: true
            example:
