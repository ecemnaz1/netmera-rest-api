  /rest/3.0/getCategoryPreferences:
    get:
      operationId: getCategoryPreferences
      tags: [Category Preferences]
      summary: Get Category Preferences
      description: |
        Returns a user's opt-in preference for each message category, with a per-channel breakdown.

        <details>

        <summary>Notes</summary>

        - The `categoryIds` and `channels` parameters are optional. Without them, the call behaves exactly
          as it did before channel-based preferences were introduced.

        </details>
      parameters:
        - name: externalId
          in: query
          required: true
          description: External user ID in your system.
          schema:
            type: string
          example: exid
        - name: categoryIds
          in: query
          required: false
          description: |
            Category IDs to return; all categories when omitted. Send repeated parameters
            (`?categoryIds=56&categoryIds=57`) or a comma-separated value (`?categoryIds=56,57`); repeated
            values are collapsed.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
          example: [56]
        - name: channels
          in: query
          required: false
          description: |
            Channels to return: `MOBILE`, `SMS`, `EMAIL`, `WHATS_APP`, `IN_APP` and `WEB`, case-insensitive
            (`whatsapp` and `inapp` are not accepted); every channel when omitted, and categories that
            support none of them are left out. Send repeated parameters (`?channels=MOBILE&channels=EMAIL`)
            or a comma-separated value (`?channels=MOBILE,EMAIL`), repeats are collapsed; an unknown channel
            returns HTTP 400, code `2004` ("Unknown category channel: <value>").
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [MOBILE, SMS, EMAIL, WHATS_APP, IN_APP, WEB]
          example: [MOBILE, EMAIL]
      responses:
        '200':
          x-netmera-verified: '2026-11-01'
          description: The user's category preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPreferencesResponse'
              example:
                categoryPreferences:
                  Shopping: true
                  Promotion: false
                categoryChannelPreferences:
                  Shopping:
                    MOBILE: true
                    EMAIL: false
                  Promotion:
                    MOBILE: false
                    EMAIL: false
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2020_noExternalIdIsSent:
                  summary: "`externalId` is empty."
                  value:
                    code: 2020
                    error: "No external id is sent"
                c2004_unknownCategoryChannelValue:
                  summary: "A `channels` value is not one of the supported channels."
                  value:
                    code: 2004
                    error: "Unknown category channel: <value>"
                c5016_theUserWithGivenIdentifier:
                  summary: "No user with the given external id."
                  value:
                    code: 5016
                    error: "The user with given identifier is not found!"
                c2001_anUnexpectedErrorOccurredRetry:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                categoryidsNotAnInteger:
                  summary: "A `categoryIds` value is not an integer."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400


  /rest/3.0/setCategoryPreferences:
    post:
      operationId: setCategoryPreferences
      tags: [Category Preferences]
      summary: Set Category Preferences
      description: |
        Opts a user in to or out of message categories.

        <details>

        <summary>Notes</summary>

        - A user's preference is stored per category and channel.
        - Send `channel` to update one category and channel pair. Omit it to apply the change to every
          channel of the category.
        - The `channel` field is optional: omitting it behaves exactly as it did before channel-based
          preferences were introduced.
        - An entry whose category or channel name is not recognised is skipped as a whole. The other entries
          are still processed, and the call returns 200 without reporting the skipped entry.
        - An entry without `category` returns 200 but changes none of the user's category preferences.
          Always send `category`.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [extId, category, enable]
                properties:
                  extId:
                    type: string
                    description: External user ID.
                  category:
                    type: string
                    description: |
                      Message category name, matched exactly (case-sensitive) against active
                      categories. An entry naming a category that does not exist is skipped.
                  enable:
                    type: boolean
                    description: True to opt-in, false to opt-out.
                  channel:
                    type: string
                    description: |
                      Applies the change only to this channel of the category; every channel when omitted.
                      Values are `MOBILE`, `SMS`, `EMAIL`, `WHATS_APP`, `IN_APP` and `WEB`, case-insensitive
                      (`whatsapp` and `inapp` are not accepted); an unrecognized value skips the entry and
                      leaves that preference unchanged while the other entries are processed, and categories
                      created before channel selection are valid on all channels.
            examples:
              singleChannel:
                summary: Update one channel and all channels
                description: |
                  The first entry updates only the `EMAIL` channel of the category. The second
                  entry has no channel and applies to every channel of the category.
                value:
                  - extId: id1
                    category: Shopping
                    enable: true
                    channel: EMAIL
                  - extId: id1
                    category: Promotion
                    enable: false
              allChannels:
                summary: All channels
                value:
                  - extId: id1
                    category: Shopping
                    enable: true
                  - extId: id1
                    category: Promotion
                    enable: false
      responses:
        '200':
          description: |
            The preferences were updated. Returns no response body.
          x-netmera-verified: '2026-09-06'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2009_invalidJson:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2001_anUnexpectedErrorOccurredRetry:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                postWithEmptyMissingBody:
                  summary: "Missing request body."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400


  /rest/3.0/fireEvents:
    post:
      operationId: fireEvents
      tags: [Events]
      summary: Fire Events
      description: |
        Sends custom events for users from your backend. Each event needs `extId` to identify the user and
        `name` for the event type; add attributes as key-value pairs, based on the event schema defined in
        the Netmera panel.

        <details>

        <summary>Notes</summary>

        - The body must be a JSON array of event objects.
        - Always send events server-side. Never expose the API key in client-side code.
        - Use ISO 8601 format for all timestamps.
        - Keep event names consistent with your defined taxonomy. Inconsistent names break segmentation.
        - Include a source event reference on conversion events to enable attribution.
        - Event names and eventCode values are case-sensitive. A value that differs only in case is an
          unknown event, and that event is rejected.
        - An attribute key that differs only in case is silently ignored. If the attribute is mandatory, the
          event is rejected as missing it.
        - If the request cannot be put into the processing queue, the error is only logged and the call
          still returns 200.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            examples:
              customEvent:
                summary: Custom event
                value:
                  - extId: id_in_my_system_1
                    name: ShareEvent
                    itemId: "4234"
                    channel: Facebook
              cancelOrderEvent:
                summary: Cancel order event
                description: |
                  The fields used here must be configured in the event schema through the
                  Netmera panel.
                value:
                  - extId: id_in_my_system_1
                    name: OrderCancelEvent
                    paymentMethod: Credit Card
                    subTotal: 20.0
                    itemCount: 4
                    grandTotal: 35.0
              aiQuerySubmitted:
                summary: Conversational AI — query submitted
                value:
                  - extId: user_98765
                    name: AIQuerySubmitted
                    platform: chatgpt
                    queryText: 5-day trip to Barcelona under $2000
                    category: travel_planning
              aiConversionCompleted:
