  /rest/3.0/targeting/count:
    post:
      operationId: targetingCount
      tags: [Targeting]
      summary: Count targeted users
      description: |
        Returns the number of unique users whose profiles match a targeting query. It enables
        popularity and adoption metrics based on user-defined profile data without exporting
        user lists or building custom aggregation pipelines.

        Common uses are social proof indicators, entity-based popularity metrics, favorites,
        preferences, interests or affinity counts, and content, product, category or brand
        popularity.

        ### Targeting

        The `target` object follows Netmera's standard targeting format. Profile attributes can be
        queried using single values, multiple values (matching at least one), or operators such
        as `$exists`. Attributes may store values as single values or arrays depending on the
        attribute definition; the API handles both transparently.

        ### Data freshness and caching

        - Maximum delay: 2–3 hours.
        - Cache duration is dynamically optimized based on system load.
        - Counts are computed using aggregation and caching mechanisms. Real-time guarantees are
          not provided, but data freshness is sufficient for social proof and popularity
          scenarios.

        ### Performance considerations

        - Query multiple values in a single request when possible.
        - Avoid excessive polling for the same entity.
        - Apply client-side caching for frequently displayed counts.

        ### Notes and limitations

        - Only User Profile Attribute–based targeting is supported.
        - Attributes must be defined and active in the Netmera panel.
        - The API returns counts only; user lists are not exposed.
        - Counts match the Netmera panel when targeting is identical.
        - The returned count reflects users matching the targeting rules at query time; the
          message delivery audience may vary slightly due to delivery-time conditions applied
          during sending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: object
                  description: |
                    Filtering rules used to select users whose profiles match the given
                    conditions.
                  additionalProperties: true
            examples:
              singleAttributeValue:
                summary: Single attribute value
                description: Returns the number of users who have this value in the specified profile attribute.
                value:
                  target:
                    profile:
                      favoriteFootballPlayers: ["352481"]
              singleValueAttribute:
                summary: Single-value attribute
                description: Returns the number of users who selected this value.
                value:
                  target:
                    profile:
                      soccerFavoriteTeam: "2212"
              multipleValues:
                summary: Multiple values
                description: Returns the number of users who match at least one of the provided values.
                value:
                  target:
                    profile:
                      favoriteFootballPlayers: ["15", "23"]
              existsOperator:
                summary: Exists operator
                description: Returns the number of users whose profile does not contain the specified attribute.
                value:
                  target:
                    profile:
                      name:
                        $exists: false
      responses:
        '200':
          description: The distinct user count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of unique users matching the target.
              example:
                count: 184523
        '400':
          description: Invalid targeting query.

  /rest/3.0/inbox/getAllInbox:
    post:
      operationId: getAllInbox
      tags: [Inbox]
      summary: List inbox messages
      description: |
        Fetches the push notifications stored on the server for a user. Supports pagination and
        filtering by status or time range.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxRequest'
            examples:
              unreadMessages:
                summary: Unread messages in a date range
                value:
                  extId: your_extId
                  status: 2
                  startDate: 1681635178000
                  endDate: 1684227178000
                  numberOfNotification: 3
              paginationPage1:
                summary: Pagination — page 1
                value:
                  extId: externalid
                  status: 7
                  startDate: 1738405578000
                  endDate: 1740997578000
                  numberOfNotification: 3
              paginationPage2:
                summary: Pagination — page 2
                description: "`prms.index` carries the pushInstanceId of the last message from the previous response."
                value:
                  extId: externalid
                  status: 7
                  startDate: 1738405578000
                  endDate: 1740997578000
                  numberOfNotification: 3
                  prms:
                    index: 10742004
      responses:
        '200':
          description: The user's inbox messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxListResponse'
              examples:
                page1:
                  summary: Single message
                  value:
                    msgs:
                      - msgId: 25965
                        pushInstanceId: 3101819
                        title: test
                        message: Test
                        status: UNREAD
                        sts: 1681635178000
                        subText: test
                    cnts:
                      "2": 1
                    prms:
                      index: 3101819
                lastPage:
                  summary: Last page — no prms returned
                  value:
                    msgs:
                      - msgId: 12942
                        pushInstanceId: 10734004
                        title: msgtitle
                      - msgId: 12941
                        pushInstanceId: 10734003
                        title: msgtitle
                    cnts:
                      "1": 2

  /rest/3.0/inbox/get:
    get:
      operationId: getInboxMessage
      tags: [Inbox]
      summary: Get an inbox message
      description: Retrieves a single inbox message using its push instance ID.
      parameters:
        - name: piid
          in: query
          required: true
          description: |
            Push instance ID of the inbox message, returned in the `getAllInbox` response.
          schema:
            type: integer
            format: int64
          example: 40652173
      responses:
        '200':
          description: The inbox message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxMessageDetail'
              example:
                msgId: 12345
                extID: sampleExternalId
                pushInstanceId: 40652173
                title: Sample inbox title
                message: Sample inbox message
                deeplink: null
                androidMediaUrl: null
                iosMediaUrl: null
                androidThumbnail: null
                personalizedMsg: null
                personalizedTitle: null
                subText: null
                status: UNREAD
                customParams: {}
                sts: 1787583761927
                ctg: []
                lbl: []

  /rest/3.0/inbox/statusChange:
    post:
      operationId: inboxStatusChange
      tags: [Inbox]
      summary: Change inbox message status
      description: |
        Updates the status of one or more inbox messages. `piids` defines the messages whose
        statuses will be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extId, piids]
              properties:
                extId:
                  type: string
                  description: The unique external ID of the user.
                piids:
                  type: array
                  description: Push instance IDs of the messages to update.
                  items:
                    type: integer
                st:
                  type: integer
                  description: |
                    Target status. Status values used by the Inbox API are 1 = Read,
                    2 = Unread, 3 = Read & Unread, 4 = Deleted, 7 = All.
            example:
              extId: your_extId
              piids: [2584151]
              st: 4
      responses:
        '200':
          description: |
            The statuses were updated. Returns no response body.
          x-netmera-verified: '2026-09-06'

components:
  securitySchemes:
    NetmeraApiKey:
      type: apiKey
      in: header
      name: X-netmera-api-key
      description: |
        REST API key. Available in the Netmera Panel under Developers > API.

  schemas:
    ErrorResponse:
      type: object
      description: |
        Application-level error envelope returned by the API.

        Framework-level failures such as an unmatched route do not use this shape; they
        return an RFC 9457 problem detail (`type`, `title`, `status`, `detail`, `instance`)
        instead.
      properties:
        code:
          type: integer
          description: Netmera error code. See the error table in the API description.
        error:
          type: string
          description: Human-readable explanation of the failure.
      example:
        code: 2004
        error: Field 'notificationKey' should be a text
      x-netmera-verified: '2026-09-06'

    CategoryPreferencesResponse:
      type: object
      description: |
        Push category opt-in state for a single user. Category names are defined in the
        Netmera panel and are used verbatim as object keys, so a key may contain spaces,
        punctuation, trailing whitespace or non-ASCII characters. The set of keys is
        therefore app-specific and open-ended.
      properties:
        categoryPreferences:
          type: object
          description: Map of category name to opt-in state.
          additionalProperties:
            type: boolean

    Platform:
      type: string
      description: |
        Target platform. Values documented in the Netmera Developer Guide are `IOS`,
        `ANDROID`, `CHROME`, `FIREFOX`, `SAFARI`, `EDGE`, `OPERA`, `YANDEX`, `MACOS`,
        `EMAIL` and `SMS`. Push statistics responses additionally report `WP`.
      examples: [IOS, ANDROID, CHROME]

    ClickAction:
      type: object
      description: |
        Click behavior of the notification. `url` opens a web page in the device's default
        browser (iOS and Android). `deeplink` launches the app via a registered deeplink URI
        (iOS and Android) and must be configured correctly in the app. `doNothing` disables the
        automatic click handling mechanism and is supported on Android only, which means a
        custom click handler must be implemented.
      properties:
        url:
          type: string
          description: Web page opened in the device's default browser.
        deeplink:
          type: string
          description: Registered deeplink URI that launches the app.
        doNothing:
          type: boolean
          description: Android only. No action is triggered when the user taps the notification.
      additionalProperties: true

    CarouselItemClickAction:
      type: object
      description: Click action of a carousel or slider item.
      properties:
        action:
          type: string
          description: Action type, for example DEEP_LINK.
        url:
          type: string
        deeplinkType:
          type: string
          description: Deeplink type, for example URL.
        deepLinkUrl:
          type: string
      additionalProperties: true

    CarouselItem:
      type: object
      description: One item of a carousel push.
      properties:
        title:
          type: string
        content:
          type: string
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true

    SliderItem:
      type: object
      description: One item of a slider push.
      properties:
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true

    IosOptions:
      type: object
      description: Optional parameters specific to iOS.
      properties:
        title:
          type: string
          description: Notification title shown on iOS, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: |
            Name of a sound defined in the panel under Developers > Sounds, per platform.
        badge:
          type: boolean
          description: Badge display. Badges are enabled only for iOS.
        mediaUrl:
          type: string
          description: Rich media URL. On iOS an image, sound or video may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of iOS users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true

    AndroidOptions:
      type: object
      description: Optional parameters specific to Android.
      properties:
        title:
          type: string
          description: Notification title shown on Android, overriding the message title.
        subtitle:
          type: string
        sound:
          type: string
          description: |
            Name of a sound defined in the panel under Developers > Sounds, per platform.
        vibration:
          type: boolean
          description: |
            Android only. Enables or disables vibration when a device receives the push
            notification.
        bigText:
          type: string
        mediaUrl:
          type: string
          description: Rich media URL. On Android an image may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of Android users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
      additionalProperties: true

    SetAttrOrTagEntry:
      type: object
      description: |
        Profile attribute or tag set when a button is clicked. The button click action must be
        set to "Open App"; the operation is triggered after the push open event inside the
        application module.
      properties:
        setOnClick:
          type: string
          description: |
            `PROFILE_ATTR` for the profile attribute flow. In the tag flow the guide's examples
            carry the attribute name in this field.
        attrName:
          type: string
          description: Profile attribute name.
        attrValue:
          type: string
          description: Profile attribute value.
        tagName:
          type: string
          description: Tag name applied on click.
      additionalProperties: true

    ButtonSet:
      type: object
      description: |
        Button set attached to the notification. Button sets must first be created in the panel
        under **Settings > Button Sets**; the button name itself is not mandatory. Besides the
        documented fields, each additional key is a button name mapped to its action URL
        (`$buttonSetName: $actionUrl`).
      properties:
        id:
          type: integer
          description: |
            Button set ID, visible in the panel under Settings > Button Sets.
        buttonNames:
          type: object
          description: |
            Renames buttons by mapping each old button name to a new one. If this field is
            omitted, notifications are sent with the existing button names.
          additionalProperties:
            type: string
        setAttrOrTag:
          type: object
          description: |
            Maps a button name to the profile attribute or tag set when that button is clicked.
          additionalProperties:
            $ref: '#/components/schemas/SetAttrOrTagEntry'
      additionalProperties: true

    TargetOperatorList:
      description: |
        A single value, an array of values (OR), or an operator object using `$or`, `$and` or
        `$not`.
      oneOf:
        - type: string
        - type: array
          items:
            type: string
        - type: object
          properties:
            $or:
              type: array
              items:
                type: string
            $and:
              type: array
              items:
                type: string
            $not:
              type: array
              items:
                type: string
          additionalProperties: true

    Location:
      type: object
      description: Geographical area used to target users based on their location.
      required: [latitude, longitude, radius]
      properties:
        latitude:
          type: number
          description: The latitude of the center point.
        longitude:
          type: number
          description: The longitude of the center point.
        radius:
          type: number
          description: |
            The radius value, in kilometers, from the center to search for users.

    Target:
      type: object
      description: |
        Designated recipients of the notification. The target object cannot be empty — to send
        to all users of the selected platforms, set `sendToAll` to `true`.

        Profile attribute codes are listed in the Netmera Panel under
        **Developers > Profile Attributes > Code**. When multiple attributes are defined in the
        same `profile` object, the conditions are evaluated with AND logic; values inside a
        single attribute are connected with OR.
      properties:
        sendToAll:
          type: boolean
          description: |
            When true, the notification is dispatched to all users selected for the specified
            platforms.
        tag:
          $ref: '#/components/schemas/TargetOperatorList'
        segment:
          $ref: '#/components/schemas/TargetOperatorList'
        profile:
          type: object
          description: |
            Profile attribute conditions. Each key is a profile attribute code; the value can be
            a single value, an array of values, or an operator object such as
            `{"$exists": true}`. The operators `$or` and `$and` may also wrap a group of
            attribute conditions.
          additionalProperties: true
        pa:
          type: object
          description: |
            Profile attribute targeting used by `sendNotification`. Each key is a profile
            attribute code and each value a single value or an array of values (OR).
          additionalProperties: true
        location:
          $ref: '#/components/schemas/Location'
        extId:
          description: |
            External ID of the target user, or an array of external IDs. A maximum of 1000
            unique external IDs may be included in a single request.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        deviceToken:
          description: |
            Device token of the target device, or an array of device tokens. A maximum of 1000
            unique device tokens may be included in a single request.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        email:
          type: string
          description: Target email address.
        msisdn:
          type: string
          description: Target phone number.
      additionalProperties: true

    Schedule:
      type: object
      description: Future delivery date and time of the message.
      properties:
        startTime:
          type: string
          description: Date and time when the message should be delivered.
          examples: ["2024-02-01T15:30:00"]
        localTimezone:
          type: boolean
          description: Whether the start time is evaluated in the user's local timezone.

    Speed:
      type: object
      description: Rate at which the notifications are sent, in chunks or packages.
      properties:
        intervalMins:
          type: integer
          description: Interval between packages, in minutes.
        packageSize:
          type: integer
          description: Number of notifications per package.

    Hook:
      type: object
      description: |
        Optional hook parameters. If no hook is to be attached, exclude the hook block from the
        request.
      properties:
        name:
          type: string
        params:
          type: object
          additionalProperties: true

    BulkMessage:
      type: object
      description: Content and delivery options of a bulk notification.
      required: [title, platforms, text]
      properties:
        title:
          type: string
          description: |
            The campaign's name, aiding in the identification of notifications on the panel.
        platforms:
          type: array
          description: Specifies the platforms for push notification delivery.
          items:
            $ref: '#/components/schemas/Platform'
        text:
          type: string
          description: The message content of the push notification displayed to the user.
        message:
          type: string
          description: |
            Additional message content used alongside `text` in the carousel and slider
            examples of the Netmera Developer Guide.
        personalizedTitle:
          type: string
          description: |
            When this field is provided and the corresponding profile attribute exists for the
            user, the web push notification's title is set to the value of `personalizedTitle`.
            If the attribute is not set on the user, the notification is not sent.
        personalizedMessage:
          type: string
          description: |
            Personalized message with `@{attribute}` placeholders. Users who have the referenced
            profile attributes receive the personalized text; users missing any of them receive
            the default `text`.
        categories:
          description: |
            Message categories, as a single value or an array. Categories must be pre-defined in
            the panel under **Settings > Message Categories**.
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: integer
        threadId:
          type: string
          description: |
            ID used to group notifications in the notification center. Notifications sharing a
            `threadId` are grouped together. Supported on iOS and Android.
        customJson:
          type: object
          description: |
            Additional custom parameters, available on the device when the push notification is
            received. `refID` inside this object references a previously sent notification key
            for an Android live push update.
          additionalProperties: true
        params:
          type: object
          description: |
            Message parameters. Used for example with `_nm_badge_count` to set the iOS badge
            count.
          additionalProperties: true
        click:
          $ref: '#/components/schemas/ClickAction'
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        iconUrl:
          type: string
          description: |
            Icon URL of the notification. Required if the platforms include Chrome or Firefox.
        wpChromeImage:
          type: string
          description: |
            For Windows Chrome and Firefox users, the URL of the image displayed in the
            notification. The URL must begin with `https`.
        interactionRequired:
          type: boolean
          description: |
            Whether the notification persists until the user interacts with it, by clicking or
            dismissing it. The default value is false.
        limit:
          type: integer
          description: |
            The maximum number of users the notification is sent to. With 1 million users and a
            limit of 100,000, the notification is sent to 100,000 randomly selected users.
            Limits can also be set per platform inside the `ios` and `android` blocks.
        ttl:
          type: string
          description: |
            Time to live value of the notification. If a target device does not receive the
            notification within the given period, it will never be received. Example usage:
            `15d` means 15 days, `20h` means 20 hours and `30m` means 30 minutes.
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        doNotNotify:
          type: boolean
          description: Whether to show the push notification in the notification center.
        labels:
          description: |
            Label information added to the message. The label appears in the push report
            generated on the panel.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      additionalProperties: true

    BulkNotificationRequest:
      type: object
      description: |
        Bulk notification request. `message` and `target` are the canonical top-level blocks;
        the carousel, slider and some web push examples in the Netmera Developer Guide place
        message fields directly at the root level, so additional root properties are permitted.
      properties:
        message:
          description: |
            Content and delivery options of the notification. In the guide's carousel and slider
            examples the payload is flat — the message fields sit at the root level and `message`
            itself carries a text value — so a plain string is also accepted here.
          oneOf:
            - $ref: '#/components/schemas/BulkMessage'
            - type: string
        target:
          $ref: '#/components/schemas/Target'
        languages:
          type: object
          description: |
            Per-language overrides of `title`, `text` and `click`, keyed by language name.
          additionalProperties:
            type: object
            properties:
              title:
                type: string
              text:
                type: string
              click:
                $ref: '#/components/schemas/ClickAction'
            additionalProperties: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        speed:
          $ref: '#/components/schemas/Speed'
        extRef:
          type: string
          description: |
            External reference of the push notification — an identifier of the notification in
            your own system. Any ID may be assigned and queried by later.
      additionalProperties: true

    TransactionalMessage:
      type: object
      description: Per-call overrides of a transactional notification definition.
      properties:
        params:
          type: object
          description: |
            Custom parameters that tailor the notification to a specific user. A message
            configured as "Hello @{name}" with a `name` parameter produces "Hello John" or
            "Hello Mary". If a custom parameter differs from the parameter configured in the
            panel, the request value overwrites it.
          additionalProperties: true
        click:
          $ref: '#/components/schemas/ClickAction'
        customJson:
          type: object
          description: Custom parameters available on the device when the push is received.
          additionalProperties: true
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        ttl:
          type: string
          description: |
            Time to live value of the notification. Example usage: `15d` means 15 days, `20h`
            means 20 hours and `30m` means 30 minutes.
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        doNotNotify:
          type: boolean
          description: Whether to show the push notification in the notification center.
      additionalProperties: true

    SendNotificationRequest:
      type: object
      description: A single transactional notification send request.
      required: [notificationKey]
      properties:
        notificationKey:
          type: string
          description: |
            Key identifier of the specific notification definition intended for a user. The
            notification key is created in, and obtained from, the panel, or returned by
            `createNotificationDefinition`.

            The value must be sent as a **string**, even though
            `createNotificationDefinition` returns it as an integer. Sending it as an integer
            is rejected with Netmera error code 2004.
        target:
          $ref: '#/components/schemas/Target'
        message:
          $ref: '#/components/schemas/TransactionalMessage'
        lastActiveDevice:
          type: boolean
          description: |
            `true` sends only to the user's last active device; `false` sends to all devices.
      additionalProperties: true

    NotificationDefinitionRequest:
      type: object
      description: |
        Transactional notification definition. The guide's carousel and slider examples place
        the same fields either at the root level or inside a `message` block, so additional root
        properties are permitted.
      properties:
        title:
          type: string
          description: |
            The name of the campaign. Inside the iOS and Android blocks, `title` instead sets the
            notification title shown on that platform.
        message:
          description: |
            The default push notification message. If no personalized message is used, this
            message is sent to users.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        text:
          type: string
          description: Notification text, used in the carousel and slider definition examples.
        personalizedMessage:
          type: string
          description: |
            User-specific message using `@{xxxx}` placeholders. Placeholders can be profile
            attributes or values sent via a transactional message call.
        personalizedTitle:
          type: string
          description: Personalized title using a placeholder.
        personalizedSubText:
          type: string
          description: Personalized subtext using a placeholder.
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        platforms:
          type: array
          description: Indicates the platforms capable of receiving this notification.
          items:
            $ref: '#/components/schemas/Platform'
        categories:
          description: |
            Message categories. Either the category ID shown in the panel under
            **Settings > Message Categories** or the category name may be used, so values can be
            strings or integers.
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: integer
        labels:
          description: |
            Label information added to the message. The label appears in the push report
            generated on the panel.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        threadId:
          type: string
          description: ID used to group notifications in the notification center.
        click:
          $ref: '#/components/schemas/ClickAction'
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        hook:
          $ref: '#/components/schemas/Hook'
      additionalProperties: true

    EmailSmsRequest:
      type: object
      description: Email or SMS message sent with its content included in the request.
      properties:
        target:
          $ref: '#/components/schemas/Target'
        platforms:
          type: array
          description: '`["EMAIL"]` for email, `["SMS"]` for SMS.'
          items:
            $ref: '#/components/schemas/Platform'
        title:
          type: string
          description: Campaign name.
        message:
          type: string
          description: |
            Message body. For email this is the HTML content; for SMS the plain text.
        from:
          type: string
          description: Sender email address.
        senderName:
          type: string
          description: Sender display name.
        subject:
          type: string
          description: Email subject line.
        smsHeader:
          type: string
          description: SMS header.
        smsIysMessageType:
          type: string
          description: |
            `"N"` for Notification, `"C"` for Campaign.

            Required when `platforms` is `["SMS"]`. Omitting it on an SMS send is rejected
            with Netmera error code 2004 and the message
            "Please add smsIysMessageType parameter into request!".
        smsIysRecipientType:
          type: string
          description: |
            `"B"` for Personal, `"T"` for Trader.

            Not required — an SMS send succeeds without it, unlike `smsIysMessageType`.
      additionalProperties: true

    Event:
      type: object
      description: |
        A custom event. Beyond `extId` and `name`, additional event-specific attributes are
        passed as key-value pairs and must match the event schema defined in the Netmera panel.
      required: [extId, name]
      properties:
        extId:
          type: string
          description: Unique identifier of the user in your system.
        name:
          type: string
          description: Name of the event.
      additionalProperties: true

    PushPermissionRequest:
      type: object
      description: |
        Push permission change for all devices of a user (`extId`) or one device
        (`deviceToken`).
      properties:
        extId:
          type: string
          description: External user ID.
        deviceToken:
          type: string
          description: Device token.

    TagUsersRequest:
      type: object
      required: [tag, extIds]
      properties:
        tag:
          description: Tag name, or an array of tag names.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string

    EmailPermissionRequest:
      type: object
      description: Email permission change by external user IDs or by email addresses.
      properties:
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string
        emailList:
          type: array
          description: Email addresses, as an alternative to `extIds`.
          items:
            type: string

    SmsPermissionRequest:
      type: object
      description: SMS permission change by external user IDs or by MSISDNs.
      properties:
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string
        msisdnList:
          type: array
          description: Phone numbers, as an alternative to `extIds`.
          items:
            type: string

    WhatsAppPermissionRequest:
      type: object
      description: WhatsApp permission change by external user IDs or WhatsApp numbers.
      properties:
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string
        wpNumbers:
          type: array
          description: WhatsApp numbers.
          items:
            type: string

    Device:
      type: object
      properties:
        platform:
          type: string
        token:
          type: string
        deviceModel:
          type: string
        pushPermitted:
          type: boolean

    PlatformStats:
      type: object
      properties:
        platform:
          type: string
        sent:
          type: integer
        failed:
          type: integer
        clicked:
          type: integer

    PushStatsByKeyResponse:
      type: object
      properties:
        notificationKey:
          type: integer
        status:
          type: string
          description: 'Delivery status, for example FINISHED or SENDING.'
        startDate:
          type: integer
          format: int64
        endDate:
          type: integer
          format: int64
        stats:
          type: array
          items:
            $ref: '#/components/schemas/PlatformStats'

    PushStatsByDateRangeResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PushStatsByKeyResponse'

    PushResultItem:
      type: object
      properties:
        platform:
          type: string
        status:
          type: string
          description: 'Result status, for example SUCCESS or FAILED.'
        errorCode:
          type: string
        errorMsg:
          type: string
        installationId:
          type: string
        extId:
          type: string
        timeStamp:
          type: integer
          format: int64
        msgTitle:
          type: string
        msgText:
          type: string
      additionalProperties: true

    PushResultResponse:
      type: object
      properties:
        nextPage:
          type: string
          description: |
            URL of the next page of results. Send a request to this value to fetch the next page.
        list:
          type: array
          items:
            $ref: '#/components/schemas/PushResultItem'

    InboxRequest:
      type: object
      required: [extId, status]
      properties:
        extId:
          type: string
          description: The unique external ID of the user.
        status:
          type: integer
          description: |
            Filters the messages based on read status. Accepted values: 1 = Read, 2 = Unread,
            3 = Read & Unread, 4 = Deleted, 7 = All.
        numberOfNotification:
          type: integer
          description: |
            Defines the number of messages to return per page. Defaults to 20 if not provided.
        prms:
          type: object
          description: Pagination block.
          properties:
            index:
              type: integer
              format: int64
              description: |
                The `pushInstanceId` of the last message received in the previous response.
        startDate:
          type: integer
          format: int64
          description: |
            Filters messages starting from this date. Epoch timestamp in milliseconds.
        endDate:
          type: integer
          format: int64
          description: |
            Filters messages until this date. Epoch timestamp in milliseconds.
        category:
          type: array
          description: Filters messages by categories.
          items:
            type: integer

    InboxMessage:
      type: object
      properties:
        msgId:
          type: integer
        pushInstanceId:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        status:
          type: string
        sts:
          type: integer
          format: int64
        subText:
          type: string
      additionalProperties: true

    InboxListResponse:
      type: object
      properties:
        msgs:
          type: array
          items:
            $ref: '#/components/schemas/InboxMessage'
        cnts:
          type: object
          description: |
            Message counts keyed by status value. The last page of a paginated result omits the
            `prms` block.
          additionalProperties:
            type: integer
        prms:
          type: object
          properties:
            index:
              type: integer
              format: int64
              description: |
                The `pushInstanceId` of the last message in this batch, passed as `prms.index`
                in the next request.

    InboxMessageDetail:
      type: object
      properties:
        msgId:
          type: integer
        extID:
          type: string
        pushInstanceId:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        deeplink:
          type: [string, 'null']
        androidMediaUrl:
          type: [string, 'null']
        iosMediaUrl:
          type: [string, 'null']
        androidThumbnail:
          type: [string, 'null']
        personalizedMsg:
          type: [string, 'null']
        personalizedTitle:
          type: [string, 'null']
        subText:
          type: [string, 'null']
        status:
          type: string
        customParams:
          type: object
          additionalProperties: true
        sts:
          type: integer
          format: int64
        ctg:
          type: array
          description: Categories.
          items: {}
        lbl:
          type: array
          description: Labels.
          items: {}
      additionalProperties: true
