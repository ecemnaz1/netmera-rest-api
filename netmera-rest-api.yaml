  /rest/3.0/registerUsers:
    post:
      operationId: registerUsers
      tags: [Users]
      summary: Register Users
      description: |
        Registers users and their devices from your backend, or updates existing ones. Each array entry is
        one registration: a device with its push token and platform, or an SMS-only user with an MSISDN.

        ### How it works

        1. Netmera validates the whole request, then processes the registrations asynchronously.
        2. Each registration is matched to an existing user by `extId`. If none matches, a new user is
           created.
        3. Optional tags and profile attributes in the entry are applied to the user: profile values are
           merged into the existing profile and tags are added.

        <details>

        <summary>Notes</summary>

        - If any entry is invalid, the whole request is rejected with HTTP 400 and no entry is registered,
          valid ones included.
        - An entry is invalid when it has neither `platform` nor `msisdn`, an unknown `platform`, `tags`
          that is not an array, or an unreadable `profile` block.
        - An empty array is rejected with code `2020`.
        - A body that is a single object instead of an array returns HTTP 400, code `2001`, "An unexpected
          error occurred. Retry later.".
        - If the `deviceToken` already belongs to a device, that device moves to this user. An anonymous
          owner simply receives the `extId`.
        - If that device's owner has a different `extId`, the owner is not changed and a new user is created
          instead.
        - Without a `deviceToken`, every call creates a new device, except for EMAIL and SMS platforms,
          which get no device.
        - An email address or phone number held by another user moves to this user.
        - A previously deleted user is restored.

        </details>
      parameters:
        - name: X-netmera-app-xid
          in: header
          required: false
          description: |
            External identifier of the application the registrations come from, recorded with every
            registration; surrounding whitespace is trimmed. Without it the host name of the `Origin` header
            is used, and without both no identifier is recorded.
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: |
            Used only when `X-netmera-app-xid` is absent: the host name of this URL is recorded as
            the application identifier.
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                anyOf:
                  - required: [platform]
                  - required: [msisdn]
                properties:
                  extId:
                    type: string
                    description: |
                      External user ID in your system. Recommended; needed to target the user in
                      other endpoints.
                  platform:
                    type: string
                    description: |
                      Device platform, case-insensitive; the value or its display name is accepted: `IOS`
                      (`iOS`), `ANDROID` (`Android`), `WP` (`Windows`), `SMS` (`Sms`), `MACOS` (`Macos`,
                      also `SAFARI`), `CHROME`, `FIREFOX`, `WINDOWS`, `REST`, `WEBOTH` (`WebOther`), `EMAIL`
                      (`Mail`), `OPERA`, `EDGE`, `YANDEX`, `WHATS_APP` (`WhatsApp`), `UNKNOWN`. Required
                      unless `msisdn` is provided (the user is then stored as an SMS user); `WINDOWS` or
                      `windows` resolves to `WP`, and an unknown value rejects the whole request with HTTP
                      400, code `2001`.
                  deviceToken:
                    type: string
                    description: Push token of the device.
                  email:
                    type: string
                    description: Email address of the user.
                  msisdn:
                    type: string
                    description: |
                      Phone number of the user, including the country code. Required unless
                      `platform` is provided.
                  tags:
                    type: array
                    description: Tag names to add to the user.
                    items:
                      type: string
                  profile:
                    type: object
                    description: |
                      Key-value object of profile attributes to set. Keys must match the
                      attribute names defined in the panel exactly (case-sensitive); keys that do
                      not match an attribute name are dropped silently.
                    additionalProperties: true
            example:
              - extId: id_in_my_system_1
                platform: IOS
                deviceToken: my_device_token
                email: example@netmera.com
                msisdn: "+90xxxxxxxx"
                tags: [Sport]
                profile:
                  name: John
                  age: 34
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The registrations were accepted for processing.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "No valid registration in the request."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                noRegistration:
                  summary: "The array is empty."
                  value:
                    code: 2020
                    error: "No registration is sent"
                noPlatformOrMsisdn:
                  summary: "No entry has `platform` or `msisdn`."
                  value:
                    code: 2020
                    error: "Platform or msisdn must be sent"
                invalidBlock:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid registrations block"
                c2009_invalidTagsBlock_code:
                  summary: "`tags` is not an array."
                  value:
                    code: 2009
                    error: "Invalid tags block"
                c2009_invalidProfileBlock_code:
                  summary: "The `profile` object could not be read."
                  value:
                    code: 2009
                    error: "Invalid profile block"
                c2009_invalidRegistrationsBlock_code:
                  summary: "The single entry in the request could not be read."
                  value:
                    code: 2009
                    error: "Invalid registrations block"
                c2020_allRegistrationError_code:
                  summary: "None of the entries in the request could be read."
                  value:
                    code: 2020
                    error: "All registration error"
                c2009_invalidJson_code:
                  summary: "The request body could not be read."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2001_anUnexpectedErrorOccurredRetry_code:
                  summary: "A `platform` value is not recognised. The whole request is rejected."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
          x-netmera-verified: '2026-10-27'
        '500':
          description: "Error responses the API can return."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2001_internalServerError:
                  summary: "No item in the request could be put into the processing queue. If only some items fail, the call still returns 200."
                  value:
                    code: 2001
                    error: "Internal server error"


  /rest/3.0/deleteUsers:
    post:
      operationId: deleteUsers
      x-hideTryItPanel: true
      tags: [Users]
      summary: Delete Users
      description: |
        Marks users as untracked, so they are no longer targeted by campaigns. The user records are
        kept; to erase all of their data irreversibly, use `deleteUsersPermanently`.

        <details>

        <summary>Notes</summary>

        - `deleteUsers` does not remove the user record. It marks the users as untracked, and
          `getProfileAttributes` still returns them.
        - `deleteUsersPermanently` takes the same request body but also erases every piece of data stored
          about the users. It cannot be undone.
        - If permanent deletion has not been activated for your application, `deleteUsersPermanently`
          behaves like `deleteUsers`.
        - Untracked users are not removed later. They stay untracked and are excluded from targeting and
          counts.
        - If the same `extId` is registered or updated again, the user is tracked again.
        - A request without `extIds` returns HTTP 500, code `2001`.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extIds]
              properties:
                extIds:
                  type: array
                  description: External user IDs to delete.
                  items:
                    type: string
            example:
              extIds: [id1]
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The deletion request was accepted.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Invalid JSON."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                invalidJson:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2009_invalidExternalIdBlock_code:
                  summary: "`extIds` is not an array."
                  value:
                    code: 2009
                    error: "Invalid external id block"
          x-netmera-verified: '2026-10-27'
        '500':
          description: "Missing `extIds`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                missingExtIds:
                  summary: "`extIds` is not sent."
                  value:
                    code: 2001
                    error: "Internal server error"
          x-netmera-verified: '2026-10-27'


  /rest/3.0/deleteUsersPermanently:
    post:
      operationId: deleteUsersPermanently
      x-hideTryItPanel: true
      tags: [Users]
      summary: Delete Users Permanently
      description: |
        Permanently deletes all data of the given users from Netmera, including their devices, profile
        attributes, events and records. The deleted data cannot be recovered.

        ### How it works

        A background job deletes the users and their installations about one minute after the request. This
        happens only when permanent deletion is enabled for the application. Without it, the call behaves
        like `deleteUsers` and only marks the users as untracked.

        <details>

        <summary>Notes</summary>

        - The endpoint is available only to accounts with data deletion access. Request access through the
          Netmera panel.
        - A user removed earlier with `deleteUsers` is still stored as untracked, so it can still be deleted
          permanently.
        - If any `extId` in the request matches no user, the whole request fails with HTTP 400, code `2001`,
          "An unexpected error occurred. Retry later.".
        - Newer API builds return HTTP 400, code `5016`, "User with external id '<extId>' does not exist or
          has already been permanently deleted" instead.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extIds]
              properties:
                extIds:
                  type: array
                  description: External user IDs to delete.
                  items:
                    type: string
            examples:
              single:
                summary: Delete one user
                value:
                  extIds: [externalid]
      responses:
        '200':
          description: |
            The deletion request was accepted. Returns no response body.
          x-netmera-verified: '2026-09-06'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2001_anUnexpectedErrorOccurredRetry:
                  summary: "An `extId` matches no user. The whole request is rejected and nothing is deleted."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
                c2009_invalidExternalIdBlock:
                  summary: "`extIds` is not an array."
                  value:
                    code: 2009
                    error: "Invalid external id block"
                c2009_invalidJson:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                titleBadRequestDetailFailed:
                  summary: "Missing request body."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400
                    detail: "Failed to read request"
        '500':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2001_internalServerError:
                  summary: "`extIds` is missing or empty, or none of the users could be queued for deletion."
                  value:
                    code: 2001
                    error: "Internal server error"


  /rest/3.0/getProfileAttributes:
    get:
      operationId: getProfileAttributes
      tags: [Profile Attributes]
      summary: Get Profile Attributes
      description: |
        Returns the current profile attributes of a user, identified by `extId` or, when `extId` is not
        sent, by `deviceToken`.

        <details>

        <summary>Notes</summary>

        - Only attributes that are still defined in the application are returned.
        - `extId` in the response repeats the `extId` query parameter.
        - When the user is looked up by `deviceToken` only, `extId` is returned as `null`.

        </details>
      parameters:
        - name: extId
          in: query
          required: false
          description: |
