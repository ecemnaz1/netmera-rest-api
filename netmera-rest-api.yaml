  /rest/3.0/setProfileAttributes:
    post:
      operationId: setProfileAttributes
      tags: [Profile Attributes]
      summary: Set Profile Attributes
      description: |
        Sets or updates profile attributes for the given users. Each array entry pairs an `extId` with a
        key-value `profile` object. To remove keys from a user, use `unsetProfileAttributes`.

        <details>

        <summary>Notes</summary>

        - Only the attributes you send change. All other attributes keep their values.
        - Each sent value replaces the stored one. Array attributes are replaced as a whole; use
          `pushProfileAttributes` or `pullProfileAttributes` to add or remove single values.
        - Keys of `profile` must match the attribute names defined in the panel exactly (case-sensitive).
        - Undefined keys, values of the wrong type and null values are dropped silently, and an invalid
          entry is skipped.
        - The request fails with HTTP 400, code `2009` ("Invalid JSON"), only when every entry is invalid.
        - If the application is set to reject invalid entries, one invalid entry makes the whole request
          fail with this invalid-JSON error and nothing is applied. Examples are an entry without both extId
          and deviceToken, a wrong value type or a missing mandatory attribute.
        - `deviceToken` can be sent instead of `extId`.
        - When unknown users are reported in `notExist`, an entry is listed if its extId is unknown, and
          also if the extId exists but the entry carries a deviceToken that matches no device.
        - Entries that identify the user only by deviceToken may or may not be listed (as null), depending
          on existing data. `notExist` is reliable only for entries sent with extId alone.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                anyOf:
                  - required: [extId]
                  - required: [deviceToken]
                properties:
                  extId:
                    type: string
                    description: External user ID. Required unless `deviceToken` is sent.
                  deviceToken:
                    type: string
                    description: |
                      Push token of one of the user's devices, as an alternative to `extId`.
                      Used only when `extId` is blank.
                  profile:
                    type: object
                    description: Key-value object of profile attributes to set.
                    additionalProperties: true
                    patternProperties:
                      '^.+\.opr$':
                        type: string
                        enum: [OVERWRITE, ADD, REMOVE]
                        default: OVERWRITE
                        description: |
                          Operation for an array attribute, sent as the sibling key `<attributeName>.opr`,
                          for example `"interests": ["a"], "interests.opr": "OVERWRITE"`; read only when the
                          value is an array, case-sensitive. `OVERWRITE` (default) replaces the stored list,
                          `ADD` currently behaves like `OVERWRITE`, and `REMOVE` or any other value skips
                          the entry; use `pushProfileAttributes` and `pullProfileAttributes` for single
                          values.
            examples:
              multipleUsers:
                summary: Set attributes for multiple users
                value:
                  - extId: id1
                    profile:
                      age: 24
                  - extId: id2
                    profile:
                      name: John
              registerUser:
                summary: Identify and register a user
                value:
                  - extId: user_98765
                    profile:
                      name: John
                      email: user@example.com
                      source: chatgpt_app
                      first_seen_channel: conversational_ai
      responses:
        '200':
          description: |
            The attributes were set. Returns no response body.
          x-netmera-verified: '2026-09-06'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'
        '400':
          description: "Error responses the API can return."
          x-netmera-verified: '2026-11-06'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2009_invalidJson:
                  summary: "Malformed JSON, body not an array, empty array, or every entry invalid (missing extId+deviceToken, type mismatch, missing mandatory attr, bad .opr). Inner messages ('Request must be array of objects', 'No profile is sent', 'Profile set error', 'All profiles got error', 'Invalid profileRegistrations block', 'Profile set block is missing') never reach the caller."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c5016_theUserWithGivenIdentifier:
                  summary: "None of the users exist. Returned only when the application is set to report unknown users; nothing is saved."
                  value:
                    code: 5016
                    error: "The user with given identifier is not found!"
                c2001_anUnexpectedErrorOccurredRetry:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                postWithEmptyMissingBody:
                  summary: "Missing request body."
                  value:
                    type: "about:blank"
                    title: "Bad Request"
                    status: 400


  /rest/3.0/unsetProfileAttributes:
    post:
      operationId: unsetProfileAttributes
      tags: [Profile Attributes]
      summary: Unset Profile Attributes
      description: |
        Removes attribute keys from a user's profile. Each array entry pairs an `extId` with the attribute
        keys to remove. To delete keys for all users at once, use `deleteProfileAttributes`.

        <details>

        <summary>Notes</summary>

        - An empty `profile` list removes nothing.
        - A missing `profile` list is not rejected: the call returns 200 and removes nothing.
        - A `profile` value that is not a list makes that entry invalid. The request fails only if every
