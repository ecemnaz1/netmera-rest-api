components:
  securitySchemes:
    REST-API-key:
      type: apiKey
      in: header
      name: X-netmera-api-key
      description: |
        REST API key. Available in the Netmera Panel under Developers > API.

  responses:
    InvalidApiKey:
      x-netmera-verified: '2026-11-01'
      description: |
        The `X-netmera-api-key` header is missing or the key is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetmeraError'
          example:
            code: 2010
            error: API key is invalid
    IpNotAllowed:
      description: |
        The application restricts REST calls to a list of allowed IP addresses and the caller's
        IP is not on it. The check runs after the API key is validated and before the request
        body and parameters are validated, so a restricted application returns this error even
        for a malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetmeraError'
          example:
            code: 2021
            error: Your IP is not allowed
      x-netmera-verified: '2026-10-27'

  schemas:
    NetmeraError:
      type: object
      description: Standard Netmera error body.
      required: [code, error]
      properties:
        code:
          type: integer
          description: Netmera error code. See the error table in the API description.
        error:
          type: string
          description: Human readable error message.
    ProblemDetail:
      type: object
      description: |
        RFC 7807 error body returned by the framework instead of the Netmera error body when a
        required query parameter is missing or a parameter cannot be converted to its type.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
        instance:
          type: string
    DeviceTokenEntry:
      type: object
      description: |
        One installation returned by `getDeviceTokens`. `deviceToken` is present only when the
        installation has a non-blank push token.
      properties:
        extId:
          type: string
          description: External ID of the user. Omitted for installations that have no external ID.
        installationId:
          type: string
        platform:
          type: string
        deviceToken:
          type: string
          description: Push token of the installation. Omitted when the installation has no token.
    CategoryPreferencesResponse:
      type: object
      description: |
        Category opt-in state for a single user.
      properties:
        categoryPreferences:
          type: object
          description: |
            Map of category name to opt-in state, kept for backward compatibility: `true` when the user is
            permitted on any of the category's own channels. The `channels` filter does not affect this
            value.
          additionalProperties:
            type: boolean
        categoryChannelPreferences:
          type: object
          description: |
            Per-channel permission state, keyed by category name and then by channel.
          additionalProperties:
            type: object
            additionalProperties:
              type: boolean

    Platform:
      type: string
      description: |
        Target platform, for example `IOS`, `ANDROID`, `CHROME`, `FIREFOX`, `SAFARI`, `EDGE`,
        `OPERA`, `YANDEX`, `MACOS`, `EMAIL` or `SMS`. Push statistics responses also report `WP`.
      examples: [IOS, ANDROID, CHROME]

    ClickAction:
      type: object
      description: |
        Click behavior of the notification: `url` opens a web page in the default browser, and `deeplink`
        opens the app through a registered, correctly configured deeplink URI (both iOS and Android).
        `doNothing` (Android only) turns off automatic click handling, so the app must implement a custom
        click handler.
      properties:
        url:
          type: string
          description: Web page opened in the device's default browser.
        deeplink:
          type: string
          description: Registered deeplink URI that launches the app.
        doNothing:
          type: boolean
          description: Android only. No action is triggered when the user taps the notification.
        deeplinkCustomMapParams:
          type: object
          description: |
            Custom parameters applied with `deeplink`, accepted by `sendNotification` and
            `createNotificationDefinition`; in `sendNotification` each entry's `queryMaps` holds at most
            1000 entries (otherwise HTTP 400, code `2004`). `sendBulkNotification` rejects it with HTTP 400,
            code `2009`.
          additionalProperties: true
      additionalProperties: true

    CarouselItemClickAction:
      type: object
      description: Click action of a carousel or slider item.
      properties:
        action:
          type: string
          description: Action type, for example DEEP_LINK.
        url:
          type: string
        deeplinkType:
          type: string
          description: Deeplink type, for example URL.
        deepLinkUrl:
          type: string
      additionalProperties: true

    CarouselItem:
      type: object
      description: One item of a carousel push.
      properties:
        title:
          type: string
        content:
          type: string
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true

    SliderItem:
      type: object
      description: One item of a slider push.
      properties:
        itemImageUrl:
          type: string
        clickAction:
          $ref: '#/components/schemas/CarouselItemClickAction'
      additionalProperties: true

    IosOptions:
      type: object
      description: Optional parameters specific to iOS.
      properties:
        title:
          type: string
          description: Title of the push notification on iOS.
        subtitle:
          type: string
        sound:
          type: string
          description: |
            Name of a sound defined in the panel under Developers > Sounds, per platform.
        badge:
          type: boolean
          description: Badge display. Badges are enabled only for iOS.
        mediaUrl:
          type: string
          description: Rich media URL. On iOS an image, sound or video may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of iOS users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
        icon:
          type: string
          description: |
            Name of the notification icon on iOS.
      additionalProperties: true

    AndroidOptions:
      type: object
      description: Optional parameters specific to Android.
      properties:
        title:
          type: string
          description: Title of the push notification on Android.
        subtitle:
          type: string
        sound:
          type: string
          description: |
            Name of a sound defined in the panel under Developers > Sounds, per platform.
        vibration:
          type: boolean
          description: |
            Android only. Enables or disables vibration when a device receives the push
            notification.
        bigText:
          type: string
        mediaUrl:
          type: string
          description: Rich media URL. On Android an image may be used.
        thumbnailUrl:
          type: string
        limit:
          type: integer
          description: Maximum number of Android users the notification is sent to.
        click:
          $ref: '#/components/schemas/ClickAction'
        carousel:
          type: array
          items:
            $ref: '#/components/schemas/CarouselItem'
        slider:
          type: array
          items:
            $ref: '#/components/schemas/SliderItem'
        channelName:
          type: string
          description: |
            Name of an existing Android notification channel of the app; when set, `sound` and `soundUrl`
            are ignored. Accepted by `sendBulkNotification` and `sendNotification`.
        soundUrl:
          type: string
          description: |
            URL of a custom notification sound. Used only when `sound` is empty.
        icon:
          type: string
          description: |
            Name of the small notification icon. As a per-call override in `sendNotification` it is
            not applied.
        iconDark:
          type: string
          description: |
            Name of the small notification icon used in dark mode. As a per-call override in
            `sendNotification` it is not applied.
      additionalProperties: true

    SetAttrOrTagEntry:
      type: object
      description: |
        Profile attribute or tag set when a button is clicked. The button click action must be
        set to "Open App"; the operation is triggered after the push open event inside the
        application module.
      properties:
        setOnClick:
          type: string
          description: |
            `PROFILE_ATTR` for the profile attribute flow.
        attrName:
          type: string
          description: Profile attribute name.
        attrValue:
          type: string
          description: Profile attribute value.
        tagName:
          type: string
          description: Tag name applied on click.
      additionalProperties: true

    ButtonSet:
      type: object
      description: |
        Button set attached to the notification, created first in the panel under **Settings > Button
        Sets**; the button name itself is not mandatory. Each additional key is a button name mapped to its
        action URL (`$buttonSetName: $actionUrl`).
      properties:
        id:
          type: integer
          description: |
            Button set ID, visible in the panel under Settings > Button Sets.
        buttonNames:
          type: object
          description: |
            Renames buttons by mapping each old button name to a new one. If this field is
            omitted, notifications are sent with the existing button names.
          additionalProperties:
            type: string
        setAttrOrTag:
          type: object
          description: |
            Maps a button name to the profile attribute or tag set when that button is clicked.
          additionalProperties:
            $ref: '#/components/schemas/SetAttrOrTagEntry'
      additionalProperties: true

    TargetOperatorList:
      description: |
        A single value, an array of values (OR), or an operator object using `$or`, `$and` or
        `$not`.
      oneOf:
        - type: string
        - type: array
          items:
            type: string
        - type: object
          properties:
            $or:
              type: array
              items:
                type: string
            $and:
              type: array
              items:
                type: string
            $not:
              type: array
              items:
                type: string
          additionalProperties: true

    Location:
      type: object
      description: Geographical area used to target users based on their location.
      required: [latitude, longitude, radius]
      properties:
        latitude:
          type: number
          description: The latitude of the center point.
        longitude:
          type: number
          description: The longitude of the center point.
        radius:
          type: number
          description: |
            The radius value, in kilometers, from the center to search for users.

    Target:
      type: object
      description: |
        Recipients of the notification. It cannot be empty, so set `sendToAll` to `true` to reach all users
        of the selected platforms; profile attribute codes are listed in the panel under **Developers >
        Profile Attributes > Code**, several attributes in one `profile` object are combined with AND, and
        values of one attribute with OR.
      properties:
        sendToAll:
          type: boolean
          description: |
            When true, the notification is dispatched to all users selected for the specified
            platforms.
        tag:
          $ref: '#/components/schemas/TargetOperatorList'
        segment:
          $ref: '#/components/schemas/TargetOperatorList'
        profile:
          type: object
          description: |
            Profile attribute conditions: each key is a profile attribute code and each value a single
            value, an array of values, or an operator object such as `{"$exists": true}`. The operators
            `$or` and `$and` can also wrap a group of attribute conditions.
          additionalProperties: true
        pa:
          type: object
          description: |
            Profile attribute targeting used by `sendNotification`. Each key is a profile
            attribute code and each value a single value or an array of values (OR).
          additionalProperties: true
        location:
          $ref: '#/components/schemas/Location'
        extId:
          description: |
            External ID of the target user, or an array of external IDs.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        deviceToken:
          description: |
            Device token of the target device, or an array of device tokens.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        email:
          type: string
          description: Target email address.
        msisdn:
          type: string
          description: Target phone number.
        wpNumber:
          description: |
            WhatsApp number in E.164 format (for example `+90xxxxxxxxxx`) or an array of numbers, used by
            `sendNotification` and `sendEmailAndSms`; an invalid number returns HTTP 400, code `2009`, and
            `sendEmailAndSms` creates a user when no user has the number. Only one identifier type is used
            per request; when several are sent, the first in this order wins: `extId`, `deviceToken`,
            `msisdn`, `email`, `wpNumber`, `iid`, `pa`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        iid:
          description: |
            Installation ID of the target device, or an array of installation IDs, used by
            `sendNotification` and `sendEmailAndSms`. Only one identifier type is used per request; when
            several are sent, the first in this order wins: `extId`, `deviceToken`, `msisdn`, `email`,
            `wpNumber`, `iid`, `pa`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      additionalProperties: true

    Schedule:
      type: object
      description: Future delivery date and time of the message.
      properties:
        startTime:
          type: string
          description: Date and time when the message should be delivered.
          examples: ["2024-02-01T15:30:00"]
        localTimezone:
          type: boolean
        sendIfBestTimeExceed:
          type: boolean
          default: false
          description: |
            Best-time delivery option: whether the message is still sent when the user's best
            delivery time has already passed. Defaults to `false`.

    Speed:
      type: object
      description: Rate at which the notifications are sent, in chunks or packages.
      properties:
        intervalMins:
          type: integer
        packageSize:
          type: integer

    Hook:
      type: object
      description: |
        Optional hook parameters. If no hook is to be attached, exclude the hook block from the
        request.
      properties:
        name:
          type: string
          description: |
            Name of an existing hook, required when `hook` is sent. For `sendBulkNotification` the hook must
            be defined for push messages.
        params:
          type: object
          description: |
            Hook parameters. For `sendBulkNotification` it must contain every required push
            parameter of the hook and no keys the hook does not define.
          additionalProperties: true

    BulkMessage:
      type: object
      description: Content and delivery options of a bulk notification.
      required: [title, platforms, text]
      properties:
        title:
          type: string
          description: |
            Campaign name, used to identify the notification in the panel.
        platforms:
          type: array
          description: Platforms the push notification is delivered to.
          items:
            $ref: '#/components/schemas/Platform'
        text:
          type: string
          description: Push notification text shown to the user.
        personalizedTitle:
          type: string
          description: |
            The web push title is set to `personalizedTitle` when the referenced profile attribute exists
            for the user. If the attribute is not set on the user, the notification is not sent.
        personalizedMessage:
          type: string
          description: |
            Personalized message with `@{attribute}` placeholders. Users who have the referenced
            profile attributes receive the personalized text; users missing any of them receive
            the default `text`.
        categories:
          description: |
            Message categories defined in the panel under **Settings > Message Categories**, as a single
            value or an array. Matched by name, exactly (case-sensitive); numeric category IDs do not work
            here.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        threadId:
          type: string
          description: |
            ID that groups notifications in the notification center: notifications sharing a `threadId` are
            grouped together. Supported on iOS and Android.
        customJson:
          type: object
          description: |
            Additional custom parameters, available on the device when the push notification is
            received. `refID` inside this object references a previously sent notification key
            for an Android live push update.
          additionalProperties: true
        params:
          type: object
          description: |
            Message parameters.
          additionalProperties: true
        click:
          $ref: '#/components/schemas/ClickAction'
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        iconUrl:
          type: string
          description: |
            Icon URL of the notification. Required if the platforms include Chrome or Firefox.
        wpChromeImage:
          type: string
          description: |
            For Windows Chrome and Firefox users, the URL of the image shown in the notification. Must begin
            with `https`.
        interactionRequired:
          type: boolean
          description: |
            Whether the notification stays until the user clicks or dismisses it. Defaults to false.
        limit:
          type: integer
          description: |
            Maximum number of users the notification is sent to, chosen at random: with 1 million users and
            a limit of 100,000, 100,000 users receive it. Per-platform limits can be set in the `ios` and
            `android` blocks.
        ttl:
          type: string
          description: |
            Time to live: a device that does not receive the notification within this period never receives
            it. For example `15d` is 15 days, `20h` 20 hours and `30m` 30 minutes.
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        doNotNotify:
          type: boolean
          description: Whether to show the push notification in the notification center.
        labels:
          description: |
            Label information added to the message. The label appears in the push report
            generated on the panel.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        personalizedSubText:
          type: string
          description: |
            Personalized subtext with `@{attribute}` placeholders. Applied to push and interactive
            push messages.
        context:
          type: object
          description: |
            Context values passed to the hook attached to the message.
          additionalProperties: true
        priority:
          type: integer
          description: |
            Delivery priority of a live activity message, as a JSON integer. Used only when `type` is
            `LIVE_ACTIVITY`.
        contentState:
          type: object
          description: |
            Dynamic content state of the live activity. Used only when `type` is `LIVE_ACTIVITY`.
          additionalProperties: true
        liveActAttr:
          type: object
          description: |
            Static attributes of the live activity. Used only when `type` is `LIVE_ACTIVITY`.
          additionalProperties: true
        liveActAttrType:
          type: string
          description: |
            Attribute type of the live activity as defined in the app. Required when `type` is
            `LIVE_ACTIVITY` (otherwise HTTP 400, code `2020`).
        groupId:
          type: string
          description: |
            Group identifier of the live activity; later updates through `update-live-activity`
            reference the same value. Required and must not be empty when `type` is `LIVE_ACTIVITY`.
        liveActEndDate:
          type: string
          format: date-time
          description: |
            End date of the live activity as an ISO-8601 instant, for example `2030-01-01T10:00:00Z`; used
            only when `type` is `LIVE_ACTIVITY`. Must be in the future (otherwise HTTP 400, code `2009`); an
            unparseable value returns HTTP 400, code `2001`.
      additionalProperties: true

    BulkNotificationRequest:
      type: object
      description: Bulk notification request.
      properties:
        message:
          $ref: '#/components/schemas/BulkMessage'
        target:
          $ref: '#/components/schemas/Target'
        languages:
          type: object
          additionalProperties:
            type: object
            properties:
              title:
                type: string
              text:
                type: string
              click:
                $ref: '#/components/schemas/ClickAction'
            additionalProperties: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        speed:
          $ref: '#/components/schemas/Speed'
        extRef:
          type: string
          description: |
            Your own identifier for the push notification. Assign any ID and use it in later queries.
        type:
          type: string
          enum: [PUSH, INTERACTIVE_PUSH, POPUP, IN_APP_MESSAGE, SILENT_PUSH, WEB_PUSH, LIVE_ACTIVITY, WHATS_APP]
          default: PUSH
          description: |
            Message type, case-insensitive: defaults to `PUSH`, or `WEB_PUSH` when `message.platforms`
            contains a web platform, becomes `INTERACTIVE_PUSH` when `message.buttonSet` is sent without a
            web platform, and is ignored when `silent` is `true`. Any other value returns HTTP 400, code
            `2004`.
        silent:
          type: boolean
          default: false
          description: |
            When `true`, the message is sent as a silent push. Must be a JSON boolean.
        dataOnly:
          type: boolean
          default: false
          description: |
            When `true`, the message type is kept but iOS receives a background (content-available
            only) payload. Must be a JSON boolean.
        lastActiveDevice:
          type: boolean
          default: false
          description: |
            When `true`, only the last active device of each user is targeted. Must be a JSON
            boolean.
        hook:
          $ref: '#/components/schemas/Hook'
          description: |
            Hook attached to the message, sent at the top level of the body next to `message`. A `hook`
            object inside `message` is ignored by this endpoint.

    TransactionalMessage:
      type: object
      description: Per-call overrides of a transactional notification definition.
      properties:
        params:
          type: object
          description: |
            Custom parameters that personalize the notification: a message "Hello @{name}" with a `name`
            parameter becomes "Hello John" or "Hello Mary". A request value overwrites the parameter
            configured in the panel.
          additionalProperties: true
        click:
          $ref: '#/components/schemas/ClickAction'
        customJson:
          type: object
          description: Custom parameters available on the device when the push is received.
          additionalProperties: true
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        ttl:
          type: string
          description: |
            Time to live of the notification. For example `15d` is 15 days, `20h` 20 hours and `30m` 30
            minutes.
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        doNotNotify:
          type: boolean
          description: Whether to show the push notification in the notification center.
        context:
          type: object
          description: |
            Context values forwarded with the send request.
          additionalProperties: true
        groupId:
          type: string
          description: |
            Group identifier of the live activity. Required when the notification definition is a
            live activity (otherwise HTTP 400, code `2009`).
        liveActEndDate:
          type: string
          format: date-time
          description: |
            End date of the live activity as an ISO-8601 instant, for example
            `2030-01-01T10:00:00Z`. Must be in the future (otherwise HTTP 400, code `2009`); an
            unparseable value returns HTTP 400 with code `2001`.
      additionalProperties: true

    SendNotificationRequest:
      type: object
      description: A single transactional notification send request.
      required: [target]
      properties:
        notificationKey:
          type: string
          description: |
            Key of the notification definition, created in the panel or returned by
            `createNotificationDefinition`; required unless `extRef` is sent. Must be a JSON string (for
            example `"106"`): a JSON number returns HTTP 400, code `2004` ("Field 'notificationKey' should
            be a text").
        target:
          $ref: '#/components/schemas/Target'
        message:
          $ref: '#/components/schemas/TransactionalMessage'
        lastActiveDevice:
          type: boolean
          description: |
            `true` sends only to the user's last active device; `false` sends to all devices.
        extRef:
          type: string
          description: |
            External reference of an existing message, as an alternative to `notificationKey`. Used
            only when `notificationKey` is empty; it must match the `extRef` of an existing message
            (otherwise HTTP 400, code `2004`).
        labels:
          description: |
            Labels of the notification, read only when a `message` object is also sent. When
            `notificationKey` is `custom-label` (case-insensitive), a notification definition is found or
            created by these labels.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      additionalProperties: true

    NotificationDefinitionRequest:
      type: object
      description: Transactional notification definition.
      properties:
        title:
          type: string
          description: |
            Campaign name. Inside the iOS and Android blocks, `title` sets the notification title shown on
            that platform.
        message:
          description: |
            Default push notification text, sent to users when no personalized message is used.
          type: string
        text:
          type: string
          description: |
            Not read by the server. The push text is taken from `message`.
        personalizedMessage:
          type: string
          description: |
            Personalized message with `@{xxxx}` placeholders, filled from profile attributes or from values
            sent in a transactional message call.
        personalizedTitle:
          type: string
          description: Personalized title using a placeholder.
        personalizedSubText:
          type: string
          description: Personalized subtext using a placeholder.
        inbox:
          type: boolean
          description: Whether to display the push notification in the inbox.
        platforms:
          type: array
          description: Platforms that can receive this notification.
          items:
            $ref: '#/components/schemas/Platform'
        categories:
          description: |
            Message categories. Either the category ID shown in the panel under
            **Settings > Message Categories** or the category name may be used, so values can be
            strings or integers.
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: integer
        labels:
          description: |
            Label information added to the message. The label appears in the push report
            generated on the panel.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        threadId:
          type: string
          description: ID used to group notifications in the notification center.
        click:
          $ref: '#/components/schemas/ClickAction'
        buttonSet:
          $ref: '#/components/schemas/ButtonSet'
        ios:
          $ref: '#/components/schemas/IosOptions'
        android:
          $ref: '#/components/schemas/AndroidOptions'
        hook:
          $ref: '#/components/schemas/Hook'
        sendIfParamIsNull:
          type: boolean
          default: false
          description: |
            When `true`, users missing a personalization parameter still receive the default
            (non-personalized) title and message; applies to push, interactive push, web push and SMS.
            Defaults to `false`.
        from:
          type: string
          description: |
            Sender email address, also used as the sender name. Its presence makes the definition an
            email definition (unless `buttonSet` is sent).
        subject:
          type: string
          description: |
            Email subject line of an email definition.
        emailIysMessageType:
          type: string
          enum: ["N", NOTIFICATION, "C", CAMPAIGN, CAMPAIGN_ADVERTISEMENT]
          description: |
            IYS message type of an email definition, case-insensitive: `N` or `NOTIFICATION` for
            Notification, `C` or `CAMPAIGN` for Campaign, or `CAMPAIGN_ADVERTISEMENT`. An invalid value
            returns HTTP 400, code `2004`; when omitted, no IYS message type is stored on the definition.
        smsHeader:
          type: string
          description: |
            SMS header. Its presence makes the definition an SMS definition, unless `buttonSet` or
            `from` is also sent.
        smsIysMessageType:
          type: string
          enum: ["N", "C", NOTIFICATION, CAMPAIGN]
          description: |
            `"N"` (or `NOTIFICATION`) for Notification, `"C"` (or `CAMPAIGN`) for Campaign; case-sensitive.
            Required only when the application's SMS provider requires IYS fields; otherwise defaults to
            Campaign.
        smsIysRecipientType:
          type: string
          enum: ["B", "T"]
          description: |
            `"B"` for Personal, `"T"` for Trader; case-sensitive. Required when the application's SMS
            provider requires IYS fields and ignored otherwise; an invalid value returns HTTP 400, code
            `2001`.
        contentState:
          type: object
          description: |
            Dynamic content state of a live activity. Its presence (without `buttonSet`, `from`,
            `smsHeader` or a web platform) makes the definition a live activity definition.
          additionalProperties: true
        liveActAttr:
          type: object
          description: |
            Static attributes of the live activity. Live activity definitions only.
          additionalProperties: true
        liveActAttrType:
          type: string
          description: |
            Attribute type of the live activity as defined in the app. Required for live activity
            definitions (otherwise HTTP 400, code `2020`).
        priority:
          type: integer
          description: |
            Delivery priority of the live activity, as a JSON integer. Live activity definitions only.
      additionalProperties: true

    EmailSmsRequest:
      type: object
      description: Email or SMS message sent with its content included in the request.
      properties:
        target:
          $ref: '#/components/schemas/Target'
        platforms:
          type: array
          description: '`["EMAIL"]` for email, `["SMS"]` for SMS.'
          items:
            $ref: '#/components/schemas/Platform'
        title:
          type: string
          description: Campaign name.
        message:
          type: string
          description: |
            Message body. For email this is the HTML content; for SMS the plain text.
        from:
          type: string
          description: Sender email address.
        senderName:
          type: string
          description: |
            Not read by the server: the sender name is always set to the value of `from`.
        subject:
          type: string
          description: Email subject line.
        smsHeader:
          type: string
          description: SMS header.
        smsIysMessageType:
          type: string
          enum: ["N", "C", NOTIFICATION, CAMPAIGN]
          description: |
            `"N"` (or `NOTIFICATION`) for Notification, `"C"` (or `CAMPAIGN`) for Campaign; case-sensitive.
            Required only when the application's SMS provider requires IYS fields; otherwise defaults to
            Campaign.
        smsIysRecipientType:
          type: string
          enum: ["B", "T"]
          description: |
            `"B"` for Personal, `"T"` for Trader; case-sensitive. Required when the application's SMS
            provider requires IYS fields and ignored otherwise; an invalid value returns HTTP 400, code
            `2001`.
        personalizedTitle:
          type: string
          description: |
            Personalized title with `@{attribute}` placeholders.
        personalizedMessage:
          type: string
          description: |
            Personalized message with `@{attribute}` placeholders.
        sendIfParamIsNull:
          type: boolean
          default: false
          description: |
            When `true`, users missing a personalization parameter still receive the default
            (non-personalized) title and message; applies to push, interactive push, web push and SMS.
            Defaults to `false`.
        categories:
          type: array
          description: |
            Message categories as a JSON array; a single string is ignored. A string item is a category name
            and an integer item a category ID, and every category must exist.
          items:
            oneOf:
              - type: string
              - type: integer
        threadId:
          type: string
          description: |
            ID used to group notifications in the notification center.
        click:
          $ref: '#/components/schemas/ClickAction'
          description: |
            Click behavior: `url` has priority over `deeplink`, which has priority over `doNothing`.
        hook:
          $ref: '#/components/schemas/Hook'
          description: |
            Hook attached to the message.
        emailIysMessageType:
          type: string
          enum: ["N", NOTIFICATION, "C", CAMPAIGN, CAMPAIGN_ADVERTISEMENT]
          description: |
            IYS message type of the email, case-insensitive: `C` or `CAMPAIGN` for Campaign (commercial
            content), `N` or `NOTIFICATION` for Notification (informational content), or
            `CAMPAIGN_ADVERTISEMENT`. An invalid value returns HTTP 400, code `2004`; when omitted, no IYS
            message type is stored.
      additionalProperties: true

    Event:
      type: object
      description: |
        A custom event. Beyond `extId` and `name`, additional event-specific attributes are
        passed as key-value pairs and must match the event schema defined in the Netmera panel.
      required: [extId]
      properties:
        extId:
          type: string
          description: Unique identifier of the user in your system.
        name:
          type: string
          description: Name of the event. Required unless `eventCode` is sent.
        eventCode:
          type: string
          description: |
            Code of an existing event definition, as an alternative to `name`. Takes precedence over
            `name` when not empty.
        msisdn:
          type: string
          description: |
            Phone number of the user, used instead of `extId` when the application uses phone numbers as
            external IDs or `extId` is empty (matched across phone number formats); a new user is created if
            none matches. The `extId` key must still be present.
        revenue:
          type: number
          description: |
            Revenue value of the event; a non-numeric value is read as 0. For purchase events it is replaced
            by the `grandTotal` attribute.
        attr:
          type: object
          description: |
            Event attributes keyed by attribute code, including every mandatory attribute of the event. When
            present, attributes sent at the top level of the event are ignored.
          additionalProperties: true
        items:
          description: |
            Line items of a purchase event, required for purchase events and events based on it; send them
            at the top level, inside `prms` or inside `attr`. A single object counts as a one-item array, a
            string must contain valid JSON, and each item is validated against the purchase line item event
            (an invalid item fails the whole request).
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
            - type: string
        prms:
          type: object
          description: |
            Wrapper object used by some client integrations for purchase events; `items` and `attr`
            are also looked up inside it.
          additionalProperties: true
      additionalProperties: true

    PushPermissionRequest:
      type: object
      anyOf:
        - required: [extId]
        - required: [deviceToken]
      description: |
        Push permission change for all devices of a user (`extId`) or one device
        (`deviceToken`).
      properties:
        extId:
          type: string
          description: External user ID.
        deviceToken:
          type: string
          description: Device token.

    TagUsersRequest:
      type: object
      required: [tag, extIds]
      properties:
        tag:
          type: string
          description: Tag name.
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string
        checkExistence:
          type: boolean
          default: false
          description: |
            When `true`, each `extId` is looked up first; IDs that match no user are skipped and
            listed in the `notExist` array of the response.

    EmailPermissionRequest:
      type: object
      anyOf:
        - required: [extIds]
        - required: [emailList]
      description: Email permission change by external user IDs or by email addresses.
      properties:
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string
        emailList:
          type: array
          description: |
            Email addresses, as an alternative to `extIds`. Every address is checked against an
            email pattern; one invalid address rejects the whole request with HTTP 400 and code
            `9109`.
          items:
            type: string

    SmsPermissionRequest:
      type: object
      anyOf:
        - required: [extIds]
        - required: [msisdnList]
      description: SMS permission change by external user IDs or by MSISDNs.
      properties:
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string
        msisdnList:
          type: array
          description: Phone numbers, as an alternative to `extIds`.
          items:
            type: string

    WhatsAppPermissionRequest:
      type: object
      description: WhatsApp permission change.
      anyOf:
        - required: [extIds]
        - required: [wpNumbers]
      properties:
        extIds:
          type: array
          description: External user IDs.
          items:
            type: string
        wpNumbers:
          type: array
          description: WhatsApp numbers.
          items:
            type: string

    Device:
      type: object
      properties:
        platform:
          type: string
        token:
          type: string
        deviceModel:
          type: string
        pushPermitted:
          type: boolean
        appVersion:
          type: string

    PlatformStats:
      type: object
      properties:
        platform:
          type: string
        sent:
          type: integer
        failed:
          type: integer
        clicked:
          type: integer

    PushStatsByKeyResponse:
      type: object
      properties:
        notificationKey:
          type: integer
        status:
          type: string
          description: 'Delivery status, for example FINISHED or SENDING.'
        startDate:
          type: integer
          format: int64
        endDate:
          type: integer
          format: int64
        stats:
          type: array
          items:
            $ref: '#/components/schemas/PlatformStats'
        message:
          type: string
          description: Message text of the notification.

    PushStatsByDateRangeResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PushStatsByKeyResponse'

    PushResultItem:
      type: object
      properties:
        platform:
          type: string
        status:
          type: string
          enum: [SUCCESS, FAILED, DELIVERED, SHOWN, CLICKED]
          description: |
            Result event; each event is a separate row, so one notification can appear several times for the
            same device. SHOWN means the email was opened.
        errorCode:
          type: string
          description: 'Delivery error code, for example GENERIC_ERR.'
        errorMsg:
          type: string
        installationId:
          type: string
        extId:
          type: string
        timeStamp:
          type: integer
          format: int64
        msgTitle:
          type: string
        msgText:
          type: string
        notificationKey:
          type: integer
      additionalProperties: true

    PushResultResponse:
      type: object
      properties:
        nextPage:
          type: string
          description: |
            URL of the next page of results. Send a request to this value to fetch the next page.
        list:
          type: array
          items:
            $ref: '#/components/schemas/PushResultItem'

    InboxRequest:
      type: object
      required: [extId, status]
      properties:
        extId:
          type: string
          description: The unique external ID of the user.
        status:
          type: integer
          minimum: 1
          maximum: 15
          description: |
            Status filter as a bitmask of 1 = Read, 2 = Unread, 4 = Deleted and 8 = Recalled; any sum from 1
            to 15 is valid, for example 3 = Read & Unread and 7 = Read, Unread & Deleted. `0` or a missing
            value returns HTTP 400, code `2020`.
        numberOfNotification:
          type: integer
          description: |
            Number of messages per page. Defaults to 20.
        prms:
          type: object
          description: Pagination block.
          properties:
            index:
              type: integer
              format: int64
              description: |
                The `pushInstanceId` of the last message received in the previous response.
        startDate:
          type: integer
          format: int64
          description: |
            Filters messages starting from this date. Epoch timestamp in milliseconds.
        endDate:
          type: integer
          format: int64
          description: |
            Filters messages until this date. Epoch timestamp in milliseconds.
        category:
          type: array
          description: |
            Category names to filter by (business-unit names when the application uses business units);
            unknown names are ignored. A value that is not an array returns HTTP 400, code `2009`.
          items:
            type: string

    InboxMessage:
      type: object
      properties:
        msgId:
          type: integer
        pushInstanceId:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        status:
          type: string
        sts:
          type: integer
          format: int64
        subText:
          type: [string, 'null']
        extID:
          type: string
        deeplink:
          type: [string, 'null']
        androidMediaUrl:
          type: [string, 'null']
        iosMediaUrl:
          type: [string, 'null']
        androidThumbnail:
          type: [string, 'null']
        personalizedMsg:
          type: [string, 'null']
        personalizedTitle:
          type: [string, 'null']
        personalizedSubText:
          type: [string, 'null']
        customParams:
          type: object
          additionalProperties: true
        ctg:
          type: array
          items:
            type: string
        lbl:
          type: array
          items:
            type: string
      additionalProperties: true

    InboxListResponse:
      type: object
      properties:
        msgs:
          type: array
          items:
            $ref: '#/components/schemas/InboxMessage'
        cnts:
          type: object
          description: |
            Message counts keyed by status value. The last page of a paginated result omits the
            `prms` block.
          additionalProperties:
            type: integer
        prms:
          type: object
          properties:
            index:
              type: integer
              format: int64
              description: |
                The `pushInstanceId` of the last message in this batch, passed as `prms.index`
                in the next request.

    InboxMessageDetail:
      type: object
      properties:
        msgId:
          type: integer
        extID:
          type: string
        pushInstanceId:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        deeplink:
          type: [string, 'null']
        androidMediaUrl:
          type: [string, 'null']
        iosMediaUrl:
          type: [string, 'null']
        androidThumbnail:
          type: [string, 'null']
        personalizedMsg:
          type: [string, 'null']
        personalizedTitle:
          type: [string, 'null']
        subText:
          type: [string, 'null']
        status:
          type: string
        customParams:
          type: object
          additionalProperties: true
        sts:
          type: integer
          format: int64
        ctg:
          type: array
          description: Categories.
          items: {}
        lbl:
          type: array
          description: Labels.
          items: {}
        personalizedSubText:
          type: [string, 'null']
      additionalProperties: true

    AttributeDefinition:
      type: object
      description: |
        Definition of a profile or event attribute. Fields that have no value are omitted.
      properties:
        code:
          type: string
          description: |
            Attribute code. Use it as the key in `profile` objects of the profile attribute
            endpoints.
        dataType:
          type: string
          description: |
            Value type, for example `STRING`, `INT`, `LONG`, `DOUBLE`, `BOOLEAN`, `DATE` or
            `TIME_STAMP`.
        name:
          type: string
          description: Display name as defined in the panel.
        label:
          type: string
          description: Display label as defined in the panel.
        description:
          type: string
          description: Description as defined in the panel.
        locked:
          type: boolean
          description: "`true` for built-in attributes that cannot be edited."
        array:
          type: boolean
          description: |
            `true` when the attribute holds a list of values (see `pushProfileAttributes` and
            `pullProfileAttributes`).
        privateInfo:
          type: boolean
          description: "`true` when the attribute is marked as private information."
        mandatory:
          type: boolean
          description: Whether the attribute is marked mandatory.
        recommRequired:
          type: boolean
        calculated:
          type: boolean
        order:
          type: integer
        options:
          type: array
          description: Allowed values for attributes that have a fixed option list.
          items: {}
        unit:
          type: string
          description: Unit of measurement, when defined.
        createDate:
          type: integer
          format: int64
          description: Epoch timestamp in milliseconds.
        updateDate:
          type: integer
          format: int64
          description: Epoch timestamp in milliseconds.
        numeric:
          type: boolean
      additionalProperties: true

    EventDefinition:
      type: object
      description: |
        Definition of a standard or custom event. Fields that have no value are omitted.
      properties:
        code:
          type: string
          description: Event code used when firing the event through `fireEvents`.
        eventName:
          type: string
          description: Display name as defined in the panel.
        label:
          type: string
          description: Display label as defined in the panel.
        eventDescription:
          type: string
          description: Description as defined in the panel.
        baseEventCode:
          type: string
          description: Code of the base event this event extends, when it has one.
        standardEvent:
          type: boolean
          description: "`true` for built-in events, `false` for custom events."
        appCategoryId:
          description: Application category the built-in event belongs to, when applicable.
        attributeDefinitions:
          type: array
          description: |
            Attributes defined directly on this event. Each entry has the same shape as a
            profile attribute definition.
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        inheritedAttributes:
          type: array
          description: Attributes inherited from the base event chain.
          items:
            $ref: '#/components/schemas/AttributeDefinition'
      additionalProperties: true

    DailyPlatformStats:
      type: "object"
      description: "Per-platform device counts for one day."
      properties:
        userStat:
          type: "integer"
        optOutUserStat:
          type: "integer"
        androidStat:
          type: "integer"
        iosStat:
          type: "integer"
        chromeStat:
          type: "integer"
        macosStat:
          type: "integer"
        firefoxStat:
          type: "integer"
        operaStat:
          type: "integer"
        edgeStat:
          type: "integer"
        yandexStat:
          type: "integer"
        webothStat:
          type: "integer"
        smsStat:
          type: "integer"
        emailStat:
          type: "integer"
        whatsAppStat:
          type: "integer"
        restStat:
          type: "integer"
        totalStat:
          type: "integer"
          description: |
            Total across all platforms. When the stored value is 0 or less, it is the sum of the platform
            values.
        mobileTotal:
          type: "integer"
        sumOfStatsOfWebPlatforms:
          type: "integer"
        sumOfOtherBrowsers:
          type: "integer"

    SegmentRequest:
      type: object
      description: |
        Segment definition used by `createSegment` and `updateSegment`, the same body the panel sends when
        it saves a segment. Send at least one condition, as separate condition objects (`profile`, `tags`,
        `behaviors`, `response`, `pushEnabled`) or as a condition tree in `targetJson`.
      required: [segment]
      properties:
        segment:
          type: object
          required: [segmentName]
          properties:
            segmentName:
              type: string
              description: Segment name. Must be unique in the application.
            segmentId:
              type: integer
              description: ID of the segment to update. Required by `updateSegment` only.
            segmentDescription:
              type: string
              description: Segment description.
            tagConditionType:
              type: string
              description: |
                `AND` or `OR`. How the tag condition joins the conditions before it.
            profileConditionType:
              type: string
              description: |
                `AND` or `OR`. How the profile condition joins the conditions before it.
            responseConditionType:
              type: string
              description: |
                `AND` or `OR`. How the campaign response condition joins the conditions before
                it.
            behaviorConditionType:
              type: string
              description: |
                `AND` or `OR`. How the behavior condition joins the conditions before it.
        profile:
          type: object
          description: |
            Profile attribute condition; `expression.code` is the attribute code listed in the panel under
            **Developers > Profile Attributes > Code**. The examples use the `CONTAINS` operator.
          properties:
            type:
              type: string
              description: '`PROFILE`.'
            logic:
              type: string
              description: '`AND` or `OR`.'
            expression:
              type: object
              properties:
                code:
                  type: string
                operator:
                  type: string
                values:
                  type: array
                  items:
                    type: string
          additionalProperties: true
        tags:
          type: object
          description: Tag condition. `code` is the ID of the tag.
          properties:
            type:
              type: string
              description: '`TAG`.'
            logic:
              type: string
              description: '`AND` or `OR`.'
            code:
              type: string
          additionalProperties: true
        behaviors:
          type: object
          description: Behavior condition.
          additionalProperties: true
        behaviorAggregations:
          type: object
          description: Aggregated behavior condition.
          additionalProperties: true
        response:
          type: object
          description: Campaign response condition.
          additionalProperties: true
        pushEnabled:
          description: Push permission condition.
        targetJson:
          type: object
          description: |
            Condition tree of the panel, for segments that combine conditions with `AND` and `OR`. A group
            has `type` `GROUP`, a `logic` that joins its `conditions`, and each condition is a channel
            permission (`CHANNEL`), a profile attribute (`PROFILE`) or a nested group.
          properties:
            id:
              type: string
            type:
              type: string
            logic:
              type: string
            conditions:
              type: array
              items:
                type: object
                additionalProperties: true
          additionalProperties: true
        group:
          type: object
          description: Condition tree in the format of the earlier panel.
          additionalProperties: true
        timeZone:
          type: string
          description: |
            IANA time zone, for example `Europe/Istanbul`, used for relative dates in behavior
            conditions such as "today" or "last 7 days". When it is not sent, the time zone of
            the application is used.

    SegmentResponse:
      type: object
      required: [id, name, status, segmentStatus]
      properties:
        id:
          type: integer
          description: Segment ID.
        name:
          type: string
          description: Segment name.
        status:
          type: string
          description: '`ACTIVE` or `DELETED`.'
        segmentStatus:
          type: string
          description: |
            Calculation status. `WAITING_CALCULATE` while the segment is calculated, `READY`
            when it can be used as a target, `WAITING_DELETED` after a delete.
        userCount:
          type: [integer, 'null']
          description: |
            Number of users in the segment. `null` until the first calculation finishes.
        createdBy:
          type: [string, 'null']
          description: '`REST` for segments created through the REST API.'
