  /rest/3.0/sendEmailWithAttachment:
    post:
      operationId: sendEmailWithAttachment
      tags: [Email and SMS]
      summary: Send Email with Attachment
      description: |
        Sends an email with one or more file attachments, using an email notification key created in the
        panel. Submit the request as `multipart/form-data`.

        ### How it works

        Send the recipient in `to`, the definition in `notificationKey` and each file as a `mailAttachment`
        part. Any other form field fills a template placeholder: the field name is the placeholder and the
        field value its value.

        <details>

        <summary>Notes</summary>

        - Each attachment file can be at most **1 MB**.
        - The email, including its attachments, must not exceed **10 MB**.
        - A larger attachment or request is rejected before it is processed, with HTTP 413 and an RFC 7807
          body (`"detail": "Maximum upload size exceeded"`).
        - The file type is detected from the file content, not from the file name.
        - Supported file types:
          - **Images** — `image/png`, `image/x-png`, `image/x-citrix-png`, `image/gif`, `image/jpeg`,
            `image/x-citrix-jpeg`.
          - **Video** — `video/x-msvideo`, `video/mp4`, `video/mpeg`, `video/mpeg2`, `video/x-mpeg`.
          - **Text and spreadsheets** — `text/plain`, `text/csv`, `application/vnd.ms-excel`,
            `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`.
          - **Extensions** — `xlsx`, `xls`, `csv`, `txt`, `pdf`, `jpg`, `jpeg`, `png`, `gif`, `mpeg`,
            `mpeg-2`, `mp4`, `avi`.
        - A request without `notificationKey` returns HTTP 400, code `2001`.
        - A request without `to` is rejected. A request with an unknown `notificationKey` and an invalid
          `to` returns 200 with an empty JSON object.
        - When `to` is a valid address that belongs to no user, the response is 200 with
          `{"notExist": "<address>"}`.

        </details>
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                mailAttachment:
                  type: string
                  format: binary
                  description: The file to attach, at most 1 MB. More than one attachment may be added.
                to:
                  type: string
                  description: Recipient email address.
                  example: example@netmera.com
                notificationKey:
                  type: string
                  description: Notification key of the email definition created in the panel.
                  example: "1000"
              additionalProperties:
                type: string
                description: |
                  Any other form field is passed to the email as a template parameter: the field
                  name is the placeholder and the field value its value.
      responses:
        '200':
          description: The email was accepted for delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notExist:
                    type: string
                    description: Returned when no user has the `to` address; holds that address.
              examples:
                accepted:
                  summary: Recipient belongs to a user
                  value: {}
                noUser:
                  summary: "No user has the recipient address."
                  value:
                    notExist: user@example.com
          x-netmera-verified: '2026-11-01'
        '400':
          description: "Missing recipient."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                missingTo:
                  summary: "`to` is not sent."
                  value:
                    code: 2009
                    error: "Please set to parameter to the request"
                c5022_serviceUsageQuotaIsExceeded_code:
                  summary: "The request quota configured for this endpoint is exceeded."
                  value:
                    code: 5022
                    error: "Service usage quota is exceeded!"
                c2001_anUnexpectedErrorOccurredRetry_code:
                  summary: "Unexpected error while processing the request."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
                c2003_fileTypeIsNotAccepted_code:
                  summary: "The attachment's file type is not accepted."
                  value:
                    code: 2003
                    error: "File type is not accepted"
                c2003_invalidFile_code:
                  summary: "The attachment is empty."
                  value:
                    code: 2003
                    error: "Invalid file!"
                c2029_anErrorOccurredWhileParsing_code:
                  summary: "The attachment could not be read."
                  value:
                    code: 2029
                    error: "An error occurred while parsing data!"
                c2004_notificationContentContainsForbiddenWord_code:
                  summary: "The notification definition contains a forbidden word."
                  value:
                    code: 2004
                    error: "Notification content contains forbidden word: <word>"
          x-netmera-verified: '2026-10-27'
        '401':
          description: "Error responses the API can return."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                c2010_apiKeyCannotBeNull:
                  summary: "The `X-netmera-api-key` header is missing or empty."
                  value:
                    code: 2010
                    error: "Api key cannot be null or empty"
                c2010_apiKeyIsInvalid:
                  summary: "The `X-netmera-api-key` header is not a valid API key."
                  value:
