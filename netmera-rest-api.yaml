  /rest/3.0/getSegmentUsers:
    get:
      operationId: getSegmentUsers
      tags: [Segments and Targeting]
      summary: List Segment Users
      description: |
        Returns the users in a segment, one page at a time. Pass the segment ID in the `id` query parameter.

        ### How it works

        Set the page size with `max`: at least and by default 100, at most 1000. When more users are
        available, the response carries a `nextPage` URL whose `offset` is an opaque token. Call that URL to
        fetch the next page.

        <details>

        <summary>Notes</summary>

        - Works for `STANDARD` segments.
        - For `CONNECTORS_SEGMENT` segments (created by connector integrations such as Mixpanel), the call
          returns HTTP 400, code `2001`, "An unexpected error occurred. Retry later.".
        - The `X-netmera-os` header is not read by the server and has no effect.

        </details>
      parameters:
        - name: id
          in: query
          required: true
          description: Segment ID (integer). An unknown ID returns HTTP 400 with code `5042`.
          schema:
            type: integer
          example: 5883
        - name: X-netmera-os
          in: header
          required: false
          description: |
            Platform header (IOS or ANDROID). Not read by the server for this endpoint (only
            logged); it can be omitted.
          schema:
            type: string
          example: IOS
        - name: max
          in: query
          required: false
          description: |
            Page size: default and minimum 100, at most 1000. A value above 1000 returns HTTP 400, code
            `2009`.
          schema:
            type: integer
            default: 100
            maximum: 1000
          example: 100
        - name: offset
          in: query
          required: false
          description: |
            Opaque paging token taken from the `nextPage` URL of the previous response. Do not
            build it yourself; an invalid token returns HTTP 400 with code `2001`.
          schema:
            type: string
      responses:
        '200':
          x-netmera-verified: '2026-11-01'
          description: The users in the segment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: Segment name.
                  nextPage:
                    type: string
                    description: |
                      URL of the next page, present only when more users may be available.
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        externalId:
                          type: string
                        msisdn:
                          type: string
                        email:
                          type: string
              example:
                name: brand
                list:
                  - externalId: user_123
                    msisdn: "905000000000"
                    email: user@example.com
        '400':
          x-netmera-verified: '2026-11-01'
          description: "Unknown segment, unsupported segment type or missing id."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                segmentNotFound:
                  summary: "No segment exists with the given ID."
                  value:
                    code: 5042
                    error: "Segment not found with given id!"
                unsupportedSegmentType:
                  summary: "The segment type is not supported, for example segments created by connector integrations."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
                c2009_maxItemPerPageCannot_code:
                  summary: "`max` is greater than 1000."
                  value:
                    code: 2009
                    error: "Max item per page cannot be greater than 1000"
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Required parameter 'id' is not present."
                instance: "/rest/3.0/getSegmentUsers"
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/createSegment:
    post:
      operationId: createSegment
      tags: [Segments and Targeting]
      summary: Create Segment
      description: |
        Creates a standard (condition-based) segment. Segments created through the REST API appear in the
        panel, with their Targeting Rules filled from the request.

        ### Capabilities

        - **Profile attribute conditions** — Match users by profile attribute values in `profile`.
        - **Tag conditions** — Match users by tag in `tags`.
        - **Behavior and response conditions** — Match users by behavior (`behaviors`,
          `behaviorAggregations`) or campaign response (`response`).
        - **Push permission** — Match users by push permission in `pushEnabled`.
        - **Condition trees** — Combine conditions with `AND` and `OR` in `targetJson`.

        ### How it works

        1. Send the segment definition. The body is the same as the one the panel uses to save a segment,
           and the same rules apply.
        2. The segment is saved with `segmentStatus` `WAITING_CALCULATE` and calculated asynchronously.
        3. Follow the status with `getSegment`. Wait for `READY` before sending to the segment.

        <details>

        <summary>Notes</summary>

        - The segment name must be unique in the application.
        - At least one condition is required.
        - The segment limit of the application package applies.
        - The server sets `createdBy` to `REST`.
        - The status, the user count, the segment type and the business unit are not read from the request.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentRequest'
            examples:
              profileAttribute:
                summary: Users whose email address contains a value
                value:
                  segment:
                    segmentName: Email contains example
                  profile:
                    type: PROFILE
                    expression:
                      code: email
                      operator: CONTAINS
                      values: [example]
              conditionGroup:
                summary: Email permission and a profile attribute
                value:
                  segment:
                    segmentName: Email opt-in and email contains example
                  targetJson:
                    id: group_1
                    type: GROUP
                    logic: AND
                    conditions:
                      - type: CHANNEL
                        operator: EQUALS
                        value: EMAIL
                        logic: AND
                      - type: PROFILE
                        operator: EQUALS
                        value: email
                        expression:
                          code: email
                          operator: CONTAINS
                          values: [example]
                        logic: AND
              tagAndProfile:
                summary: Tag and profile attribute
                value:
                  segment:
                    segmentName: Newsletter subscribers
                    profileConditionType: AND
                  tags:
                    type: TAG
                    logic: AND
                    code: TAG_ID
                  profile:
                    type: PROFILE
                    logic: AND
                    expression:
                      code: email
                      operator: CONTAINS
                      values: [example]
                  timeZone: Europe/Istanbul
      responses:
        '200':
          description: |
            The segment was saved and its calculation started. `segmentStatus` is
            `WAITING_CALCULATE` and `userCount` is `null` until the calculation finishes.
          x-netmera-verified: '2026-10-08'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
              example:
                segmentStatus: WAITING_CALCULATE
                userCount: null
                createdBy: REST
                name: Email contains example
                id: 5
                status: ACTIVE
        '400':
          description: |
            The segment was not saved:

            - A segment with the same name exists (5025, Segment name must be unique).
            - The segment limit of the application package is exceeded (5022, Service usage
              quota is exceeded).
            - The request has no condition ("Empty criteria").
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/updateSegment:
    post:
      operationId: updateSegment
      tags: [Segments and Targeting]
      summary: Update Segment
      description: |
        Replaces the conditions of a segment and calculates it again. The request is the same as for
        `createSegment`, with the segment ID in `segment.segmentId`.

        <details>

        <summary>Notes</summary>

        - The segment's Targeting Rules in the panel are updated to match the request.
        - The calculation is asynchronous. The response shows `WAITING_CALCULATE`; read the segment with
          `getSegment` to see the new result.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentRequest'
            example:
              segment:
                segmentId: 5
                segmentName: Email contains example
              profile:
                type: PROFILE
                expression:
                  code: email
                  operator: CONTAINS
                  values: [example.com]
      responses:
        '200':
          description: The segment was updated and its calculation started again.
          x-netmera-verified: '2026-10-08'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
              example:
                segmentStatus: WAITING_CALCULATE
                userCount: null
                createdBy: null
                name: Email contains example
                id: 5
                status: ACTIVE
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/changeSegmentStatus:
    post:
      operationId: changeSegmentStatus
      x-hideTryItPanel: true
      tags: [Segments and Targeting]
      summary: Change Segment Status
      description: |
        Deletes a segment, or reopens a deleted one. Send the segment ID and the new status in the query
        string; the request has no body.

        <details>

        <summary>Notes</summary>

        - A segment that an active campaign uses cannot be deleted.
        - A reopened segment counts against the segment limit of the application package again.
        - A reopened segment is calculated again. Wait for `READY` with `getSegment` before sending to it.

        </details>
      parameters:
        - name: id
          in: query
          required: true
          description: Segment ID.
          schema:
            type: integer
          example: 5
        - name: status
          in: query
          required: true
          description: |
            `DELETED` deletes the segment. `ACTIVE` reopens a deleted segment.
          schema:
            type: string
            enum: [DELETED, ACTIVE]
          example: DELETED
      responses:
        '200':
          description: |
            The status was changed. After a delete, `status` is `DELETED` and `segmentStatus`
            is `WAITING_DELETED`.
          x-netmera-verified: '2026-10-08'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
              example:
                segmentStatus: WAITING_DELETED
                userCount: 72
                createdBy: REST
                name: Email contains example
                id: 5
                status: DELETED
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/targeting/count:
    post:
      operationId: targetingCount
      tags: [Segments and Targeting]
      summary: Count Targeted Users
      description: |
        Returns the number of unique users who match a targeting query. Use it for popularity and adoption
        metrics based on profile data, without exporting user lists or building your own aggregation
        pipelines.

        ### Capabilities

        - **Social proof** — Show how many users chose, follow or like something.
        - **Entity popularity** — Count favorites, preferences, interests or affinity per entity.
        - **Content and product popularity** — Count interest in content, products, categories or brands.

        ### How it works

        `target` follows Netmera's standard targeting format. All parts that are sent are combined with AND:
        - **`profile`** — Profile attribute names, matched with a single value, several values (at least one
          must match) or operators such as `$exists`. Single-value and array attributes are handled the same
          way.
        - **`tag`** — A tag name, an array of names matched with OR, or an object with `$and`, `$or` or
          `$not`.
        - **`segment`** — A segment name, an array of names matched with OR, or an object with `$and` or
          `$not`.
        - **`location`** — `latitude`, `longitude` and `radius` in kilometres, all numeric.

        <details>

        <summary>Notes</summary>

        - Counts can be up to 2–3 hours old. They come from aggregation and caching, and the cache duration
          adapts to system load.
        - Real-time results are not guaranteed, but freshness is sufficient for social proof and popularity.
        - Counts match the Netmera panel when the targeting is identical.
        - The count reflects users matching at query time. The delivery audience of a message can differ
          slightly because of conditions applied at send time.
        - Only counts are returned; user lists are not exposed.
        - Attributes must be defined and active in the Netmera panel.
        - Tag, segment and profile attribute names are matched exactly, including letter case and spaces. An
          unknown name returns HTTP 400, code 2009.
        - Profile attributes are referenced by name. The `and`/`or` keywords themselves are
          case-insensitive.
        - Query several values in one request when possible.
        - Avoid polling the same entity repeatedly, and cache frequently displayed counts on your side.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: object
                  description: |
                    Filtering rules used to select users whose profiles match the given
                    conditions.
                  properties:
                    tag:
                      $ref: '#/components/schemas/TargetOperatorList'
                      description: |
                        Tag name, an array of tag names (OR), or an object with `$and`, `$or` or
                        `$not`. An unknown tag returns HTTP 400 with code `2009`.
                    segment:
                      $ref: '#/components/schemas/TargetOperatorList'
                      description: |
                        Segment name, an array of segment names (OR), or an object with `$and` or `$not`;
                        the `$or` object form is not supported, so use an array for OR. The segment must be
                        active and fully calculated.
                    location:
                      $ref: '#/components/schemas/Location'
                      description: |
                        Geographical area: `latitude`, `longitude` and `radius` (kilometres), all
                        required JSON numbers.
                  additionalProperties: true
            examples:
              singleAttributeValue:
                summary: Single attribute value
                description: Returns the number of users who have this value in the specified profile attribute.
                value:
                  target:
                    profile:
                      favoriteFootballPlayers: ["352481"]
              singleValueAttribute:
                summary: Single-value attribute
                description: Returns the number of users who selected this value.
                value:
                  target:
                    profile:
                      soccerFavoriteTeam: "2212"
              multipleValues:
                summary: Multiple values
                description: Returns the number of users who match at least one of the provided values.
                value:
                  target:
                    profile:
                      favoriteFootballPlayers: ["15", "23"]
              existsOperator:
                summary: Exists operator
                description: Returns the number of users whose profile does not contain the specified attribute.
                value:
                  target:
                    profile:
                      name:
                        $exists: false
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The distinct user count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of unique users matching the target.
              example:
                count: 184523
        '400':
          x-netmera-verified: '2026-11-01'
          description: "Missing target."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                missingTarget:
                  summary: "`target` is not sent."
                  value:
                    code: 2009
                    error: "Target must be provided"
                c2009_invalidJson_code:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2009_pleaseProvideConditionsToCheck_code:
                  summary: "`target` has no conditions, for example an empty object."
                  value:
                    code: 2009
                    error: "Please provide conditions to check"
                c2009_unrecognizedProfileKeyKey_code:
                  summary: "The profile attribute does not exist."
                  value:
                    code: 2009
                    error: "Unrecognized profile key '<key>'"
                c2009_invalidJsonStructure_code:
                  summary: "A condition uses an unsupported operator or an invalid `$btw` range."
                  value:
                    code: 2009
                    error: "Invalid Json Structure"
                c2009_pleaseSetAnExistingTag_code:
                  summary: "The tag does not exist."
                  value:
                    code: 2009
                    error: "Please set an existing tag"
                c2009_pleaseSetAnExistingSegment_code:
                  summary: "The segment does not exist."
                  value:
                    code: 2009
                    error: "Please set an existing segment"
                c2009_segmentNameIsNotActive_code:
                  summary: "The segment is not active."
                  value:
                    code: 2009
                    error: "Segment '<name>' is not active"
                c2009_pleaseSetLocationInfoProperly_code:
                  summary: "A `location` field is missing or not numeric."
                  value:
                    code: 2009
                    error: "Please set location info properly"
                c2004_definedConditionsCanNotBe_code:
                  summary: "An `$and`, `$or` or `$not` list for tags or segments is empty."
                  value:
                    code: 2004
                    error: "Defined conditions can not be empty"
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/targeting/count-batch:
    post:
      operationId: targetingCountBatch
      tags: [Segments and Targeting]
      summary: Count Users per Attribute Value
      description: |
        Returns the distinct user count for every value of one profile or installation attribute in a single
        request. Use it when you need counts for many values of the same attribute, for example one
        popularity figure per player, team or brand, instead of one `targeting/count` request per value.

        <details>

        <summary>Notes</summary>

        - `groupBy` is required and must contain either `profile` or `installation`. Otherwise the request
          is rejected with `400`.
        - At most 10000 values are returned, highest count first.
        - Counts come from a separate query on an analytics store, not the targeting engine used by
          `targeting/count`. The two endpoints can return different figures for the same attribute value.

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupBy]
              properties:
                groupBy:
                  type: object
                  description: |
                    Names the attribute to group by. Set exactly one of `profile` or
                    `installation`.
                  properties:
                    profile:
                      type: string
                      description: |
                        A User Profile Attribute name or code. Private attributes and unknown
                        attributes are rejected with HTTP 400 and code `2001`.
                    installation:
                      type: string
                      enum: [platform, appVersion, operator, model, source]
                      description: |
                        Device attribute: `platform`, `appVersion`, `operator`, `model` or `source`
                        (case-sensitive). Any other value is rejected with HTTP 400 and code `2001`.
                    buckets:
                      type: array
                      description: |
                        For numeric attributes: an array of `[min, max]` pairs. Counts are
                        returned per bucket instead of per individual value.
                      items:
                        type: array
                        items:
                          type: number
                values:
                  type: array
                  description: |
                    Restricts the result to these attribute values. When omitted, every value of
                    the attribute is returned.
                  items:
                    type: string
            examples:
              profileValues:
                summary: Breakdown by profile attribute values
                value:
                  groupBy:
                    profile: favoriteFootballPlayers
                  values: ["352481", "15", "23"]
              installationAttribute:
                summary: Breakdown by installation attribute
                value:
                  groupBy:
                    installation: platform
              numericBuckets:
                summary: Numeric buckets
                value:
                  groupBy:
                    profile: age
                    buckets: [[18, 24], [25, 34], [35, 44]]
      responses:
        '200':
          x-netmera-verified: '2026-10-27'
          description: The distinct user count per attribute value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    description: |
                      Distinct user count per attribute value, or per bucket when `buckets` is
                      set. When grouping by `installation: platform` the keys are platform display
                      names such as `iOS`, `Chrome` and `Android`.
                    additionalProperties:
                      type: integer
              example:
                counts:
                  "352481": 184523
                  "15": 9210
                  "23": 4487
        '400':
          description: "Missing grouping."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetmeraError'
              examples:
                missingGroupBy:
                  summary: "`groupBy` is not sent."
                  value:
                    code: 2009
                    error: "groupBy must be provided"
                c2009_invalidJson_code:
                  summary: "The body is not valid JSON."
                  value:
                    code: 2009
                    error: "Invalid JSON"
                c2009_groupbyProfileOrGroupbyInstallation_code:
                  summary: "`groupBy` has neither `profile` nor `installation`."
                  value:
                    code: 2009
                    error: "groupBy.profile or groupBy.installation must be provided"
                c2001_anUnexpectedErrorOccurredRetry_code:
                  summary: "Unknown or private profile attribute, or an unsupported installation attribute."
                  value:
                    code: 2001
                    error: "An unexpected error occurred. Retry later."
          x-netmera-verified: '2026-10-27'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/IpNotAllowed'


  /rest/3.0/count-user:
    get:
      operationId: countUsers
      tags: [Segments and Targeting]
      summary: Count Users with Push Permission
      description: |
        Returns the number of users in your application who currently have push permission. No parameters
