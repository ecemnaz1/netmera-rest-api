  /rest/3.0/removeEmail:
    post:
      operationId: removeEmail
      tags: [Email]
      summary: Remove email address
      description: |
        Removes the email address of a user. Only the email field is cleared: the user, its external ID,
        devices, profile attributes and email permission state are kept. A new address can be
        set later with `updateEmail`.

        The request is processed asynchronously. `200` means the request has been queued, and the
        change is applied to the user within seconds. A request whose `extId` matches no user in the
        application, or that targets a user whose email is already empty, also returns `200` and
        changes nothing.

        Sending an empty value to `updateEmail` does not remove the email address: the request returns `200` but the stored
        address is kept. `unsetProfileAttributes` does not remove it either, since email is a system field rather than a
        profile attribute. Use `removeEmail` to clear the address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extId]
              properties:
                extId:
                  type: string
                  description: External user ID of the user.
            example:
              extId: your_extId
      responses:
        '200':
          description: |
            The request was queued. Returns no response body.
        '400':
          description: |
            `extId` is missing or `null`. No user is changed.
          content:
            text/plain:
              schema:
                type: string
              example: Please provide an external id.

