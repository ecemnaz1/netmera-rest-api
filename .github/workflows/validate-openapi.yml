name: Validate OpenAPI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token; this workflow needs no secrets.
permissions:
  contents: read

jobs:
  validate:
    name: Validate spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.4

      - name: Parse YAML
        run: python3 -c "import yaml; yaml.safe_load(open('netmera-rest-api.yaml')); print('parses')"

      - name: Security guard
        run: python3 scripts/guard_spec.py netmera-rest-api.yaml

      - name: Lint OpenAPI
        # Two warning classes are expected and must not be "fixed":
        #   info-license          — the source documentation states no license.
        #   operation-4xx-response — error responses are documented only where the
        #                            specific failure has been observed or is documented
        #                            for that endpoint, never added generically.
        run: npx -y @redocly/cli@2.83.0 lint netmera-rest-api.yaml --format=stylish

      - name: Fetch baseline spec from base branch
        id: baseline
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE:netmera-rest-api.yaml" 2>/dev/null; then
            git show "$BASE:netmera-rest-api.yaml" > /tmp/baseline.yaml
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard live-verified responses
        run: |
          if [ "${{ steps.baseline.outputs.found }}" = "true" ]; then
            python3 scripts/check_verified.py netmera-rest-api.yaml /tmp/baseline.yaml
          else
            python3 scripts/check_verified.py netmera-rest-api.yaml
          fi
